<!doctype html><meta charset="utf-8"><style>body{background:#111827;color:#e5e7eb;font:14px sans-serif;margin:8px}button,select,input{padding:8px;background:#243449;color:inherit;border:1px solid #526078;border-radius:6px}section{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}img{width:100%;background:#000;aspect-ratio:1;object-fit:contain}figure{margin:0}#seek{width:95%}nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}</style>
<nav><select id="direction" aria-label="방향"></select><button id="previous">이전 프레임</button><button id="play">재생</button><button id="stop">중지</button><button id="next">다음 프레임</button><select id="fps" aria-label="재생 FPS"><option>4</option><option>8</option><option>12</option><option>16</option></select></nav>
<section><figure><img id="joints"><figcaption>HumanML3D 22관절</figcaption></figure><figure><img id="anny"><figcaption>ANNY 리그</figcaption></figure><figure><img id="pose"><figcaption>OpenPose COCO18</figcaption></figure></section><p id="count"></p><input id="seek" type="range" min="0" value="0" aria-label="프레임 선택">
<script>
const payload=__PLAYER_PAYLOAD__,result=payload.result,$=id=>document.getElementById(id);let index=0,timer=null;
const names={down_left:'전방 좌측',down_right:'전방 우측',up_left:'후방 좌측',up_right:'후방 우측'};
for(const direction of result.directions)$('direction').add(new Option(names[direction]||direction,direction));$('seek').max=result.frames-1;
function draw(){const n=String(index+1).padStart(4,'0'),root=payload.base+'/momask-generator/jobs/'+payload.id+'/result/',direction=$('direction').value;$('joints').src=root+(result.anny_frames?'openpose/':'')+direction+'/openpose-'+n+'.png';$('anny').hidden=!result.anny_frames;if(result.anny_frames)$('anny').src=root+'anny/'+direction+'/frames/anny-'+n+'.png';$('pose').hidden=!result.openpose_map_frames;if(result.openpose_map_frames)$('pose').src=root+'openpose-map/'+direction+'/openpose-map-'+n+'.png';$('count').textContent=(index+1)+' / '+result.frames+' 프레임';$('seek').value=index;}
function stop(){clearInterval(timer);timer=null;}function step(n){index=(index+n+result.frames)%result.frames;draw();}
$('play').onclick=()=>{stop();timer=setInterval(()=>step(1),1000/Number($('fps').value));};$('stop').onclick=stop;$('previous').onclick=()=>{stop();step(-1)};$('next').onclick=()=>{stop();step(1)};$('seek').oninput=()=>{stop();index=Number($('seek').value);draw()};$('direction').onchange=draw;$('fps').onchange=()=>{if(timer)$('play').click()};draw();
</script>
