window.showGenerationRecordResult=async record=>{
 const recordedRotationValue=record.request.render_settings?.rotation_y??record.request.attributes.rotation_y??0;
 for(const view of ['front','side']){const previousImageElement=document.querySelector('#'+view);previousImageElement.hidden=true;previousImageElement.removeAttribute('src');}
 if(record.request.kind==='preview'){await currentMeshPreview.loadPreviewRecord(record.id);currentMeshPreview.setPreviewRotation(Number(recordedRotationValue));}
 else await showPreparedPreview(record.id);
 renderStatusLabel.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'center'});
 renderStatusLabel.textContent='저장된 결과 · '+record.id+((record.request.attributes['hip-waist-up']||record.request.attributes['torso-muscle-dorsi-incr'])?' · 과거 결과는 기존 형태이며, 다음 생성부터 잠금 속성 0 적용':'');
};
window.restoreGenerationRecord=async record=>{historySelectionActive=true;
 attributeChangeVersion++;
 applyRenderRotation(record.request.render_settings?.rotation_y??record.request.attributes.rotation_y??0);
 assignAttributeValues(record.request.attributes);
 renderStatusLabel.textContent='저장된 입력값을 불러왔습니다. 수정 후 프리뷰 생성 또는 이미지 렌더를 실행하세요.';
};
</script><script src="/anny-attributes/history-ui.js"></script>
