<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>걷기 비교</title><style>
#directions{margin-bottom:16px}.toolbar{position:sticky;top:0;z-index:2}.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stage{height:min(48vh,470px);display:flex;justify-content:center;background-color:#283648;background-image:linear-gradient(45deg,#314053 25%,transparent 25%),linear-gradient(-45deg,#314053 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#314053 75%),linear-gradient(-45deg,transparent 75%,#314053 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}canvas{max-width:100%;height:100%;object-fit:contain}.strip{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:16px 0}.strip button{padding:5px}.strip canvas{width:100%;height:auto;display:block}#frameLabel{font-weight:700;min-width:90px}@media(max-width:750px){.compare{grid-template-columns:1fr}.stage{height:320px}.strip{grid-template-columns:repeat(4,1fr)}}
</style><header><div><h1>걷기 비교</h1><p>캐릭터와 리그의 같은 프레임을 비교하세요.</p></div><span class="badge">검수 후보 · 앵커 보정 전</span></header><main><nav id="directions" aria-label="방향 선택"></nav><div class="toolbar"><button id="previous">← 이전</button><button class="primary" id="play">재생</button><button id="next">다음 →</button><span id="frameLabel"></span><label>속도<select id="speed"><option value="150">기본 · 150ms</option><option value="300">느리게 · 300ms</option><option value="600">아주 느리게 · 600ms</option></select></label></div><div class="options"><a class="standalone-navigation" href="anchors.html">걷기 앵커 편집 →</a><label><input type="checkbox" id="feet">발 확대</label><label><input type="checkbox" id="overlay">리그 겹치기</label><label>불투명도<input id="opacity" type="range" min="0" max="100" value="35"></label><label><input type="checkbox" id="guides" checked>중앙선</label></div><div class="compare"><section class="panel"><h2>생성 캐릭터 <a id="sheetLink">원본 시트 ↗</a></h2><div class="stage"><canvas id="character" width="600" height="600"></canvas></div></section><section class="panel"><h2>리그 참조 <a id="rigLink">원본 시트 ↗</a></h2><div class="stage"><canvas id="rig" width="600" height="600"></canvas></div></section></div><div id="frames" class="strip"></div><p id="details"></p><p>← → 프레임 이동 · Space 재생/정지 · 프레임 선택 시 정지합니다. 겹치기는 셀 비율 기준이며 관절 정합 결과가 아닙니다.</p><p id="error" role="alert"></p></main><script>
const reviewAssetRecords=__ASSET_RECORDS__;
const directionLabelNames={down_left:'↙ 좌하',down_right:'↘ 우하',up_left:'↖ 좌상',up_right:'↗ 우상'};
const reviewFrameCount=8,reviewCanvasSize=600,footCropStartRatio=0.55;
let selectedDirectionName='down_left',selectedFrameIndex=2,animationPlaybackActive=false,previousPlaybackTime=0;
const loadedSheetImages={},frameButtonElements=[],directionButtonElements=[];
function selectReviewFrame(nextFrameIndex){animationPlaybackActive=false;selectedFrameIndex=(nextFrameIndex+reviewFrameCount)%reviewFrameCount;renderReviewPanels();}
function drawSheetFrame(targetCanvasElement,sourceSheetImage,sourceFrameIndex,zoomFeetEnabled,drawAlphaValue=1){const targetDrawContext=targetCanvasElement.getContext('2d');const sourceCellWidth=sourceSheetImage.naturalWidth/4,sourceCellHeight=sourceSheetImage.naturalHeight/2;const sourceCropRatio=zoomFeetEnabled?footCropStartRatio:0;targetDrawContext.globalAlpha=drawAlphaValue;const cropHeightValue=sourceCellHeight*(1-sourceCropRatio);const displayScaleValue=Math.min(targetCanvasElement.width/sourceCellWidth,targetCanvasElement.height/cropHeightValue);const displayWidthValue=sourceCellWidth*displayScaleValue,displayHeightValue=cropHeightValue*displayScaleValue;targetDrawContext.drawImage(sourceSheetImage,(sourceFrameIndex%4)*sourceCellWidth,Math.floor(sourceFrameIndex/4)*sourceCellHeight+sourceCellHeight*sourceCropRatio,sourceCellWidth,cropHeightValue,(targetCanvasElement.width-displayWidthValue)/2,(targetCanvasElement.height-displayHeightValue)/2,displayWidthValue,displayHeightValue);targetDrawContext.globalAlpha=1;}
function renderReviewPanels(){const selectedAssetRecord=reviewAssetRecords.find(currentAssetRecord=>currentAssetRecord.direction===selectedDirectionName);const characterSheetImage=loadedSheetImages[selectedAssetRecord.image],rigSheetImage=loadedSheetImages[`rig-${selectedDirectionName}.png`];if(!characterSheetImage||!rigSheetImage)return;const zoomFeetEnabled=document.querySelector('#feet').checked;for(const panelIdentifierText of ['character','rig']){const panelCanvasElement=document.querySelector('#'+panelIdentifierText);const panelDrawContext=panelCanvasElement.getContext('2d');panelDrawContext.clearRect(0,0,reviewCanvasSize,reviewCanvasSize);drawSheetFrame(panelCanvasElement,panelIdentifierText==='character'?characterSheetImage:rigSheetImage,selectedFrameIndex,zoomFeetEnabled);if(panelIdentifierText==='character'&&document.querySelector('#overlay').checked)drawSheetFrame(panelCanvasElement,rigSheetImage,selectedFrameIndex,zoomFeetEnabled,Number(document.querySelector('#opacity').value)/100);if(document.querySelector('#guides').checked){panelDrawContext.strokeStyle='#8bd7ff80';panelDrawContext.setLineDash([5,5]);panelDrawContext.beginPath();panelDrawContext.moveTo(300,0);panelDrawContext.lineTo(300,600);panelDrawContext.stroke();panelDrawContext.setLineDash([]);}}
frameButtonElements.forEach((currentButtonElement,currentFrameIndex)=>{currentButtonElement.setAttribute('aria-pressed',String(currentFrameIndex===selectedFrameIndex));const thumbnailCanvasElement=currentButtonElement.querySelector('canvas');thumbnailCanvasElement.getContext('2d').clearRect(0,0,120,120);drawSheetFrame(thumbnailCanvasElement,characterSheetImage,currentFrameIndex,false);});directionButtonElements.forEach(currentButtonElement=>currentButtonElement.setAttribute('aria-pressed',String(currentButtonElement.dataset.direction===selectedDirectionName)));document.querySelector('#frameLabel').textContent=`${selectedFrameIndex+1} / 8 프레임`;document.querySelector('#play').textContent=animationPlaybackActive?'일시정지':'재생';document.querySelector('#sheetLink').href=selectedAssetRecord.image;document.querySelector('#rigLink').href=`rig-${selectedDirectionName}.png`;document.querySelector('#details').textContent=`${directionLabelNames[selectedDirectionName]} · 원본 ${selectedAssetRecord.size.join(' × ')} · 4열 × 2행 · 위 행 1–4 / 아래 행 5–8`;}
for(const directionNameValue of Object.keys(directionLabelNames)){const directionButtonElement=document.createElement('button');directionButtonElement.textContent=directionLabelNames[directionNameValue];directionButtonElement.dataset.direction=directionNameValue;directionButtonElement.onclick=()=>{animationPlaybackActive=false;selectedDirectionName=directionNameValue;renderReviewPanels();};document.querySelector('#directions').append(directionButtonElement);directionButtonElements.push(directionButtonElement);}
for(let currentFrameIndex=0;currentFrameIndex<reviewFrameCount;currentFrameIndex++){const frameButtonElement=document.createElement('button');frameButtonElement.innerHTML=`<canvas width="120" height="120"></canvas>${currentFrameIndex+1}`;frameButtonElement.setAttribute('aria-label',`${currentFrameIndex+1}번 프레임`);frameButtonElement.onclick=()=>selectReviewFrame(currentFrameIndex);document.querySelector('#frames').append(frameButtonElement);frameButtonElements.push(frameButtonElement);}
document.querySelector('#previous').onclick=()=>selectReviewFrame(selectedFrameIndex-1);document.querySelector('#next').onclick=()=>selectReviewFrame(selectedFrameIndex+1);document.querySelector('#play').onclick=()=>{animationPlaybackActive=!animationPlaybackActive;previousPlaybackTime=performance.now();renderReviewPanels();};for(const controlSelectorText of ['#feet','#overlay','#opacity','#guides'])document.querySelector(controlSelectorText).oninput=renderReviewPanels;
document.addEventListener('keydown',keyboardEventValue=>{if(['INPUT','SELECT','BUTTON'].includes(keyboardEventValue.target.tagName))return;if(keyboardEventValue.code==='Space'){keyboardEventValue.preventDefault();document.querySelector('#play').click();}else if(keyboardEventValue.key==='ArrowLeft'){keyboardEventValue.preventDefault();selectReviewFrame(selectedFrameIndex-1);}else if(keyboardEventValue.key==='ArrowRight'){keyboardEventValue.preventDefault();selectReviewFrame(selectedFrameIndex+1);}});
function updatePlaybackClock(currentTimestampValue){if(animationPlaybackActive&&currentTimestampValue-previousPlaybackTime>=Number(document.querySelector('#speed').value)){selectedFrameIndex=(selectedFrameIndex+1)%reviewFrameCount;previousPlaybackTime=currentTimestampValue;renderReviewPanels();}requestAnimationFrame(updatePlaybackClock);}
Promise.all(reviewAssetRecords.flatMap(currentAssetRecord=>[currentAssetRecord.image,`rig-${currentAssetRecord.direction}.png`]).map(currentImageFilename=>new Promise((resolveImageLoad,rejectImageLoad)=>{const sourceImageElement=new Image();sourceImageElement.onload=()=>{loadedSheetImages[currentImageFilename]=sourceImageElement;resolveImageLoad();};sourceImageElement.onerror=()=>rejectImageLoad(new Error(`이미지 로드 실패: ${currentImageFilename}`));sourceImageElement.src=currentImageFilename;}))).then(()=>{renderReviewPanels();requestAnimationFrame(updatePlaybackClock);}).catch(currentErrorValue=>document.querySelector('#error').textContent=currentErrorValue.message);
</script></html>
