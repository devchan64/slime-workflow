<style>
/* 캔버스 비교·확대·프레임 탐색에 필요한 배치만 유지한다. 일반 입력의 외형은 덮어쓰지 않는다. */
#sprite-v2-root{container-type:inline-size}
.sv2-layout{display:flex;flex-wrap:wrap}
.sv2-layout>aside{flex:1 1 200px}
.sv2-layout>section{flex:3 1 600px}
.sv2-comparison{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.sv2-comparison>div,.sv2-panel,.sv2-viewport{min-width:0}
.sv2-viewport{overflow:auto;max-height:650px}
.sv2-viewport canvas{display:block;touch-action:none}
#sv2-frame-list{max-height:150px;overflow:auto;display:flex;flex-wrap:wrap}
#sv2-frame-list img{width:46px;height:46px;object-fit:contain}
#sv2-status,#sv2-difference{white-space:pre-wrap}
.sv2-hidden{display:none!important}
</style>
<main id="sprite-v2-root">

<p>참조와 프레임을 등록해 얼굴·신체 비율을 비교합니다. 원본을 보존하며 배치·배율을 편집합니다.</p>
<section class="sv2-panel"><h2>현재 작업 편집</h2><p id="sv2-project-summary" role="status">작업을 불러오세요.</p><p id="sv2-status" role="status" aria-live="polite">작업을 만들거나 불러오세요.</p></section>
<div class="sv2-layout">
<aside class="sv2-panel"><h2>프레임 목록 · 이미지 드롭</h2><div class="sv2-toolbar"><input id="sv2-file" class="sv2-hidden" type="file" accept="image/png,image/jpeg,image/webp" multiple></div><p>이미지를 끌어놓거나 Ctrl+V로 추가합니다. 투명도는 유지합니다.</p><div id="sv2-frame-list"></div></aside>
<section class="sv2-panel"><h2>참조 비교 · 정규화</h2>
<div class="sv2-comparison"><div><h3>레퍼런스</h3><div class="sv2-viewport"><canvas id="sv2-reference" width="384" height="384"></canvas></div></div><div><h3 id="sv2-frame-title">선택 프레임</h3><div class="sv2-viewport"><canvas id="sv2-frame" width="384" height="384"></canvas></div></div></div>
<p id="sv2-difference">얼굴 원과 신체 기준선을 맞춰 비교하세요.</p>
<div class="sv2-toolbar"><p id="sv2-target-summary" role="status">현재 프레임 · 이미지 배치</p></div>
<p id="sv2-numeric-summary" role="status">이미지를 선택해 좌표를 확인하세요.</p>
<h2>연결 재생</h2><div class="sv2-toolbar"><p id="sv2-timing-summary" role="status">작업을 불러와 재생 설정을 확인하세요.</p></div><input id="sv2-timeline" type="range" min="0" max="0" value="0" aria-label="현재 프레임" style="width:100%">

</section></div></main>
