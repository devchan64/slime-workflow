<!doctype html>
<meta charset="utf-8">
<title>이슬온 타일 맵 검수</title>
<style>body{margin:0;background:#15202b;color:#eef;font:14px sans-serif}main{max-width:1000px;margin:auto;padding:20px}canvas{image-rendering:pixelated;border:1px solid #789;background:#263747;width:min(90vw,768px);height:auto}.legend{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.swatch{display:inline-block;width:14px;height:14px;margin-right:4px;vertical-align:-2px}</style>
<main><h1>이슬온 타일 맵 검수</h1><input id="map-file" type="file" accept=".json,.yaml,.yml"><div id="summary">조립 결과 JSON을 선택하세요.</div><canvas id="map" width="768" height="576"></canvas><div class="legend"><span><i class="swatch" style="background:#83a85d"></i>지면</span><span><i class="swatch" style="background:#b97958"></i>도로</span><span><i class="swatch" style="background:#4c86a8"></i>물</span><span><i class="swatch" style="background:#6c7480"></i>구조물</span><span><i class="swatch" style="background:#b84f4f"></i>지붕</span></div></main>
<script type="module">
const canvas=document.querySelector('#map');const context=canvas.getContext('2d');const colors={grass:'#83a85d',road_horizontal:'#b97958',water:'#4c86a8',wall_stone:'#6c7480',door_wood:'#d5b16c',roof_red:'#b84f4f'};
function drawIsloonMap(map){const cellSize=Math.min(canvas.width/map.grid.columns,canvas.height/map.grid.rows);context.clearRect(0,0,canvas.width,canvas.height);for(const layerName of ['ground','object','roof'])for(const cell of map.layers[layerName]??[]){context.fillStyle=colors[cell.tile]??'#fff';context.fillRect(cell.column*cellSize,cell.row*cellSize,cellSize,cellSize);}context.strokeStyle='#24313d';context.globalAlpha=.22;for(let x=0;x<=map.grid.columns;x++){context.beginPath();context.moveTo(x*cellSize,0);context.lineTo(x*cellSize,map.grid.rows*cellSize);context.stroke()}for(let y=0;y<=map.grid.rows;y++){context.beginPath();context.moveTo(0,y*cellSize);context.lineTo(map.grid.columns*cellSize,y*cellSize);context.stroke()}context.globalAlpha=1;context.fillStyle='#fff';context.fillRect(map.spawn.column*cellSize+cellSize*.25,map.spawn.row*cellSize+cellSize*.25,cellSize*.5,cellSize*.5);document.querySelector('#summary').textContent=`${map.map_id} · ${map.grid.columns}×${map.grid.rows} · 연결 ${map.connections?.length??0}개 · 충돌 ${map.collision?.length??0}칸`}
document.querySelector('#map-file').onchange=async event=>{const file=event.target.files[0];if(!file)return;drawIsloonMap(JSON.parse(await file.text()))};
</script>
