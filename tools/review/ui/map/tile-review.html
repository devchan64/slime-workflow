<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>타일맵 검수</title><style>
body{margin:0;background:#16212a;color:#e6eef5;font:14px system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:24px}.tile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.tile-card,.panel{background:#202f3a;border:1px solid #3e5563;border-radius:12px;padding:16px}.tile-card h2{margin-top:0;font-size:16px}.tile-source{max-width:100%;display:block;image-rendering:auto;border-radius:8px;background:#52616c}.repeat-preview{height:300px;margin-top:12px;border-radius:8px;border:1px solid #4b6370;background-color:#5f7280;background-repeat:repeat;background-size:128px 128px}.map-preview{display:block;height:600px!important;max-height:600px;min-height:600px;overflow:auto;background:#101923;border-radius:8px;padding:8px}.map-preview canvas{display:block;margin:auto;max-width:none}.warning{color:#ffd693}.missing{color:#ffb5b5}code{color:#a8d8ff}@media(max-width:600px){main{padding:12px}.repeat-preview{height:220px}}
</style><main><h1 id="title"></h1><p id="summary"></p><section class="tile-grid" id="tileGrid"></section><section class="panel" id="heightPanel" hidden><h2>높이 변화 미리보기</h2><img id="heightPreview" class="tile-source" alt="바닥과 벽 타일 높이 변화 미리보기"></section><section class="panel" id="mapPanel" hidden><h2 id="mapTitle"></h2><p>노란 테두리가 지정 타일입니다. 역할을 바꾸면 해당 타일에 후보를 적용해 비교합니다.</p><label>적용 역할 <select id="mapVariant"></select></label><label>게임 카메라 배율 <input id="mapReviewZoom" type="range" min="0.5" max="2" step="0.1" value="2"><output id="mapReviewZoomValue">2.0×</output></label><div class="map-preview"><canvas id="mapCanvas"></canvas></div></section><section class="panel"><h2>검수 경고</h2><ul id="warnings"></ul></section></main><script>
const tileReviewData=__TILE_REVIEW_DATA__;
const tileImageLookup=new Map();
document.querySelector('#title').textContent=tileReviewData.assetId+' · 타일맵 검수';
document.querySelector('#summary').textContent=`${tileReviewData.tileSize.join(' × ')}px · ${tileReviewData.tileability} · 높이 ${tileReviewData.heightSteps}단계`;
for(const variantRecord of tileReviewData.variants){const card=document.createElement('section');card.className='tile-card';const heading=document.createElement('h2');heading.textContent=variantRecord.role;const image=document.createElement('img');image.className='tile-source';image.src=variantRecord.file;image.alt=variantRecord.role+' 최종 타일';const repeat=document.createElement('div');repeat.className='repeat-preview';repeat.style.backgroundImage=`url("${variantRecord.file}")`;repeat.style.backgroundSize=tileReviewData.tileSize[0]+'px '+tileReviewData.tileSize[1]+'px';card.append(heading,image,repeat);document.querySelector('#tileGrid').append(card);const loadedImage=new Image();loadedImage.src=variantRecord.file;tileImageLookup.set(variantRecord.role,loadedImage);}
if(tileReviewData.preview){document.querySelector('#heightPanel').hidden=false;document.querySelector('#heightPreview').src=tileReviewData.preview;}
for(const warningText of tileReviewData.qualityWarnings){const warningItem=document.createElement('li');warningItem.className='warning';warningItem.textContent=warningText;document.querySelector('#warnings').append(warningItem);}
function drawMapPreview(){const mapPreviewData=tileReviewData.mapPreview;if(!mapPreviewData)return;const cameraZoomValue=Number(document.querySelector('#mapReviewZoom').value),tileWidth=64*cameraZoomValue,tileHeight=32*cameraZoomValue,margin=32;document.querySelector('#mapReviewZoomValue').textContent=cameraZoomValue.toFixed(1)+'×';const canvas=document.querySelector('#mapCanvas');canvas.width=(mapPreviewData.columns+mapPreviewData.rows)*tileWidth/2+margin*2;canvas.height=(mapPreviewData.columns+mapPreviewData.rows)*tileHeight/2+margin*2;const drawContext=canvas.getContext('2d');const selectedVariantImage=tileImageLookup.get(document.querySelector('#mapVariant').value);const selectedCellKeys=new Set(mapPreviewData.targetCells.map(currentCellValue=>currentCellValue.column+','+currentCellValue.row));for(let rowIndex=0;rowIndex<mapPreviewData.rows;rowIndex++)for(let columnIndex=0;columnIndex<mapPreviewData.columns;columnIndex++){const centerX=margin+(columnIndex-rowIndex+mapPreviewData.rows)*tileWidth/2,centerY=margin+(columnIndex+rowIndex)*tileHeight/2;const cellKey=columnIndex+','+rowIndex;drawContext.save();drawContext.beginPath();drawContext.moveTo(centerX,centerY-tileHeight/2);drawContext.lineTo(centerX+tileWidth/2,centerY);drawContext.lineTo(centerX,centerY+tileHeight/2);drawContext.lineTo(centerX-tileWidth/2,centerY);drawContext.closePath();drawContext.clip();const terrainCode=mapPreviewData.terrainRows[rowIndex][columnIndex];drawContext.fillStyle=mapPreviewData.terrainCodes[terrainCode].color;drawContext.fill();if(selectedCellKeys.has(cellKey)&&selectedVariantImage.complete)drawContext.drawImage(selectedVariantImage,centerX-tileWidth/2,centerY-tileHeight/2,tileWidth,tileHeight);drawContext.restore();drawContext.strokeStyle=selectedCellKeys.has(cellKey)?'#ffd55a':'#233742';drawContext.lineWidth=selectedCellKeys.has(cellKey)?2:1;drawContext.beginPath();drawContext.moveTo(centerX,centerY-tileHeight/2);drawContext.lineTo(centerX+tileWidth/2,centerY);drawContext.lineTo(centerX,centerY+tileHeight/2);drawContext.lineTo(centerX-tileWidth/2,centerY);drawContext.closePath();drawContext.stroke();}}
if(tileReviewData.mapPreview){document.querySelector('#mapPanel').hidden=false;document.querySelector('#mapTitle').textContent=tileReviewData.mapPreview.displayNameKo+' · 지정 타일 적용';for(const variantRecord of tileReviewData.variants){const option=document.createElement('option');option.value=variantRecord.role;option.textContent=variantRecord.role;document.querySelector('#mapVariant').append(option);}document.querySelector('#mapVariant').onchange=drawMapPreview;document.querySelector('#mapReviewZoom').oninput=drawMapPreview;for(const loadedImage of tileImageLookup.values())loadedImage.onload=drawMapPreview;drawMapPreview();}
</script></html>
