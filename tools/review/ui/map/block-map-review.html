<!doctype html><html lang="ko"><meta charset="utf-8"><title>마을 맵 검수</title><link rel="stylesheet" href="/management/style.css"><style>
.map-review-workspace{display:flex;flex-direction:column;gap:10px;font-family:sans-serif}
.map-review-workspace header{display:grid;gap:8px;margin:0}
.map-review-workspace .map-review-title-row{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap}
.map-review-workspace .map-toolbar{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.map-review-workspace .map-toolbar-group{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:7px 9px;background:var(--panel,#192230);border:1px solid var(--line,#354457);border-radius:8px}
.map-review-workspace .map-toolbar-group-title{color:var(--muted,#a7b5c8);font-size:11px;font-weight:700}
.map-review-workspace h2{font-size:16px;margin:0}
.map-review-workspace button,.map-review-workspace select{padding:6px 10px;min-height:34px}
.map-review-workspace .map-select-field{gap:5px;font-weight:600}
.map-review-workspace .map-select-control{position:relative;display:inline-flex;align-items:center}
.map-review-workspace .map-select-control::after{content:'▼';position:absolute;right:9px;color:#dce8f6;font-size:11px;line-height:1;pointer-events:none}
.map-review-workspace .map-select-control select{appearance:none;min-width:108px;padding-right:30px;background:#26364a;color:#f4f7fb;border:1px solid #60738b;border-radius:6px;font-weight:600}
.map-review-workspace select:focus{outline:2px solid #7d72ff;outline-offset:2px}
.map-review-workspace select:disabled{background:#313b49;color:#aab6c6;border-color:#536273}
.map-review-workspace select option{background:#182535;color:#f4f7fb}
.map-review-workspace p{font-size:12px;margin:0}
.map-review-workspace .map-review-status{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--panel,#192230);border:1px solid var(--line,#354457);border-radius:8px;color:var(--muted,#a7b5c8)}
.map-review-workspace .map-review-status strong{color:var(--text,#f4f7fb)}
.map-review-workspace details{font-size:12px}
.map-review-workspace .applied-tile-sources{display:grid;gap:6px;padding:10px 12px;background:#1f3146;border:1px solid #48617f;border-radius:8px;font-size:12px}
.map-review-workspace .applied-tile-sources summary{cursor:pointer;font-size:13px;font-weight:700;color:#f4f7fb}
.map-review-workspace .applied-tile-sources ul{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.map-review-workspace .applied-tile-sources li{display:flex;gap:5px;align-items:center;padding:4px 7px;background:#26364a;border-radius:5px;color:#dce8f6}
.map-review-workspace .applied-tile-sources img{width:42px;height:42px;object-fit:cover;border:1px solid #60738b;border-radius:4px;background:#10151f}
.map-review-workspace .applied-tile-sources .tile-source-warning{color:#ffd166;font-weight:700}
.map-review-workspace .applied-tile-sources .tile-source-warning-description{color:#ffe4a0}
.map-review-workspace canvas{touch-action:none;cursor:grab;width:100%;height:clamp(420px,calc(100dvh - 260px),760px);background:var(--page,#17202e);border:1px solid var(--line,#354457);border-radius:8px}
.map-review-workspace canvas:focus-visible{outline:2px solid var(--accent,#a7c8ff);outline-offset:3px}
@media(max-width:700px){.map-review-workspace canvas{height:65dvh;min-height:320px}.map-review-workspace .map-toolbar{display:grid;grid-template-columns:1fr}.map-review-workspace .map-toolbar-group{justify-content:flex-start}}
</style><main class="map-review-workspace"><header><div class="map-review-title-row"><h2 id="map-title">마을 맵 검수</h2><label class="map-select-field">마을 맵 <span class="map-select-control"><select id="map-select" aria-label="마을 맵 선택"></select></span></label><button id="load-map">맵 불러오기</button></div><div class="map-toolbar" aria-label="마을 맵 검수 도구"><section class="map-toolbar-group" aria-label="시점 도구"><span class="map-toolbar-group-title">시점</span><button id="rotate">90° 회전</button><button id="zoom-out" aria-label="지도 축소">− 축소</button><output id="zoom-level" aria-live="polite"></output><button id="zoom-in" aria-label="지도 확대">+ 확대</button><button id="actual-size">사람 중심 · 100%</button><button id="fit">전체 보기</button></section><section class="map-toolbar-group" aria-label="검수 대상"><span class="map-toolbar-group-title">검수 대상</span><label class="map-select-field">건물 <span class="map-select-control"><select id="building" aria-label="건물 선택"><option value="">건물 선택</option></select></span></label></section><section class="map-toolbar-group" aria-label="표시 옵션"><span class="map-toolbar-group-title">표시</span><label><input id="show-character" type="checkbox" checked>기본 캐릭터 · 높이 80</label><label><input id="edges" type="checkbox">블록 경계</label></section></div></header><details><summary>조작 방법 · 타일 안내</summary><p>등록 타일 적용 · 벽·경사 지붕은 블록 면에 투영 · 미등록 지형(갈대·자갈·바위)은 임시 색상 · 휠 또는 +/−로 확대·축소, 드래그 또는 방향키로 지도 이동 · 0 키로 전체 보기를 적용합니다. 이동 가능한 바닥을 클릭하면 기본 캐릭터를 배치합니다.</p></details><details class="applied-tile-sources"><summary>적용 타일 원본</summary><ul id="applied-tile-list" aria-live="polite"></ul></details><p id="status" class="map-review-status" role="status">불러오는 중</p><canvas id="map" tabindex="0" aria-label="마을 맵. 방향키로 이동하고 더하기와 빼기 키로 확대 또는 축소하며 0 키로 전체 보기를 적용합니다."></canvas></main><script type="module" src="block-map-review.js"></script></html>
