<!doctype html><html lang="ko"><meta charset="utf-8"><title>마을 맵 검수</title><link rel="stylesheet" href="/management/style.css"><style>body{margin:16px;background:#101823;color:#dce5ef;font-family:sans-serif}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}canvas{touch-action:none;cursor:grab;width:100%;height:75vh;background:#17202e;border:1px solid #354457}button,select{padding:8px;background:#24364b;color:inherit;border:1px solid #456}p{font-size:14px}</style><header><h2 id="map-title">마을 맵 검수</h2><label>마을 맵 <select id="map-select" aria-label="마을 맵"></select></label><button id="load-map">맵 불러오기</button><button id="rotate">90° 회전</button><button id="zoom-out" aria-label="지도 축소">− 축소</button><output id="zoom-level" aria-live="polite"></output><button id="zoom-in" aria-label="지도 확대">+ 확대</button><button id="fit">전체 보기</button><select id="building"><option value="">건물 선택</option></select><label><input id="edges" type="checkbox" checked>블록 경계</label></header><p>등록 타일 적용 · 벽·경사 지붕은 블록 면에 투영 · 미등록 지형(갈대·자갈·바위)은 임시 색상 · 휠로 확대·축소, 드래그로 지도 이동 · 이동 가능한 바닥을 클릭하면 검수 마커를 배치합니다.</p><p id="status">불러오는 중</p><canvas id="map"></canvas><script type="module" src="block-map-review.js"></script></html>
