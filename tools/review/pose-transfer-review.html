<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3참조 포즈 전이 비교</title><style>
body{margin:0;background:#14202a;color:#e9f1f6;font:14px system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:24px}.toolbar,.panel{background:#202f3a;border:1px solid #3e5563;border-radius:12px;padding:14px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:2}.compare{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}.panel h2{margin:0 0 10px;font-size:16px}.stage{background:#111a22;min-height:320px;display:grid;place-items:center}.stage img{display:block;max-width:100%;max-height:52vh;image-rendering:auto}.strip{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:16px}.strip button{background:#263946;color:#e9f1f6;border:1px solid #526875;border-radius:6px;padding:4px}.strip button[aria-pressed=true]{border-color:#ffdc78;box-shadow:0 0 0 2px #ffdc7844}.strip img{width:100%;display:block}.muted{color:#aac0cb}@media(max-width:850px){.compare{grid-template-columns:1fr}.stage{min-height:240px}}
</style><main><h1>3참조 포즈 전이 비교</h1><p class="muted" id="reportLabel"></p><div class="toolbar"><label>방향 <select id="directionChoice"></select></label><button id="previous">← 이전</button><button id="next">다음 →</button><span id="frameLabel"></span><label><input id="overlayToggle" type="checkbox">결과 위에 리그 겹치기</label><label>투명도 <input id="overlayOpacity" type="range" min="0" max="100" value="45"></label></div><section class="compare"><article class="panel"><h2>Qwen 결과 캐릭터</h2><div class="stage"><img id="resultImage" alt="Qwen 결과 캐릭터"></div></article><article class="panel"><h2>리그 참조</h2><div class="stage"><img id="rigImage" alt="리그 참조"></div></article><article class="panel"><h2>OpenPose 참조</h2><div class="stage"><img id="openposeImage" alt="OpenPose 참조"></div></article></section><div class="strip" id="frameStrip"></div><p id="frameDetails"></p></main><script>
const poseTransferData=__POSE_TRANSFER_DATA__;const directionLabels={down_left:'↙ 좌하',down_right:'↘ 우하',up_left:'↖ 좌상',up_right:'↗ 우상'};let selectedDirection='down_left',selectedFrame=1;const directionChoice=document.querySelector('#directionChoice');for(const directionName of Object.keys(directionLabels)){const option=document.createElement('option');option.value=directionName;option.textContent=directionLabels[directionName];directionChoice.append(option)}document.querySelector('#reportLabel').textContent=poseTransferData.report+' · 결과·리그·OpenPose 기준 비교';function currentDirection(){return poseTransferData.directions.find(record=>record.direction===selectedDirection)}function currentFrame(){return currentDirection().frames.find(record=>record.frame===selectedFrame)}function render(){const frame=currentFrame();for(const [elementId,roleName] of [['resultImage','result'],['rigImage','rig'],['openposeImage','openpose']]){const element=document.querySelector('#'+elementId);element.src=frame.files[roleName].path;element.style.opacity=roleName==='result'&&document.querySelector('#overlayToggle').checked?document.querySelector('#overlayOpacity').value/100:1}document.querySelector('#frameLabel').textContent=`${selectedFrame} / 8 프레임`;document.querySelector('#frameDetails').textContent=`${directionLabels[selectedDirection]} · ${frame.size.join(' × ')} · 모델 ${frame.modelRevision}`;document.querySelectorAll('#frameStrip button').forEach((button,index)=>button.setAttribute('aria-pressed',String(index+1===selectedFrame)))}function rebuildStrip(){const strip=document.querySelector('#frameStrip');strip.innerHTML='';for(let frameNumber=1;frameNumber<=8;frameNumber++){const button=document.createElement('button');button.innerHTML=`<img src="${currentDirection().frames[frameNumber-1].files.result.path}" alt="${frameNumber}번 결과">${frameNumber}`;button.onclick=()=>{selectedFrame=frameNumber;render()};strip.append(button)}}directionChoice.onchange=()=>{selectedDirection=directionChoice.value;selectedFrame=1;rebuildStrip();render()};document.querySelector('#previous').onclick=()=>{selectedFrame=(selectedFrame+6)%8+1;render()};document.querySelector('#next').onclick=()=>{selectedFrame=selectedFrame%8+1;render()};for(const selector of ['#overlayToggle','#overlayOpacity'])document.querySelector(selector).oninput=render;rebuildStrip();render();</script></html>
