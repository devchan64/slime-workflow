<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ANNY 속성 렌더러</title>
<style>
body{margin:0;background:#101814;color:#e7f2e9;font:14px/1.5 system-ui}main{max-width:1400px;margin:auto;padding:24px}h1{margin:0}header p{color:#abc4b3}.layout{display:grid;grid-template-columns:350px 1fr;gap:20px}.layout>aside{contain:size;min-height:0;display:flex;flex-direction:column;overflow:hidden}.attribute-panel-header{flex:none;padding-bottom:14px;border-bottom:1px solid #365441}.attribute-panel-header h2{margin-top:0}.attribute-scroll-region{flex:1;min-height:0;overflow-y:auto;scrollbar-gutter:stable;overscroll-behavior-y:contain;padding-right:8px}.layout>section{min-width:0}aside,section{background:#19271f;border:1px solid #365441;border-radius:12px;padding:18px}fieldset{min-width:0;margin:18px 0;padding:8px 14px;border:1px solid #365441;border-radius:8px}.attribute-lock-badge{display:inline-block;margin-left:8px;padding:2px 7px;border:1px solid #8d9b73;border-radius:5px;background:#35412d;color:#e3edc9;font-size:12px;vertical-align:middle}input:disabled{opacity:.55;cursor:not-allowed}legend{padding:0 8px;color:#a5e4b6;font-weight:650}small{color:#abc4b3;overflow-wrap:anywhere}label{display:block;margin:14px 0}input[type=range]{width:75%;accent-color:#81d49a}output{float:right}button{padding:10px;background:#31563e;color:white;border:1px solid #65866f;border-radius:6px;cursor:pointer}.views{display:grid;grid-template-columns:1fr 1fr;gap:12px}figure{margin:0}img{width:100%;min-height:200px;object-fit:contain}pre{white-space:pre-wrap;max-height:220px;overflow:auto}#status{padding:12px;background:#0d1912}details{margin-top:16px}@media(max-width:800px){.layout{grid-template-columns:1fr}.layout>aside{contain:none;max-height:70dvh}}
</style>
<main><header><h1>ANNY 속성 렌더러</h1><p>현재 캐릭터의 체형을 수정하면 자동으로 프리뷰를 갱신합니다.</p></header><div class="layout"><aside><div class="attribute-panel-header"><h2>신체 속성</h2><button id="reset">신체 기준값 복원</button></div><div class="attribute-scroll-region" tabindex="0" aria-label="신체 속성 스크롤 목록"><p>허벅지 회전은 저장된 본의 실제 회전 벡터 Z값입니다. 현재 설정은 왼쪽 +8°, 오른쪽 −8°입니다. 다른 축은 기존 값을 유지합니다.</p><div id="fields"></div></div></aside><section><p id="status" role="status">기준값을 불러오는 중</p><h2>렌더링 설정</h2><label for="render-rotation-y">Y축 회전 (°)</label><input id="render-rotation-y" type="range" min="-180" max="180" step="5" value="0"><output id="render-rotation-value">0</output><p><button id="retry">이미지 렌더</button></p><h2>웹 3D 프리뷰</h2><p>드래그하여 회전 · 휠로 확대/축소 · 체형 변경 시 메시 갱신</p><canvas id="mesh-preview" style="width:100%;height:520px;touch-action:none" aria-label="ANNY 3D 프리뷰"></canvas><h2>이미지 렌더 결과</h2><div class="views"><figure><figcaption>선택한 회전 각도</figcaption><img id="front" alt="정면 프리뷰" hidden></figure><figure><figcaption>선택 각도 + 90°</figcaption><img id="side" alt="측면 프리뷰" hidden></figure></div><details id="logs"><summary>렌더 로그</summary><pre id="log"></pre></details></section></div><section id="generation-history" data-route="/anny-attributes"></section></main>
<script src="/anny-attributes/mesh-viewer.js"></script><script>
const attributeFieldSpecs=[['age','나이',0,1],['weight','체중',0,1],['height','키',0,1],['torso-scale-horiz-incr','몸통 너비',-1,1],['torso-scale-depth-incr','몸통 깊이',-1,1],['measure-shoulder-dist-incr','어깨 너비',-1,1],['upperlegs-height-incr','허벅지 길이',-1,1],['lowerlegs-height-incr','종아리 길이',-1,1]];
attributeFieldSpecs.push(['upperleg_left_rotation_z','왼쪽 허벅지 본 회전 Z (°)',-180,180],['upperleg_right_rotation_z','오른쪽 허벅지 본 회전 Z (°)',-180,180]);
for(const [partLabelValue,partDisplayLabel] of [['upperarm','위팔'],['lowerarm','아래팔']])for(const [sideLabelValue,sideDisplayLabel] of [['left','왼쪽'],['right','오른쪽']])for(const axisLabelValue of ['x','y','z'])attributeFieldSpecs.push([`${partLabelValue}_${sideLabelValue}_rotation_${axisLabelValue}`,`${sideDisplayLabel} ${partDisplayLabel} 본 ${axisLabelValue.toUpperCase()} 회전 (°)`,-180,180]);
const attributeFieldPanel=document.querySelector('#fields'),renderStatusLabel=document.querySelector('#status');
let currentMeshPreview;try{currentMeshPreview=new AnnyMeshPreview(document.querySelector('#mesh-preview'))}catch(error){renderStatusLabel.textContent=error.message}
let historySelectionActive=false,baselineAttributeValues,attributeChangeVersion=0,activeRenderPromise=null,pendingRenderTimer;
const renderRotationControl=document.querySelector('#render-rotation-y');
renderRotationControl.oninput=()=>{document.querySelector('#render-rotation-value').textContent=renderRotationControl.value;currentMeshPreview?.setPreviewRotation(Number(renderRotationControl.value))};
const collectAttributeValues=()=>Object.fromEntries([...attributeFieldPanel.querySelectorAll('input')].map(input=>[input.name,Number(input.value)]));
async function fetchRenderRecord(url,options){const response=await fetch(url,options);const record=await response.json();if(!response.ok)throw Error(record.error||'요청 실패');return record}
function scheduleAttributeRender(){historySelectionActive=false;attributeChangeVersion++;clearTimeout(pendingRenderTimer);renderStatusLabel.textContent='변경값 적용 대기 중';pendingRenderTimer=setTimeout(()=>requestAttributeRender(false),500)}
async function showPreparedPreview(recordId){
 await Promise.all(['front','side'].map(async view=>{const target=document.querySelector('#'+view);const url='/anny-attributes/jobs/'+recordId+'/'+view+'.png';if(target.getAttribute('src')===url)return;const image=new Image();image.src=url;await image.decode();target.src=url;target.hidden=false}));
}
async function requestAttributeRender(renderFinalImages=false){
 if(activeRenderPromise)return;
 const requestedChangeVersion=attributeChangeVersion;
 activeRenderPromise=(async()=>{
 try{
 renderStatusLabel.textContent=renderFinalImages?'이미지 렌더 중':'웹 프리뷰 메시 생성 중';
 const record=await fetchRenderRecord('/anny-attributes/'+(renderFinalImages?'render':'preview'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...collectAttributeValues(),rotation_y:Number(renderRotationControl.value)})});
 let state,loadedMeshPreview=false;
 do{await new Promise(resolve=>setTimeout(resolve,1000));state=await fetchRenderRecord('/anny-attributes/jobs/'+record.id);if(state.mesh_ready&&!loadedMeshPreview&&requestedChangeVersion===attributeChangeVersion){await currentMeshPreview.loadPreviewRecord(record.id);currentMeshPreview.setPreviewRotation(Number(renderRotationControl.value));loadedMeshPreview=true;}if(state.preview_ready&&requestedChangeVersion===attributeChangeVersion){await showPreparedPreview(record.id);renderStatusLabel.textContent='프리뷰 준비 완료 · 후속 작업 처리 중';}document.querySelector('#log').textContent=state.log||'';if(document.querySelector('#logs').open){const log=document.querySelector('#log');log.scrollTop=log.scrollHeight}}while(state.status==='running');
 if(requestedChangeVersion!==attributeChangeVersion)return;
 if(state.status!=='completed')throw Error('렌더 실패 · 로그를 확인하세요.');
 if(renderFinalImages)await showPreparedPreview(record.id);
 renderStatusLabel.textContent=(renderFinalImages?'이미지 렌더 완료 · ':'웹 프리뷰 준비 완료 · ')+record.id;
 if(typeof refreshGenerationHistory==='function')refreshGenerationHistory();
 }catch(error){renderStatusLabel.textContent=error.message}
 })();
 await activeRenderPromise;activeRenderPromise=null;
 if(requestedChangeVersion!==attributeChangeVersion&&!historySelectionActive)requestAttributeRender();
}
function restoreAttributeDefaults(){for(const input of attributeFieldPanel.querySelectorAll('input')){input.value=baselineAttributeValues.phenotype_kwargs[input.name]??baselineAttributeValues.local_changes_kwargs[input.name]??baselineAttributeValues.facial_actions[input.name]??baselineAttributeValues.bone_rotation_defaults[input.name]??0;input.nextElementSibling.textContent=input.value}scheduleAttributeRender()}
document.querySelector('#reset').onclick=restoreAttributeDefaults;
document.querySelector('#retry').onclick=()=>{if(activeRenderPromise){renderStatusLabel.textContent='프리뷰 갱신 완료 후 이미지 렌더를 실행하세요.';return}requestAttributeRender(true)};
fetchRenderRecord('/anny-attributes/base').then(record=>{
 baselineAttributeValues=record;
 const attributeKoreanLabels={'torso-muscle-dorsi-incr':'등 근육 형태','gender':'성별','head-scale-vert-incr':'머리 높이','head-age-incr':'머리 나이','head-scale-depth-incr':'머리 깊이','head-scale-horiz-incr':'머리 너비','hip-scale-horiz-incr':'골반 너비','hip-scale-depth-incr':'골반 깊이','hip-waist-up':'골반 허리 높이','measure-neck-circ-incr':'목 둘레','measure-neck-height-incr':'목 길이','neck-scale-depth-incr':'목 깊이','neck-scale-horiz-incr':'목 너비','neck-scale-vert-incr':'목 높이','measure-waisttohip-dist-incr':'허리–골반 거리','measure-waist-circ-incr':'허리 둘레','torso-scale-vert-incr':'몸통 높이','l-hand-scale-incr':'왼손 크기','r-hand-scale-incr':'오른손 크기','l-foot-scale-incr':'왼발 크기','r-foot-scale-incr':'오른발 크기','measure-ankle-circ-incr':'발목 둘레'};
 for(const attributeGroupName of ['phenotype_kwargs','local_changes_kwargs','facial_actions'])for(const attributeFieldName of Object.keys(record[attributeGroupName])){
  if(!attributeFieldSpecs.some(attributeSpecValues=>attributeSpecValues[0]===attributeFieldName))attributeFieldSpecs.push([attributeFieldName,attributeKoreanLabels[attributeFieldName]||attributeFieldName,attributeGroupName==='local_changes_kwargs'?-1:0,1]);
 }
 const baselinePoseDetails=document.createElement('details');const baselinePoseSummary=document.createElement('summary');baselinePoseSummary.textContent='공식 기본 자세와 다른 본 설정';baselinePoseDetails.append(baselinePoseSummary);
 for(const [poseBoneName,poseMatrixValues] of Object.entries(record.pose_parameters)){
  if(poseMatrixValues.some((matrixRowValues,rowIndexValue)=>matrixRowValues.some((matrixCellValue,columnIndexValue)=>Math.abs(matrixCellValue-(rowIndexValue===columnIndexValue?1:0))>1e-6))){const poseMatrixDisplay=document.createElement('pre');poseMatrixDisplay.textContent=poseBoneName+' (local-ref)\n'+poseMatrixValues.map(matrixRowValues=>matrixRowValues.map(matrixCellValue=>matrixCellValue.toFixed(5)).join('  ')).join('\n');baselinePoseDetails.append(poseMatrixDisplay)}
 }
 attributeFieldPanel.after(baselinePoseDetails);
 const attributeGroupPanels={};
 for(const groupDisplayName of ['기본 체형','상체 체형','상체 본 회전','머리·목','하체·기타']){const groupPanelElement=document.createElement('fieldset');const groupTitleElement=document.createElement('legend');groupTitleElement.textContent=groupDisplayName;groupPanelElement.append(groupTitleElement);attributeFieldPanel.append(groupPanelElement);attributeGroupPanels[groupDisplayName]=groupPanelElement}
 for(const [name,label,min,max] of attributeFieldSpecs){const row=document.createElement('label');row.textContent=label;if(name==='hip-waist-up'){const attributeLockBadge=document.createElement('span');attributeLockBadge.className='attribute-lock-badge';attributeLockBadge.textContent='🔒 잠금';attributeLockBadge.title='기준값 0으로 고정되어 수정할 수 없습니다.';row.append(attributeLockBadge)}const input=document.createElement('input');input.type='range';input.name=name;input.disabled=name==='hip-waist-up';input.min=min;input.max=max;input.step=name.includes('_rotation_')?'any':.05;input.setAttribute('aria-label',label);row.append(document.createElement('br'),input,document.createElement('output'));if(name in record.phenotype_kwargs||name in record.local_changes_kwargs||name in record.facial_actions){const attributeDefaultHint=document.createElement('small');const officialDefaultValue=name in record.phenotype_kwargs?.5:0;const currentDefaultValue=record.phenotype_kwargs[name]??record.local_changes_kwargs[name]??record.facial_actions[name];attributeDefaultHint.textContent=`${name} · 공식 기본 ${officialDefaultValue} / 현재 설정 ${currentDefaultValue}`;if(name==='hip-waist-up')attributeDefaultHint.textContent+=' · 0으로 잠금';attributeDefaultHint.style.display='block';row.append(attributeDefaultHint)}const attributeGroupName=/^(upperarm|lowerarm)_/.test(name)?'상체 본 회전':/torso|shoulder|waist-circ|hand/.test(name)?'상체 체형':/head|neck/.test(name)?'머리·목':name in record.phenotype_kwargs?'기본 체형':'하체·기타';attributeGroupPanels[attributeGroupName].append(row)}
 attributeFieldPanel.oninput=event=>{event.target.nextElementSibling.textContent=event.target.value;scheduleAttributeRender()};
 restoreAttributeDefaults();
 fetchRenderRecord('/anny-attributes/history').then(payload=>{const latest=payload.records.find(item=>item.request.kind==='preview'&&item.status.status==='completed');if(latest&&attributeChangeVersion===1)window.restoreGenerationRecord(latest)}).catch(()=>{});
}).catch(error=>renderStatusLabel.textContent=error.message);
window.restoreGenerationRecord=record=>{historySelectionActive=true;
 clearTimeout(pendingRenderTimer);attributeChangeVersion++;
 renderRotationControl.value=record.request.render_settings?.rotation_y??record.request.attributes.rotation_y??0;renderRotationControl.oninput();
 for(const input of attributeFieldPanel.querySelectorAll('input')){input.value=input.name==='hip-waist-up'?0:record.request.attributes[input.name]??baselineAttributeValues.phenotype_kwargs[input.name]??baselineAttributeValues.local_changes_kwargs[input.name]??baselineAttributeValues.facial_actions[input.name]??baselineAttributeValues.bone_rotation_defaults[input.name]??0;input.nextElementSibling.textContent=input.value}
 if(record.request.kind==='preview'){currentMeshPreview.loadPreviewRecord(record.id).then(()=>currentMeshPreview.setPreviewRotation(Number(renderRotationControl.value))).catch(error=>renderStatusLabel.textContent=error.message)}
 else for(const view of ['front','side']){const image=document.querySelector('#'+view);image.src='/anny-attributes/jobs/'+record.id+'/'+view+'.png';image.hidden=false}
 renderStatusLabel.textContent='저장된 결과 · '+record.id+(record.request.attributes['hip-waist-up']?' · 과거 결과는 기존 형태이며, 다음 생성부터 골반 허리 높이 0 적용':'');
};
</script><script src="/anny-attributes/history-ui.js"></script>
