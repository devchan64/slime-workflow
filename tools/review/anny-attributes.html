<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ANNY 속성 렌더러</title>
<style>
body{margin:0;background:#101814;color:#e7f2e9;font:14px/1.5 system-ui}main{max-width:1400px;margin:auto;padding:24px}h1{margin:0}header p{color:#abc4b3}.layout{display:grid;grid-template-columns:350px 1fr;gap:20px}aside,section{background:#19271f;border:1px solid #365441;border-radius:12px;padding:18px}label{display:block;margin:14px 0}input[type=range]{width:75%;accent-color:#81d49a}output{float:right}button{padding:10px;background:#31563e;color:white;border:1px solid #65866f;border-radius:6px;cursor:pointer}.views{display:grid;grid-template-columns:1fr 1fr;gap:12px}figure{margin:0}img{width:100%;min-height:200px;object-fit:contain}pre{white-space:pre-wrap;max-height:220px;overflow:auto}#status{padding:12px;background:#0d1912}details{margin-top:16px}@media(max-width:800px){.layout{grid-template-columns:1fr}}
</style>
<main><header><h1>ANNY 속성 렌더러</h1><p>현재 캐릭터의 체형을 수정하면 자동으로 프리뷰를 갱신합니다.</p></header><div class="layout"><aside><button id="reset">기준값 복원</button> <button id="retry">다시 렌더</button><div id="fields"></div></aside><section><p id="status" role="status">기준값을 불러오는 중</p><div class="views"><figure><figcaption>선택한 회전 각도</figcaption><img id="front" alt="정면 프리뷰" hidden></figure><figure><figcaption>선택 각도 + 90°</figcaption><img id="side" alt="측면 프리뷰" hidden></figure></div><details id="logs"><summary>렌더 로그</summary><pre id="log"></pre></details></section></div><section id="generation-history" data-route="/anny-attributes"></section></main>
<script>
const attributeFieldSpecs=[['rotation_y','Y축 회전 (°)',-180,180],['age','나이',0,1],['weight','체중',0,1],['height','키',0,1],['torso-scale-horiz-incr','몸통 너비',-1,1],['torso-scale-depth-incr','몸통 깊이',-1,1],['measure-shoulder-dist-incr','어깨 너비',-1,1],['upperlegs-height-incr','허벅지 길이',-1,1],['lowerlegs-height-incr','종아리 길이',-1,1]];
const attributeFieldPanel=document.querySelector('#fields'),renderStatusLabel=document.querySelector('#status');
let historySelectionActive=false,baselineAttributeValues,attributeChangeVersion=0,activeRenderPromise=null,pendingRenderTimer;
const collectAttributeValues=()=>Object.fromEntries([...attributeFieldPanel.querySelectorAll('input')].map(input=>[input.name,Number(input.value)]));
async function fetchRenderRecord(url,options){const response=await fetch(url,options);const record=await response.json();if(!response.ok)throw Error(record.error||'요청 실패');return record}
function scheduleAttributeRender(){historySelectionActive=false;attributeChangeVersion++;clearTimeout(pendingRenderTimer);renderStatusLabel.textContent='변경값 적용 대기 중';pendingRenderTimer=setTimeout(requestAttributeRender,500)}
async function requestAttributeRender(){
 if(activeRenderPromise)return;
 const requestedChangeVersion=attributeChangeVersion;
 activeRenderPromise=(async()=>{
 try{
 renderStatusLabel.textContent='ANNY 프리뷰 렌더 중 · 추가 변경은 다음 렌더에 반영됩니다.';
 const record=await fetchRenderRecord('/anny-attributes/render',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(collectAttributeValues())});
 let state;
 do{await new Promise(resolve=>setTimeout(resolve,1000));state=await fetchRenderRecord('/anny-attributes/jobs/'+record.id);document.querySelector('#log').textContent=state.log||'';if(document.querySelector('#logs').open){const log=document.querySelector('#log');log.scrollTop=log.scrollHeight}}while(state.status==='running');
 if(requestedChangeVersion!==attributeChangeVersion)return;
 if(state.status!=='completed')throw Error('렌더 실패 · 로그를 확인하세요.');
 await Promise.all(['front','side'].map(async view=>{const url='/anny-attributes/jobs/'+record.id+'/'+view+'.png';const image=new Image();image.src=url;await image.decode();if(requestedChangeVersion===attributeChangeVersion){document.querySelector('#'+view).src=url;document.querySelector('#'+view).hidden=false}}));
 renderStatusLabel.textContent='렌더 완료 · '+record.id;
 if(typeof refreshGenerationHistory==='function')refreshGenerationHistory();
 }catch(error){renderStatusLabel.textContent=error.message}
 })();
 await activeRenderPromise;activeRenderPromise=null;
 if(requestedChangeVersion!==attributeChangeVersion&&!historySelectionActive)requestAttributeRender();
}
function restoreAttributeDefaults(){for(const input of attributeFieldPanel.querySelectorAll('input')){input.value=baselineAttributeValues.phenotype_kwargs[input.name]??baselineAttributeValues.local_changes_kwargs[input.name]??0;input.nextElementSibling.textContent=input.value}scheduleAttributeRender()}
document.querySelector('#reset').onclick=restoreAttributeDefaults;
document.querySelector('#retry').onclick=scheduleAttributeRender;
fetchRenderRecord('/anny-attributes/base').then(record=>{
 baselineAttributeValues=record;
 for(const [name,label,min,max] of attributeFieldSpecs){const row=document.createElement('label');row.textContent=label;const input=document.createElement('input');input.type='range';input.name=name;input.min=min;input.max=max;input.step=name==='rotation_y'?5:.05;input.setAttribute('aria-label',label);row.append(document.createElement('br'),input,document.createElement('output'));attributeFieldPanel.append(row)}
 attributeFieldPanel.oninput=event=>{event.target.nextElementSibling.textContent=event.target.value;scheduleAttributeRender()};
 restoreAttributeDefaults();
}).catch(error=>renderStatusLabel.textContent=error.message);
window.restoreGenerationRecord=record=>{historySelectionActive=true;
 clearTimeout(pendingRenderTimer);attributeChangeVersion++;
 for(const input of attributeFieldPanel.querySelectorAll('input')){input.value=record.request.attributes[input.name]??baselineAttributeValues.phenotype_kwargs[input.name]??baselineAttributeValues.local_changes_kwargs[input.name]??0;input.nextElementSibling.textContent=input.value}
 for(const view of ['front','side']){const image=document.querySelector('#'+view);image.src='/anny-attributes/jobs/'+record.id+'/'+view+'.png';image.hidden=false}
 renderStatusLabel.textContent='저장된 결과 · '+record.id;
};
</script><script src="/anny-attributes/history-ui.js"></script>
