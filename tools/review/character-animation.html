<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캐릭터 애니메이션 생성기</title><link rel="stylesheet" href="/character-animation/studio.css"><style>
.studio-grid{grid-template-columns:minmax(300px,380px) minmax(0,1fr)}.setting-field{margin-bottom:16px}.setting-field select{width:100%;margin:4px 0}.preview-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.preview-pair img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--page);border-radius:10px}fieldset{border:1px solid var(--line);border-radius:10px}fieldset label{margin:8px}#frame-position{width:100%}#output-frame{width:100%;max-height:660px;object-fit:contain;aspect-ratio:1}#reference-note,#job-location{overflow-wrap:anywhere;font-size:12px}.readonly-prompt{max-height:none}.playback-controls{display:flex;flex-wrap:wrap;align-items:center}#playback-empty{padding:80px 12px;text-align:center}@media(max-width:960px){.studio-grid{grid-template-columns:1fr}}
</style></head><body><main><header><span class="eyebrow">ANIMATION STUDIO</span><h1>캐릭터 애니메이션 생성기</h1><p>등록된 모션과 캐릭터 레퍼런스로 방향별 애니메이션을 만듭니다. 원본 전체 프레임 · 4 FPS</p></header><div class="studio-grid"><section class="studio-panel"><form id="animation-form"><div class="setting-field"><label for="motion-choice">모션 에셋</label><select id="motion-choice" required></select></div><div class="setting-field"><label for="character-choice">캐릭터 레퍼런스</label><select id="character-choice" required></select></div><div class="setting-field"><label for="source-choice">포즈 입력</label><select id="source-choice"><option value="openpose">OpenPose 맵</option><option value="anny">ANNY 리그 렌더 프레임</option></select></div><fieldset><legend>생성할 방향</legend><button type="button" id="select-all">전체 선택</button><div id="direction-options"></div></fieldset><p id="frame-count"></p><div class="preview-pair"><figure style="margin:0"><img id="character-preview" alt="캐릭터 레퍼런스"><figcaption>캐릭터 레퍼런스</figcaption></figure><figure style="margin:0"><img id="pose-preview" alt="첫 포즈 프레임"><figcaption>첫 포즈 프레임</figcaption></figure></div><p id="reference-note">ANNY 입력은 등록된 리그의 렌더 이미지를 사용합니다.</p><h2>기본 프롬프트 · 고정</h2><pre id="base-prompt" class="readonly-prompt"></pre><h2>보조 프롬프트 · 고정</h2><pre id="auxiliary-prompt" class="readonly-prompt"></pre><p>프롬프트는 읽기 전용입니다. 모델: Qwen Image Edit 2511 · 4스텝</p><div class="generation-actions"><button id="submit" type="submit" disabled>애니메이션 생성</button><button id="cancel-generation" type="button" disabled>생성 취소</button></div></form></section><section class="studio-panel"><h2>생성 상태와 결과</h2><p id="status" role="status">설정을 불러오는 중…</p><progress id="generation-progress" max="100" value="0"></progress><p id="job-location"></p><details id="execution-log"><summary>생성 로그</summary><pre id="execution-log-text"></pre></details><hr><p id="result-title">이력에서 결과를 선택하면 다시 재생할 수 있습니다.</p><label for="playback-direction">재생 방향</label><select id="playback-direction" disabled></select><div class="result-canvas"><p id="playback-empty">생성 결과가 여기에 표시됩니다.</p><img id="output-frame" alt="생성한 캐릭터 애니메이션" hidden></div><div class="playback-controls"><button type="button" id="frame-previous" disabled>이전 프레임</button><button type="button" id="frame-play" disabled>재생</button><button type="button" id="frame-stop" disabled>중지</button><button type="button" id="frame-next" disabled>다음 프레임</button><span id="frame-label"></span></div><input id="frame-position" type="range" min="0" max="0" value="0" aria-label="재생 프레임 위치" disabled></section></div><section id="generation-history" data-route="/character-animation"></section></main><script src="/character-animation/log-viewer.js"></script><script src="/character-animation/app.js"></script><script src="/character-animation/history.js"></script></body></html>
