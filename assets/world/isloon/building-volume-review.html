<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>건물 입체감 시안 · 이슬온</title>
<style>
:root{color-scheme:dark;--ink:#eaf3ed;--muted:#9fb7aa;--panel:#16231f;--edge:#355447;--accent:#87d6a7}*{box-sizing:border-box}body{margin:0;min-width:960px;background:radial-gradient(circle at 70% 0,#213a30 0,#0b1411 48rem);color:var(--ink);font:14px ui-sans-serif,system-ui,sans-serif}.shell{max-width:1480px;margin:0 auto;padding:30px}.top{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:22px}.eyebrow{margin:0 0 6px;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.13em}.title{margin:0;font-size:30px;letter-spacing:-.045em}.subtitle,.note{color:var(--muted);line-height:1.5}.panel{border:1px solid var(--edge);background:color-mix(in srgb,var(--panel) 92%,black);border-radius:14px;box-shadow:0 16px 50px #0005;padding:18px}.controls{display:flex;align-items:end;gap:16px}.controls label{display:grid;gap:6px}.controls select{min-width:270px;border:1px solid var(--edge);border-radius:9px;background:#12201b;color:var(--ink);padding:10px 12px;font:inherit}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{overflow:hidden;border:1px solid #315141;border-radius:10px;background:#101c17}.card h2{margin:0;padding:12px 12px 0;font-size:15px}.card p{margin:4px 12px 0;color:var(--muted);font-size:12px}.card canvas{display:block;width:100%;height:470px}.note{margin:14px 0 0;font-size:12px}
</style>
<main class="shell"><header class="top"><div><p class="eyebrow">WORLD BUILDING / ISLOON</p><h1 class="title">건물 입체감 시안</h1><p class="subtitle">같은 바닥 면적에서 벽 높이를 1·2·3층으로 바꿔 비교하는 형태 검토용 페이지입니다.</p></div><div class="controls"><label><span class="eyebrow">건물</span><select id="building-select" aria-label="비교할 건물"></select></label></div></header><section class="panel"><div class="grid"><article class="card"><h2>1층</h2><p></p><canvas data-height="1"></canvas></article><article class="card"><h2>2층</h2><p></p><canvas data-height="2"></canvas></article><article class="card"><h2>3층</h2><p></p><canvas data-height="3"></canvas></article></div><p class="note">출입구·벽면·옥상 형태를 높이별로 비교합니다. 이 페이지의 높이는 게임 적용 규칙이 아닌 시안 단계 값입니다.</p></section></main>
<script>
const buildingSelectControl=document.querySelector('#building-select');const buildingCanvasElements=[...document.querySelectorAll('canvas')];let buildingPrefabRecords=[],buildingRenderProfile;
function drawBuildingVolumePreview(canvasElement,prefabRecordValue,floorCountValue){const contextValue=canvasElement.getContext('2d'),widthValue=canvasElement.clientWidth,heightValue=470,dprValue=window.devicePixelRatio||1;const tileWidthValue=buildingRenderProfile.tile_width,tileHeightValue=buildingRenderProfile.tile_height,floorHeightValue=buildingRenderProfile.wall_height,buildingWidthValue=prefabRecordValue.size.columns,buildingDepthValue=prefabRecordValue.size.rows;canvasElement.parentElement.querySelector('p').textContent=`바닥 ${buildingWidthValue}×${buildingDepthValue}칸 · 벽 높이 ${floorCountValue*floorHeightValue}px`;canvasElement.width=widthValue*dprValue;canvasElement.height=heightValue*dprValue;contextValue.setTransform(dprValue,0,0,dprValue,0,0);contextValue.clearRect(0,0,widthValue,heightValue);const scaleValue=Math.min(1,(widthValue-60)/((buildingWidthValue+buildingDepthValue)*tileWidthValue/2),(heightValue-80)/((buildingWidthValue+buildingDepthValue)*tileHeightValue/2+3*floorHeightValue));const originXValue=widthValue/2/scaleValue-(buildingWidthValue-buildingDepthValue)*tileWidthValue/4,originYValue=heightValue/2/scaleValue-((buildingWidthValue+buildingDepthValue)*tileHeightValue/2-3*floorHeightValue)/2;const pointValue=(columnValue,rowValue,heightValueValue)=>({x:originXValue+(columnValue-rowValue)*tileWidthValue/2,y:originYValue+(columnValue+rowValue)*tileHeightValue/2-heightValueValue});const polygonValue=(pointsValue,fillValue,strokeValue)=>{contextValue.beginPath();contextValue.moveTo(pointsValue[0].x,pointsValue[0].y);pointsValue.slice(1).forEach(pointItem=>contextValue.lineTo(pointItem.x,pointItem.y));contextValue.closePath();contextValue.fillStyle=fillValue;contextValue.fill();contextValue.strokeStyle=strokeValue;contextValue.stroke()};contextValue.setTransform(dprValue*scaleValue,0,0,dprValue*scaleValue,0,0);const bottomPoints=[pointValue(0,0,0),pointValue(buildingWidthValue,0,0),pointValue(buildingWidthValue,buildingDepthValue,0),pointValue(0,buildingDepthValue,0)];const topPoints=bottomPoints.map((pointItem,indexValue)=>pointValue(indexValue===0||indexValue===3?0:buildingWidthValue,indexValue<2?0:buildingDepthValue,floorCountValue*floorHeightValue));polygonValue([bottomPoints[1],bottomPoints[2],topPoints[2],topPoints[1]],'#d3a662','#5c371b');polygonValue([bottomPoints[2],bottomPoints[3],topPoints[3],topPoints[2]],'#b17e45','#4f2f19');polygonValue([topPoints[0],topPoints[1],topPoints[2],topPoints[3]],'#cb7336','#5b2c16');contextValue.strokeStyle='#f0af68';contextValue.lineWidth=2;contextValue.stroke();}
function renderBuildingVolumeComparisons(){const selectedPrefabValue=buildingPrefabRecords[Number(buildingSelectControl.value)];if(!selectedPrefabValue)return;buildingCanvasElements.forEach((canvasElement,indexValue)=>{const floorCountValue=indexValue+1;drawBuildingVolumePreview(canvasElement,selectedPrefabValue,floorCountValue);canvasElement.previousElementSibling.textContent=`바닥 ${selectedPrefabValue.size.columns}×${selectedPrefabValue.size.rows}칸 · 벽 높이 ${floorCountValue}층 · ${floorCountValue*buildingRenderProfile.wall_height}px`;canvasElement.parentElement.querySelector('h2').textContent=`${selectedPrefabValue.display_name} · ${floorCountValue}층`})}
async function startBuildingVolumeReview(){const [prefabResponseValue,profileResponseValue]=await Promise.all([fetch('building-prefabs.json'),fetch('building-render-profile.json')]);if(!profileResponseValue.ok)throw new Error('공용 건물 검수 기준을 찾지 못했습니다.');buildingRenderProfile=await profileResponseValue.json();document.querySelector('.note').textContent=`공용 검수 기준: 마을 타일 ${buildingRenderProfile.tile_width}×${buildingRenderProfile.tile_height} · 1층 벽 ${buildingRenderProfile.wall_height}px · 캐릭터 ${buildingRenderProfile.character_height}px. 비교 시안의 벽 높이는 기준값의 1·2·3배입니다.`;if(!prefabResponseValue.ok)throw new Error('건물 프리셋 목록을 찾지 못했습니다.');const prefabDocumentValue=await prefabResponseValue.json();buildingPrefabRecords=[...prefabDocumentValue.prefabs].sort((firstValue,secondValue)=>firstValue.display_name.localeCompare(secondValue.display_name,'ko'));buildingSelectControl.replaceChildren(...buildingPrefabRecords.map((recordValue,indexValue)=>Object.assign(document.createElement('option'),{value:indexValue,textContent:`${recordValue.display_name} · ${recordValue.size.columns}×${recordValue.size.rows}칸` })));buildingSelectControl.onchange=renderBuildingVolumeComparisons;renderBuildingVolumeComparisons()}buildingSelectControl.addEventListener('change',renderBuildingVolumeComparisons);window.addEventListener('resize',renderBuildingVolumeComparisons);startBuildingVolumeReview().catch(errorValue=>document.querySelector('.note').textContent=errorValue.message);
</script></html>
