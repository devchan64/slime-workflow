<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>마을 맵 검수 · 이슬온</title>
<style>
  :root{color-scheme:dark;--ink:#eaf3ed;--muted:#9fb7aa;--panel:#16231f;--panel-edge:#355447;--ground:#0b1411;--accent:#87d6a7;--water:#59c7d2}
  *{box-sizing:border-box}body{margin:0;min-width:960px;background:radial-gradient(circle at 70% 0,#213a30 0,#0b1411 48rem);color:var(--ink);font:14px ui-sans-serif,system-ui,sans-serif}
  .shell{max-width:1480px;margin:0 auto;padding:30px}.top{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:22px}.eyebrow{margin:0 0 6px;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.13em}.title{margin:0;font-size:30px;letter-spacing:-.045em}.subtitle{margin:7px 0 0;color:var(--muted)}
  select{min-width:250px;border:1px solid var(--panel-edge);border-radius:9px;background:#12201b;color:var(--ink);padding:10px 12px;font:inherit}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;min-height:0}.panel{border:1px solid var(--panel-edge);background:color-mix(in srgb,var(--panel) 92%,black);border-radius:14px;box-shadow:0 16px 50px #0005}.side{padding:18px}.section-title{margin:0 0 5px;font-size:15px}.section-note{margin:0 0 14px;color:var(--muted);font-size:12px;line-height:1.5}.tile-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tile-card{min-width:0;padding:7px;border:1px solid #294439;border-radius:9px;background:#10201a}.tile-card img{display:block;width:100%;aspect-ratio:1;object-fit:cover;image-rendering:pixelated;border-radius:5px;background:#23352d}.tile-card code{display:block;overflow:hidden;margin-top:6px;color:#d9eadf;font:11px ui-monospace,monospace;text-overflow:ellipsis;white-space:nowrap}
  .main{min-height:0;overflow:hidden;padding:18px}.map-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.map-title{margin:0;font-size:17px}.summary{margin:0;color:var(--muted);font-size:12px}.canvas-wrap{position:relative;height:600px;min-height:0;max-height:600px;flex:none;border:1px solid #2b493c;border-radius:10px;overflow:auto;background-color:#101a16;background-image:linear-gradient(45deg,#14241e 25%,transparent 25%),linear-gradient(-45deg,#14241e 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#14241e 75%),linear-gradient(-45deg,transparent 75%,#14241e 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,0}.map-preview{display:block;width:1152px;height:auto;margin:20px auto;image-rendering:pixelated;box-shadow:0 15px 45px #0008}.map-overview{position:sticky;z-index:2;float:right;top:12px;right:12px;width:200px;max-height:150px;object-fit:contain;margin:12px 12px -162px 0;border:1px solid #66917a;border-radius:8px;background:#0b1411;box-shadow:0 8px 20px #0009;image-rendering:pixelated}.badge{position:sticky;display:block;z-index:1;left:16px;top:16px;width:max-content;margin:16px 0 -42px 16px;padding:7px 9px;border:1px solid #4c7865;border-radius:999px;background:#102018dd;color:#b9eac9;font-size:12px}.loading{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);color:var(--muted)}.zoom-controls{display:flex;align-items:center;gap:7px}.zoom-controls button{width:30px;height:30px;border:1px solid #456c59;border-radius:7px;background:#14271f;color:var(--ink);font-size:17px;cursor:pointer}.zoom-controls input{accent-color:var(--accent)}.zoom-value{width:38px;color:var(--accent);font:12px ui-monospace,monospace;text-align:right}
  .legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.legend span{border:1px solid #315141;border-radius:999px;background:#102019;padding:5px 8px;color:#bdd3c5;font-size:12px}.legend b{color:var(--water)}
</style>
<link rel="stylesheet" href="map-review-layout.css">
<main class="shell">
  <header class="top"><div><p class="eyebrow">WORLD BUILDING / ISLOON</p><h1 class="title">마을 맵 검수</h1><p class="subtitle">등록된 타일 원본과 이슬온 도시 조립 결과를 같은 화면에서 검수합니다.</p></div><label><span class="eyebrow">등록 맵</span><select id="map-select" aria-label="검수할 맵"><option>맵 목록 불러오는 중…</option></select></label></header>
  <div class="layout"><aside class="panel side"><h2 class="section-title">등록 타일</h2><p class="section-note">워커플로우에서 생성·등록된 실제 에셋입니다. 각 이미지는 검수 패키지에 하드링크로 연결됩니다.</p><div id="tile-list" class="tile-list"></div></aside><section class="panel main"><header class="map-header"><div><h2 id="map-title" class="map-title">이슬온 도시 배치</h2><p id="summary" class="summary">타일 에셋을 불러오는 중…</p></div><div class="zoom-controls" aria-label="맵 확대 축소 및 회전"><button id="zoom-out" type="button" aria-label="축소">−</button><input id="zoom-range" type="range" min="50" max="200" step="10" value="75" aria-label="확대 비율"><span id="zoom-value" class="zoom-value">75%</span><button id="zoom-in" type="button" aria-label="확대">+</button><button id="rotate-left" type="button" aria-label="맵 반시계 방향 회전">↶</button><span id="rotation-value" class="zoom-value">0°</span><button id="rotate-right" type="button" aria-label="맵 시계 방향 회전">↷</button></div></header><div class="canvas-wrap"><img id="map-overview" class="map-overview" alt="이슬온 전체 배치 축소 미리보기"><span class="badge">● 45° 입체 시안 · 시점 회전</span><span id="loading" class="loading">조립 맵을 불러오는 중…</span><img id="map-preview" class="map-preview" alt="회전 가능한 이슬온 타일맵 입체 시안"></div><footer class="legend"><span>흰 외곽선: 시작점</span><span><b>청록</b>: 샘터</span><span>적갈색 칸: 출입 금지 영역</span><span id="building-height-legend">건물 검수 기준을 불러오는 중…</span></footer></section></div>
</main>
<script src="map-character-preview.js"></script>
<script>
const mapPreviewImage=document.querySelector('#map-preview');
const mapOverviewImage=document.querySelector('#map-overview');
const mapSelectionControl=document.querySelector('#map-select');
const mapLoadingMessage=document.querySelector('#loading');
const mapZoomControl=document.querySelector('#zoom-range');
const mapZoomLabel=document.querySelector('#zoom-value');
const mapRotationLabel=document.querySelector('#rotation-value');
const tileImageRecords={};
const VOLUME_ROOF_HEIGHT_PIXELS=0;
const VOLUME_CANVAS_HEIGHT_PIXELS=420;
const VOLUME_CANVAS_PADDING_PIXELS=24;
const VOLUME_MAXIMUM_FLOOR_COUNT=3;
const FIELD_MAP_DEFAULT_ZOOM_PERCENT=75;
const TOWN_MAP_DEFAULT_ZOOM_PERCENT=FIELD_MAP_DEFAULT_ZOOM_PERCENT*2;
let mapReviewRecords=[];
let buildingSizeRecords=[];
let currentMapRotationDegrees=0;
let currentVolumeRenderProfile;

function applyCurrentMapRotation(){
  const selectedMapRecord=mapReviewRecords[Number(mapSelectionControl.value)];
  if(!selectedMapRecord)return;
  mapPreviewImage.onload=applyMapZoom;
  const selectedPreviewPath=selectedMapRecord.previews?.[String(currentMapRotationDegrees)]||selectedMapRecord.preview;
  mapPreviewImage.src=`${selectedPreviewPath}?revision=${Date.now()}`;
  mapOverviewImage.src=`${selectedPreviewPath}?revision=${Date.now()}`;
  mapRotationLabel.textContent=`${currentMapRotationDegrees}°`;
}

function applyMapZoom(){
  const currentZoomPercent=Number(mapZoomControl.value);
  const imageBaseWidth=mapPreviewImage.naturalWidth||1536;
  mapPreviewImage.style.width=`${imageBaseWidth*currentZoomPercent/100}px`;
  mapZoomLabel.textContent=`${currentZoomPercent}%`;
  window.updateMapCharacterPreview?.(currentMapRotationDegrees);
}

function drawMapDetails(mapDocumentValues,mapRecordValues){
  document.querySelector('#map-title').textContent=`${mapDocumentValues.display_name||mapDocumentValues.map_id} 도시 배치`;
  document.querySelector('#summary').textContent=`${mapDocumentValues.grid.columns}×${mapDocumentValues.grid.rows} · 타일 ${mapRecordValues.render_profile.tile_width}×${mapRecordValues.render_profile.tile_height}px · 벽 ${mapRecordValues.render_profile.wall_height}px · 캐릭터 기준 ${mapRecordValues.render_profile.character_height}px · 충돌 ${mapDocumentValues.collision.length}칸 · 출구 ${mapDocumentValues.map_connections?.length||0}개 · 연결 ${mapDocumentValues.connections.length}개`;
  currentVolumeRenderProfile=mapRecordValues.render_profile;
  document.querySelector('#building-height-legend').textContent=`건물: 평면 옥상 · 1층 ${currentVolumeRenderProfile.wall_height}px 공용 검수 기준`;
  currentMapRotationDegrees=0;
  mapZoomControl.value=mapDocumentValues.safe_town?TOWN_MAP_DEFAULT_ZOOM_PERCENT:FIELD_MAP_DEFAULT_ZOOM_PERCENT;
  window.configureMapCharacterPreview(mapDocumentValues,mapRecordValues);
  applyCurrentMapRotation();
  mapPreviewImage.onload=()=>{
    applyMapZoom();mapLoadingMessage.hidden=true;
    requestAnimationFrame(()=>{
      const mapScrollContainer=mapPreviewImage.parentElement;
      mapScrollContainer.scrollLeft=Math.max(0,mapPreviewImage.offsetLeft+mapPreviewImage.clientWidth/2-mapScrollContainer.clientWidth/2);
      mapScrollContainer.scrollTop=Math.max(0,mapPreviewImage.offsetTop+mapPreviewImage.clientHeight/2-mapScrollContainer.clientHeight/2);
    });
  };
}

function projectVolumePoint(columnValue,rowValue,heightValue,originXValue,originYValue,tileWidthValue,tileHeightValue){
  return{x:originXValue+(columnValue-rowValue)*tileWidthValue/2,y:originYValue+(columnValue+rowValue)*tileHeightValue/2-heightValue};
}

function drawProjectedTextureImage(drawingContext,sourceImageValue,topLeftPoint,topRightPoint,bottomLeftPoint){
  drawingContext.save();
  drawingContext.transform(topRightPoint.x-topLeftPoint.x,topRightPoint.y-topLeftPoint.y,
    bottomLeftPoint.x-topLeftPoint.x,bottomLeftPoint.y-topLeftPoint.y,topLeftPoint.x,topLeftPoint.y);
  drawingContext.drawImage(sourceImageValue,0,0,1,1);
  drawingContext.restore();
}

function drawBuildingVolumePreview(canvasElement,prefabRecordValues,floorCountValue){
  const drawingContext=canvasElement.getContext('2d');
  const devicePixelRatioValue=window.devicePixelRatio||1;
  const canvasWidthValue=canvasElement.clientWidth;
  const canvasHeightValue=VOLUME_CANVAS_HEIGHT_PIXELS;
  if(!canvasWidthValue)return;
  const footprintWidthValue=prefabRecordValues.size.columns;
  const footprintDepthValue=prefabRecordValues.size.rows;
  const tileWidthValue=currentVolumeRenderProfile.tile_width;
  const tileHeightValue=currentVolumeRenderProfile.tile_height;
  const floorHeightValue=currentVolumeRenderProfile.wall_height;
  const roofRimHeightValue=VOLUME_ROOF_HEIGHT_PIXELS;
  const wallTopHeightValue=floorCountValue*floorHeightValue;
  const footprintPixelWidth=(footprintWidthValue+footprintDepthValue)*tileWidthValue/2;
  const footprintPixelHeight=(footprintWidthValue+footprintDepthValue)*tileHeightValue/2;
  const maximumRoofHeight=VOLUME_MAXIMUM_FLOOR_COUNT*floorHeightValue+roofRimHeightValue;
  // 세 시안은 같은 배율과 바닥선을 사용하며 모든 축을 함께 축소한다.
  const previewScaleValue=Math.min(1,
    (canvasWidthValue-2*VOLUME_CANVAS_PADDING_PIXELS)/footprintPixelWidth,
    (canvasHeightValue-2*VOLUME_CANVAS_PADDING_PIXELS)/(footprintPixelHeight+maximumRoofHeight));
  const originXValue=canvasWidthValue/(2*previewScaleValue)-(footprintWidthValue-footprintDepthValue)*tileWidthValue/4;
  const originYValue=(canvasHeightValue/previewScaleValue-footprintPixelHeight+maximumRoofHeight)/2;
  canvasElement.width=canvasWidthValue*devicePixelRatioValue;
  canvasElement.height=canvasHeightValue*devicePixelRatioValue;
  drawingContext.setTransform(devicePixelRatioValue,0,0,devicePixelRatioValue,0,0);
  drawingContext.clearRect(0,0,canvasWidthValue,canvasHeightValue);
  drawingContext.setTransform(devicePixelRatioValue*previewScaleValue,0,0,devicePixelRatioValue*previewScaleValue,0,0);
  const pointValues=(columnValue,rowValue,heightValue)=>projectVolumePoint(columnValue,rowValue,heightValue,originXValue,originYValue,tileWidthValue,tileHeightValue);
  const tracePolygon=(pointList,fillStyleValue,strokeStyleValue)=>{
    drawingContext.beginPath();drawingContext.moveTo(pointList[0].x,pointList[0].y);
    for(const currentPoint of pointList.slice(1))drawingContext.lineTo(currentPoint.x,currentPoint.y);
    drawingContext.closePath();drawingContext.fillStyle=fillStyleValue;drawingContext.fill();
    drawingContext.strokeStyle=strokeStyleValue;drawingContext.lineWidth=1;drawingContext.stroke();
  };
  const cornerPoints=[pointValues(0,0,0),pointValues(footprintWidthValue,0,0),pointValues(footprintWidthValue,footprintDepthValue,0),pointValues(0,footprintDepthValue,0)];
  const wallTopPoints=[pointValues(0,0,wallTopHeightValue),pointValues(footprintWidthValue,0,wallTopHeightValue),pointValues(footprintWidthValue,footprintDepthValue,wallTopHeightValue),pointValues(0,footprintDepthValue,wallTopHeightValue)];
  const roofTopPoints=[pointValues(0,0,wallTopHeightValue+roofRimHeightValue),pointValues(footprintWidthValue,0,wallTopHeightValue+roofRimHeightValue),pointValues(footprintWidthValue,footprintDepthValue,wallTopHeightValue+roofRimHeightValue),pointValues(0,footprintDepthValue,wallTopHeightValue+roofRimHeightValue)];
  drawingContext.fillStyle='#050a08aa';drawingContext.beginPath();drawingContext.ellipse(originXValue,originYValue+10,(footprintWidthValue+footprintDepthValue)*tileWidthValue*.31,16,0,0,Math.PI*2);drawingContext.fill();
  tracePolygon([cornerPoints[1],cornerPoints[2],wallTopPoints[2],wallTopPoints[1]],'#d3a662','#5c371b');
  tracePolygon([cornerPoints[2],cornerPoints[3],wallTopPoints[3],wallTopPoints[2]],'#b17e45','#4f2f19');
  const selectedWallImage=tileImageRecords[prefabRecordValues.wall_tile];
  if(selectedWallImage){
    for(let floorIndexValue=0;floorIndexValue<floorCountValue;floorIndexValue++){
      const bottomHeightValue=floorIndexValue*floorHeightValue;
      const topHeightValue=bottomHeightValue+floorHeightValue;
      for(let columnIndexValue=0;columnIndexValue<footprintWidthValue;columnIndexValue++){
        drawProjectedTextureImage(drawingContext,floorIndexValue===0&&columnIndexValue%2&&prefabRecordValues.ground_floor_plain_wall_tile?tileImageRecords[prefabRecordValues.ground_floor_plain_wall_tile]:selectedWallImage,
          pointValues(columnIndexValue,footprintDepthValue,topHeightValue),
          pointValues(columnIndexValue+1,footprintDepthValue,topHeightValue),
          pointValues(columnIndexValue,footprintDepthValue,bottomHeightValue));
      }
      for(let rowIndexValue=0;rowIndexValue<footprintDepthValue;rowIndexValue++){
        drawProjectedTextureImage(drawingContext,floorIndexValue===0&&(footprintWidthValue+footprintDepthValue-1-rowIndexValue)%2&&prefabRecordValues.ground_floor_plain_wall_tile?tileImageRecords[prefabRecordValues.ground_floor_plain_wall_tile]:selectedWallImage,
          pointValues(footprintWidthValue,rowIndexValue+1,topHeightValue),
          pointValues(footprintWidthValue,rowIndexValue,topHeightValue),
          pointValues(footprintWidthValue,rowIndexValue+1,bottomHeightValue));
      }
    }
  }
  const entranceCellValue=prefabRecordValues.entrances?.[0];
  if(entranceCellValue){
    const candidateEntranceSides=[
      {name:'north',distance:entranceCellValue.row},
      {name:'east',distance:footprintWidthValue-1-entranceCellValue.column},
      {name:'south',distance:footprintDepthValue-1-entranceCellValue.row},
      {name:'west',distance:entranceCellValue.column}
    ];
    const selectedEntranceSide=candidateEntranceSides.sort((firstSideValue,secondSideValue)=>firstSideValue.distance-secondSideValue.distance)[0].name;
    if(selectedEntranceSide==='south'||selectedEntranceSide==='east'){
      const doorHeightValue=72;
      const wallSpanValue=selectedEntranceSide==='south'?footprintWidthValue:footprintDepthValue;
      const wallEdgeValue=selectedEntranceSide==='south'?footprintDepthValue:footprintWidthValue;
      const entranceOffsetValue=selectedEntranceSide==='south'?entranceCellValue.column+.5:entranceCellValue.row+.5;
      const doorCenterValue=Math.min(Math.max(entranceOffsetValue,.5),wallSpanValue-.5);
      const doorFrameHalfWidthValue=Math.min(.32,doorCenterValue,wallSpanValue-doorCenterValue);
      const doorHalfWidthValue=Math.min(.28,doorFrameHalfWidthValue-.04);
      const doorPointValues=(alongWallValue,heightValue)=>selectedEntranceSide==='south'
        ?pointValues(alongWallValue,wallEdgeValue,heightValue)
        :pointValues(wallEdgeValue,alongWallValue,heightValue);
      if(tileImageRecords[prefabRecordValues.door_tile]){
        const entranceImageValue=tileImageRecords[prefabRecordValues.door_tile];
        const entranceFitScale=Math.min(doorFrameHalfWidthValue*2*tileWidthValue/entranceImageValue.naturalWidth,doorHeightValue/entranceImageValue.naturalHeight);
        const entranceHalfWidth=entranceImageValue.naturalWidth*entranceFitScale/tileWidthValue/2;
        const entranceImageHeight=entranceImageValue.naturalHeight*entranceFitScale;
        drawProjectedTextureImage(drawingContext,entranceImageValue,
          doorPointValues(doorCenterValue-entranceHalfWidth,entranceImageHeight),
          doorPointValues(doorCenterValue+entranceHalfWidth,entranceImageHeight),
          doorPointValues(doorCenterValue-entranceHalfWidth,0));
      }else{
      const doorFrameBottomPoints=[doorPointValues(doorCenterValue-doorFrameHalfWidthValue,0),doorPointValues(doorCenterValue+doorFrameHalfWidthValue,0)];
      const doorFrameTopPoints=[doorPointValues(doorCenterValue-doorFrameHalfWidthValue,doorHeightValue+6),doorPointValues(doorCenterValue+doorFrameHalfWidthValue,doorHeightValue+6)];
      tracePolygon([doorFrameBottomPoints[0],doorFrameBottomPoints[1],doorFrameTopPoints[1],doorFrameTopPoints[0]],'#e0b770','#412919');
      const entranceBottomStart=doorPointValues(doorCenterValue-doorHalfWidthValue,0);
      const entranceBottomEnd=doorPointValues(doorCenterValue+doorHalfWidthValue,0);
      const entranceTopStart=doorPointValues(doorCenterValue-doorHalfWidthValue,doorHeightValue);
      const entranceTopEnd=doorPointValues(doorCenterValue+doorHalfWidthValue,doorHeightValue);
      tracePolygon([entranceBottomStart,entranceBottomEnd,entranceTopEnd,entranceTopStart],'#57301b','#311f16');
      drawingContext.fillStyle='#ecc466';drawingContext.beginPath();drawingContext.arc(entranceTopEnd.x-2,entranceTopEnd.y+doorHeightValue*.52,2,0,Math.PI*2);drawingContext.fill();
      tracePolygon([doorPointValues(doorCenterValue-doorFrameHalfWidthValue,doorHeightValue),doorPointValues(doorCenterValue+doorFrameHalfWidthValue,doorHeightValue),
        doorPointValues(doorCenterValue+doorFrameHalfWidthValue,doorHeightValue-14),doorPointValues(doorCenterValue-doorFrameHalfWidthValue,doorHeightValue-14)],'#e0b770','#412919');
      }
    }
  }
  const selectedRoofImage=tileImageRecords[prefabRecordValues.roof_tile];
  if(selectedRoofImage){
    const roofHeightValue=wallTopHeightValue+roofRimHeightValue;
    for(let columnIndexValue=0;columnIndexValue<footprintWidthValue;columnIndexValue++){
      for(let rowIndexValue=0;rowIndexValue<footprintDepthValue;rowIndexValue++){
        drawProjectedTextureImage(drawingContext,selectedRoofImage,
          pointValues(columnIndexValue,rowIndexValue,roofHeightValue),
          pointValues(columnIndexValue+1,rowIndexValue,roofHeightValue),
          pointValues(columnIndexValue,rowIndexValue+1,roofHeightValue));
      }
    }
  }
}

function drawBuildingVolumeComparisons(){
  const selectedPrefabRecord=buildingSizeRecords[Number(buildingSizeControl.value)]||buildingSizeRecords[0];
  if(!selectedPrefabRecord)return;
  for(const canvasElement of document.querySelectorAll('.volume-card canvas')){
    const floorCountValue=Number(canvasElement.dataset.height);
    drawBuildingVolumePreview(canvasElement,selectedPrefabRecord,floorCountValue);
    canvasElement.previousElementSibling.textContent=`바닥 ${selectedPrefabRecord.size.columns}×${selectedPrefabRecord.size.rows}칸 · 벽 높이 ${floorCountValue}층 · ${floorCountValue*currentVolumeRenderProfile.wall_height}px`;
  }
  document.querySelectorAll('.volume-card h3').forEach((headingElement,indexValue)=>{
    headingElement.textContent=`${selectedPrefabRecord.display_name} · ${indexValue+1}층`;
  });
}

async function loadTileAssets(){
  const responseValue=await fetch('tile-assets.json');
  if(!responseValue.ok)throw new Error('등록 타일 에셋 목록을 찾지 못했습니다.');
  const tileRecords=(await responseValue.json()).tiles;
  const tileListElement=document.querySelector('#tile-list');
  const imageLoadPromises=[];
  for(const [tileIdentifier,tileRecord] of Object.entries(tileRecords)){
    const imageElement=new Image();tileImageRecords[tileIdentifier]=imageElement;
    const cardElement=document.createElement('article');cardElement.className='tile-card';
    const labelElement=document.createElement('code');labelElement.textContent=tileIdentifier;
    cardElement.append(imageElement,labelElement);tileListElement.append(cardElement);
    imageLoadPromises.push(new Promise((resolveValue,rejectValue)=>{
      imageElement.onload=resolveValue;
      imageElement.onerror=()=>rejectValue(new Error(`${tileIdentifier} 타일을 불러오지 못했습니다.`));
      imageElement.src=tileRecord.file;
    }));
  }
  await Promise.all(imageLoadPromises);
}

async function loadSelectedMapRecord(mapRecordValues){
  const responseValue=await fetch(mapRecordValues.file);
  if(!responseValue.ok)throw new Error('조립된 맵을 찾지 못했습니다.');
  drawMapDetails(await responseValue.json(),mapRecordValues);
}

function showReviewError(currentErrorValue){
  mapLoadingMessage.textContent=currentErrorValue.message;
  mapLoadingMessage.hidden=false;
  document.querySelector('#summary').textContent='검수 데이터를 불러오지 못했습니다.';
}

function collectBuildingSizeRecords(prefabRecordValues){
  return [...prefabRecordValues].sort((firstPrefabRecord,secondPrefabRecord)=>
    firstPrefabRecord.display_name.localeCompare(secondPrefabRecord.display_name,'ko'));
}

async function startMapReview(){
  await loadTileAssets();
  const mapIndexResponse=await fetch(`map-index.json?revision=${Date.now()}`,{cache:'no-store'});
  if(!mapIndexResponse.ok)throw new Error('등록 맵 목록을 찾지 못했습니다.');
  mapReviewRecords=(await mapIndexResponse.json()).maps;
  mapSelectionControl.replaceChildren(...mapReviewRecords.map((recordValue,indexValue)=>Object.assign(document.createElement('option'),{value:indexValue,textContent:recordValue.label})));
  mapSelectionControl.onchange=()=>loadSelectedMapRecord(mapReviewRecords[Number(mapSelectionControl.value)]).catch(showReviewError);
  document.querySelector('#rotate-left').onclick=()=>changeMapRotation(-90);
  document.querySelector('#rotate-right').onclick=()=>changeMapRotation(90);
  if(mapReviewRecords.length)await loadSelectedMapRecord(mapReviewRecords[0]);
}

function changeMapRotation(rotationDeltaDegrees){
  currentMapRotationDegrees=(currentMapRotationDegrees+rotationDeltaDegrees+360)%360;
  applyCurrentMapRotation();
}

mapZoomControl.oninput=applyMapZoom;
document.querySelector('#zoom-out').onclick=()=>{mapZoomControl.value=Math.max(Number(mapZoomControl.min),Number(mapZoomControl.value)-10);applyMapZoom()};
document.querySelector('#zoom-in').onclick=()=>{mapZoomControl.value=Math.min(Number(mapZoomControl.max),Number(mapZoomControl.value)+10);applyMapZoom()};
applyMapZoom();
startMapReview().catch(showReviewError);
</script>
</html>
