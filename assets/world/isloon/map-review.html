<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>타일맵검수 · 이슬온</title>
<style>
  :root{color-scheme:dark;--ink:#eaf3ed;--muted:#9fb7aa;--panel:#16231f;--panel-edge:#355447;--ground:#0b1411;--accent:#87d6a7;--water:#59c7d2}
  *{box-sizing:border-box}body{margin:0;min-width:960px;background:radial-gradient(circle at 70% 0,#213a30 0,#0b1411 48rem);color:var(--ink);font:14px ui-sans-serif,system-ui,sans-serif}
  .shell{max-width:1480px;margin:0 auto;padding:30px}.top{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:22px}.eyebrow{margin:0 0 6px;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.13em}.title{margin:0;font-size:30px;letter-spacing:-.045em}.subtitle{margin:7px 0 0;color:var(--muted)}
  select{min-width:250px;border:1px solid var(--panel-edge);border-radius:9px;background:#12201b;color:var(--ink);padding:10px 12px;font:inherit}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px}.panel{border:1px solid var(--panel-edge);background:color-mix(in srgb,var(--panel) 92%,black);border-radius:14px;box-shadow:0 16px 50px #0005}.side{padding:18px}.section-title{margin:0 0 5px;font-size:15px}.section-note{margin:0 0 14px;color:var(--muted);font-size:12px;line-height:1.5}.tile-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tile-card{min-width:0;padding:7px;border:1px solid #294439;border-radius:9px;background:#10201a}.tile-card img{display:block;width:100%;aspect-ratio:1;object-fit:cover;image-rendering:pixelated;border-radius:5px;background:#23352d}.tile-card code{display:block;overflow:hidden;margin-top:6px;color:#d9eadf;font:11px ui-monospace,monospace;text-overflow:ellipsis;white-space:nowrap}
  .main{padding:18px}.map-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.map-title{margin:0;font-size:17px}.summary{margin:0;color:var(--muted);font-size:12px}.canvas-wrap{position:relative;min-height:700px;border:1px solid #2b493c;border-radius:10px;overflow:auto;background-color:#101a16;background-image:linear-gradient(45deg,#14241e 25%,transparent 25%),linear-gradient(-45deg,#14241e 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#14241e 75%),linear-gradient(-45deg,transparent 75%,#14241e 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,0}.map-preview{display:block;width:1152px;height:auto;margin:20px auto;image-rendering:pixelated;box-shadow:0 15px 45px #0008}.badge{position:sticky;display:block;z-index:1;left:16px;top:16px;width:max-content;margin:16px 0 -42px 16px;padding:7px 9px;border:1px solid #4c7865;border-radius:999px;background:#102018dd;color:#b9eac9;font-size:12px}.loading{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);color:var(--muted)}.zoom-controls{display:flex;align-items:center;gap:7px}.zoom-controls button{width:30px;height:30px;border:1px solid #456c59;border-radius:7px;background:#14271f;color:var(--ink);font-size:17px;cursor:pointer}.zoom-controls input{accent-color:var(--accent)}.zoom-value{width:38px;color:var(--accent);font:12px ui-monospace,monospace;text-align:right}
  .legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.legend span{border:1px solid #315141;border-radius:999px;background:#102019;padding:5px 8px;color:#bdd3c5;font-size:12px}.legend b{color:var(--water)}
</style>
<main class="shell">
  <header class="top"><div><p class="eyebrow">WORLD BUILDING / ISLOON</p><h1 class="title">타일맵검수</h1><p class="subtitle">등록된 타일 원본과 이슬온 도시 조립 결과를 같은 화면에서 검수합니다.</p></div><label><span class="eyebrow">등록 맵</span><select id="map-select" aria-label="검수할 맵"><option>맵 목록 불러오는 중…</option></select></label></header>
  <div class="layout"><aside class="panel side"><h2 class="section-title">등록 타일</h2><p class="section-note">워커플로우에서 생성·등록된 실제 에셋입니다. 각 이미지는 검수 패키지에 하드링크로 연결됩니다.</p><div id="tile-list" class="tile-list"></div></aside><section class="panel main"><header class="map-header"><div><h2 id="map-title" class="map-title">이슬온 도시 배치</h2><p id="summary" class="summary">타일 에셋을 불러오는 중…</p></div><div class="zoom-controls" aria-label="맵 확대 축소"><button id="zoom-out" type="button" aria-label="축소">−</button><input id="zoom-range" type="range" min="50" max="200" step="10" value="75" aria-label="확대 비율"><span id="zoom-value" class="zoom-value">75%</span><button id="zoom-in" type="button" aria-label="확대">+</button></div></header><div class="canvas-wrap"><span class="badge">● 생성 타일 적용 · 45°</span><span id="loading" class="loading">조립 맵을 불러오는 중…</span><img id="map-preview" class="map-preview" alt="이슬온 실제 타일 조립 미리보기"></div><footer class="legend"><span>흰 사각형: 시작점</span><span><b>청록</b>: 샘터</span><span>황토: 지붕</span><span>크림: 목조 외벽</span></footer></section></div>
</main>
<script>
const mapPreview=document.querySelector('#map-preview');const mapSelect=document.querySelector('#map-select');const loading=document.querySelector('#loading');const zoomRange=document.querySelector('#zoom-range');const zoomValue=document.querySelector('#zoom-value');const tileImages={};let mapRecords=[];
function applyZoom(){const zoomPercent=Number(zoomRange.value);mapPreview.style.width=`${1536*zoomPercent/100}px`;zoomValue.textContent=`${zoomPercent}%`}
function drawMap(map,mapRecord){mapPreview.src=mapRecord.preview;document.querySelector('#map-title').textContent=`${map.display_name||map.map_id} 도시 배치`;document.querySelector('#summary').textContent=`${map.grid.columns}×${map.grid.rows} · 충돌 ${map.collision.length}칸 · 출구 ${map.map_connections?.length||0}개 · 연결 ${map.connections.length}개`;loading.hidden=true}
async function loadTileAssets(){const response=await fetch('tile-assets.json');if(!response.ok)throw new Error('등록 타일 에셋 목록을 찾지 못했습니다.');const tiles=(await response.json()).tiles;const list=document.querySelector('#tile-list');const loadPromises=[];for(const [tileId,tileRecord] of Object.entries(tiles)){const image=new Image();image.src=tileRecord.file;tileImages[tileId]=image;const card=document.createElement('article');card.className='tile-card';const label=document.createElement('code');label.textContent=tileId;card.append(image,label);list.append(card);loadPromises.push(new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error(`${tileId} 에셋을 불러오지 못했습니다.`))}))}await Promise.all(loadPromises)}
async function loadMap(mapRecord){const response=await fetch(mapRecord.file);if(!response.ok)throw new Error('조립된 맵을 찾지 못했습니다.');drawMap(await response.json(),mapRecord)}
async function startReview(){await loadTileAssets();const response=await fetch('map-index.json');if(!response.ok)throw new Error('등록 맵 목록을 찾지 못했습니다.');mapRecords=(await response.json()).maps;mapSelect.replaceChildren(...mapRecords.map((record,index)=>Object.assign(document.createElement('option'),{value:index,textContent:record.label})));mapSelect.onchange=()=>loadMap(mapRecords[Number(mapSelect.value)]).catch(showError);if(mapRecords.length)await loadMap(mapRecords[0])}
zoomRange.oninput=applyZoom;document.querySelector('#zoom-out').onclick=()=>{zoomRange.value=Math.max(Number(zoomRange.min),Number(zoomRange.value)-10);applyZoom()};document.querySelector('#zoom-in').onclick=()=>{zoomRange.value=Math.min(Number(zoomRange.max),Number(zoomRange.value)+10);applyZoom()};applyZoom();function showError(error){loading.textContent=error.message;loading.hidden=false;document.querySelector('#summary').textContent='검수 데이터를 불러오지 못했습니다.'}startReview().catch(showError);
</script>
</html>
