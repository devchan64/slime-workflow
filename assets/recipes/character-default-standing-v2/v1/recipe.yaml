- id: initial
  prompt: 'Use case: identity-preserve. EDIT the attached 4x4 character idle spritesheet. Correct ONLY anatomical proportions consistently in ALL 16 sprites. The current oversized heads are wrong. Required FIVE HEADS TALL: crown of anatomical skull to chin is one unit, crown to shoe sole exactly five units. Visible hair silhouette must also stay compact so the figure reads clearly as five heads rather than four. Reduce head width and head height about 25% compared with reference at same overall sprite height; lengthen torso and legs naturally to compensate. Neck/torso/pelvis through crotch approx two head units, legs to soles approx two head units; head one unit. Keep hands and sneakers proportional, not oversized. No chibi proportions, no giant eyes. Preserve recognizable face, short tousled dark-brown hair, genderless identity, white short sleeve shirt, gray cuffed shorts and white sneakers, painterly rendering. Same relaxed standing, arms down, feet planted, subtle breathing phases.

    Keep precisely 4 equal columns by 4 equal rows, 16 complete figures, same fixed scale and root anchor per cell, transparent alpha. Row 1 down_left FRONT quarter, row 2 down_right FRONT quarter, row 3 up_left REAR quarter, row 4 up_right REAR quarter. Four frames of subtle breathing per row. No turning within row. Same upper-left screen lighting. Maintain margins with every figure within its cell, hair and shoes uncut. No grid, labels, text, ruler, shadows, floor, scenery, attacks or walking. The most important visible change is a SMALLER HEAD and natural FIVE-HEAD-TALL silhouette in every view. Keep canvas layout and transparency.'
  input: input-standing-v1.png
- id: refinement
  prompt: 'Use case: identity-preserve. Precise proportion correction of this 4x4 idle character spritesheet. Current visible head INCLUDING HAIR is still too tall. In EVERY sprite make the ENTIRE visible hair-top-to-chin silhouette exactly 20 percent of hair-top-to-shoe-bottom height. At current approximately 275 pixel character height head including hair should be approximately 55 pixels, not 70. Reduce heads INCLUDING hairstyle by an additional 22 percent in height and width. Keep top of hair and soles in same overall framing by extending neck-to-crotch torso naturally upward to meet smaller head. Upper body below chin to crotch = 40 percent total height, legs crotch to soles = 40 percent. This must read as FIVE HEADS TALL INCLUDING HAIR, with smaller head and longer body. Do not merely shrink entire figure. Preserve facial identity, short dark brown hair, genderless character, white short sleeve tee, gray shorts, white sneakers. All 16 figures identical corrected proportions. Keep exactly
    same 4x4 layout, fixed four orientations by row, gentle four-phase idle loop, planted feet, transparency, painterly style, upper-left light. No rulers, text, lines, new objects or background.'
