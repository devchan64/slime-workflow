<!doctype html><meta charset="utf-8"><title>MoMask 4방향 · 6프레임 루프</title><style>body{background:#141924;color:#eee;font:16px sans-serif;margin:24px}main{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:16px}img{width:100%;background:#242b39}button,select{font-size:16px;margin:10px}p{color:#b8c5d8}</style><h1>MoMask · v9 5등신 리그 · 4방향 6프레임</h1><p>1.2초 루프 / 200ms씩 / 마지막 중복 프레임 제외. 중립 리그 5등신, 최종 캐릭터 이미지 아님.</p><button id="toggle">일시정지</button><select id="mode"><option value="preview">리그</option><option value="openpose">OpenPose</option><option value="depth">Depth</option></select><span id="counter"></span><main></main><script>const directionNameValues=['down_left','down_right','up_left','up_right'];let currentFrameIndex=0;let animationIsPlaying=true;const previewMainElement=document.querySelector('main');for(const directionNameValue of directionNameValues){previewMainElement.insertAdjacentHTML('beforeend',`<section><h2>${directionNameValue}</h2><img data-direction="${directionNameValue}"><a href="${directionNameValue}/contact-sheet.png">6프레임 펼쳐보기</a></section>`)}function updatePreviewImages(){for(const imageElementValue of document.querySelectorAll('img'))imageElementValue.src=`${imageElementValue.dataset.direction}/${document.querySelector('#mode').value}-${String(currentFrameIndex+1).padStart(4,'0')}.png`;document.querySelector('#counter').textContent=`${currentFrameIndex+1} / 6`;}document.querySelector('#toggle').onclick=()=>{animationIsPlaying=!animationIsPlaying;document.querySelector('#toggle').textContent=animationIsPlaying?'일시정지':'재생'};document.querySelector('#mode').onchange=updatePreviewImages;updatePreviewImages();setInterval(()=>{if(animationIsPlaying){currentFrameIndex=(currentFrameIndex+1)%6;updatePreviewImages()}},200);</script>
