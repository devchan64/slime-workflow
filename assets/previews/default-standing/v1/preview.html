<script>
const standingAnimationData={"animationId": "character.default.white-shirt.idle", "version": "2", "sheet": {"width": 1254, "height": 1254}, "frames": [{"frameId": "down_left.0", "rect": {"x": 0, "y": 0, "width": 313, "height": 313}, "anchor": {"x": 164.638, "y": 300.5}}, {"frameId": "down_left.1", "rect": {"x": 313, "y": 0, "width": 314, "height": 313}, "anchor": {"x": 159.619, "y": 301.5}}, {"frameId": "down_left.2", "rect": {"x": 627, "y": 0, "width": 313, "height": 313}, "anchor": {"x": 153.891, "y": 301.5}}, {"frameId": "down_left.3", "rect": {"x": 940, "y": 0, "width": 314, "height": 313}, "anchor": {"x": 150.866, "y": 301.5}}, {"frameId": "down_right.0", "rect": {"x": 0, "y": 313, "width": 313, "height": 314}, "anchor": {"x": 171.276, "y": 294.5}}, {"frameId": "down_right.1", "rect": {"x": 313, "y": 313, "width": 314, "height": 314}, "anchor": {"x": 167.468, "y": 294.0}}, {"frameId": "down_right.2", "rect": {"x": 627, "y": 313, "width": 313, "height": 314}, "anchor": {"x": 161.754, "y": 294.5}}, {"frameId": "down_right.3", "rect": {"x": 940, "y": 313, "width": 314, "height": 314}, "anchor": {"x": 160.224, "y": 294.5}}, {"frameId": "up_left.0", "rect": {"x": 0, "y": 627, "width": 313, "height": 313}, "anchor": {"x": 176.812, "y": 285.5}}, {"frameId": "up_left.1", "rect": {"x": 313, "y": 627, "width": 314, "height": 313}, "anchor": {"x": 173.189, "y": 286.0}}, {"frameId": "up_left.2", "rect": {"x": 627, "y": 627, "width": 313, "height": 313}, "anchor": {"x": 166.796, "y": 286.0}}, {"frameId": "up_left.3", "rect": {"x": 940, "y": 627, "width": 314, "height": 313}, "anchor": {"x": 164.841, "y": 286.0}}, {"frameId": "up_right.0", "rect": {"x": 0, "y": 940, "width": 313, "height": 314}, "anchor": {"x": 162.661, "y": 273.5}}, {"frameId": "up_right.1", "rect": {"x": 313, "y": 940, "width": 314, "height": 314}, "anchor": {"x": 159.174, "y": 275.0}}, {"frameId": "up_right.2", "rect": {"x": 627, "y": 940, "width": 313, "height": 314}, "anchor": {"x": 152.237, "y": 276.0}}, {"frameId": "up_right.3", "rect": {"x": 940, "y": 940, "width": 314, "height": 314}, "anchor": {"x": 150.4, "y": 275.5}}], "clips": [{"clipId": "idle.down_left", "action": "idle", "direction": "down_left", "frames": [{"frameId": "down_left.0", "durationMs": 400}, {"frameId": "down_left.1", "durationMs": 400}, {"frameId": "down_left.2", "durationMs": 400}, {"frameId": "down_left.3", "durationMs": 400}], "loop": true, "nextClipId": null}, {"clipId": "idle.down_right", "action": "idle", "direction": "down_right", "frames": [{"frameId": "down_right.0", "durationMs": 400}, {"frameId": "down_right.1", "durationMs": 400}, {"frameId": "down_right.2", "durationMs": 400}, {"frameId": "down_right.3", "durationMs": 400}], "loop": true, "nextClipId": null}, {"clipId": "idle.up_left", "action": "idle", "direction": "up_left", "frames": [{"frameId": "up_left.0", "durationMs": 400}, {"frameId": "up_left.1", "durationMs": 400}, {"frameId": "up_left.2", "durationMs": 400}, {"frameId": "up_left.3", "durationMs": 400}], "loop": true, "nextClipId": null}, {"clipId": "idle.up_right", "action": "idle", "direction": "up_right", "frames": [{"frameId": "up_right.0", "durationMs": 400}, {"frameId": "up_right.1", "durationMs": 400}, {"frameId": "up_right.2", "durationMs": 400}, {"frameId": "up_right.3", "durationMs": 400}], "loop": true, "nextClipId": null}]};
const standingImageElement=new Image();
const standingCanvasRecords=[];
let standingFrameIndex=0,standingPlaybackActive=true;
const standingFrameSlider=document.getElementById('frame'),standingPlaybackButton=document.getElementById('toggle');
const standingRenderScale=.8,standingBaselinePosition=260,standingCenterPosition=128;
function drawStandingFrame(){for(const standingCanvasRecord of standingCanvasRecords){const standingFrameId=standingCanvasRecord.clip.frames[standingFrameIndex].frameId;const standingFrameRecord=standingAnimationData.frames.find(frameRecordValue=>frameRecordValue.frameId===standingFrameId);const standingContextValue=standingCanvasRecord.context;standingContextValue.clearRect(0,0,256,290);standingContextValue.strokeStyle='#dab568';standingContextValue.beginPath();standingContextValue.moveTo(0,standingBaselinePosition);standingContextValue.lineTo(256,standingBaselinePosition);standingContextValue.stroke();const standingFrameRect=standingFrameRecord.rect;standingContextValue.drawImage(standingImageElement,standingFrameRect.x,standingFrameRect.y,standingFrameRect.width,standingFrameRect.height,standingCenterPosition-standingFrameRecord.anchor.x*standingRenderScale,standingBaselinePosition-standingFrameRecord.anchor.y*standingRenderScale,standingFrameRect.width*standingRenderScale,standingFrameRect.height*standingRenderScale)}standingFrameSlider.value=standingFrameIndex;document.getElementById('number').textContent=(standingFrameIndex+1)+' / 4'}
standingImageElement.onload=()=>{for(const standingClipRecord of standingAnimationData.clips){const standingSectionElement=document.createElement('section');standingSectionElement.innerHTML='<h2>'+standingClipRecord.direction+'</h2><canvas width="256" height="290"></canvas>';document.getElementById('views').append(standingSectionElement);standingCanvasRecords.push({clip:standingClipRecord,context:standingSectionElement.querySelector('canvas').getContext('2d')})}drawStandingFrame();document.getElementById('status').textContent='4방향 로딩 완료';setInterval(()=>{if(standingPlaybackActive){standingFrameIndex=(standingFrameIndex+1)%4;drawStandingFrame()}},400)};
standingImageElement.onerror=()=>{document.getElementById('status').textContent='스탠딩 참조 이미지 로드 실패'};
standingPlaybackButton.onclick=()=>{standingPlaybackActive=!standingPlaybackActive;standingPlaybackButton.textContent=standingPlaybackActive?'일시정지':'재생'};
standingFrameSlider.oninput=()=>{standingPlaybackActive=false;standingPlaybackButton.textContent='재생';standingFrameIndex=Number(standingFrameSlider.value);if(standingCanvasRecords.length)drawStandingFrame()};
standingImageElement.src='../../../references/default-standing/v2/reference.png';
</script>
