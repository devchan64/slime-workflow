schema_version: 1
usage: prompts에서 용도별로 선택한다. 모든 프롬프트를 합치지 않는다.
prompts:
  base-prompt:
    text: Illustrated fantasy game character with large expressive eyes, a simplified small nose and mouth, a softly tapered jaw, grouped painted hair locks, smooth color planes and soft painterly shadows. Preserve the character's distinctive eye color, hairstyle and facial features. Maintain a youthful adult impression within these stylized proportions.
    word_count: 48
  idle-animation-generation-prompt-01-04:
    text: 'Preserve reference identity, face size, hair, exact body proportions and armored silhouette; no widening. Four full-body idle frames in one equal-cell horizontal row, front-left view. Frames 1–4: rest, slight inhale, gentle shoulder rise, near inhalation peak. Minimal vertical motion, fixed feet and scale. Preserve outfit. Omit screenshot overlay. Transparent background.'
    word_count: 50
  idle-animation-generation-prompt-05-08:
    text: 'Preserve reference 1’s identity, face size, hair, exact body proportions and armored silhouette; no widening. Match reference 2’s four-cell layout and scale. Four full-body idle frames, front-left view. Frames 5–8: inhalation peak, gentle exhale, shoulders lowering, near initial rest. Minimal vertical motion, fixed feet. Preserve outfit. Omit screenshot overlay. Transparent background.'
    word_count: 51
  idle-to-rest-generation-prompt-01-04:
    text: 'Preserve reference identity, face size, hair, body proportions and outfit; no widening. Four full-body frames, horizontal row, front-left view. Idle-to-rest 1–4: standing idle, slight knee bend, hips lowering, deep crouch with hands reaching toward ground. Consistent camera, character scale and ground level. Transparent background.'
    word_count: 44
  idle-to-rest-generation-prompt-05-08:
    text: 'Preserve reference 1’s identity, proportions and outfit; no widening. Continue reference 2’s final crouch. Four full-body frames, horizontal row, front-left view. Idle-to-rest 5–8: supported crouch, hips settling onto ground, legs folding, seated cross-legged with hands on knees. Consistent camera, scale and ground level. Transparent background.'
    word_count: 45
  rest-to-idle-generation-prompt-01-04:
    text: 'Preserve reference 1’s identity, proportions and outfit; no widening. Begin from reference 2’s final seated pose. Four full-body frames, horizontal row, front-left view. Rest-to-idle 1–4: seated cross-legged, hands supporting on ground, legs uncrossing, feet planted in supported crouch. Consistent camera, scale and ground level. Transparent background.'
    word_count: 46
  rest-to-idle-generation-prompt-05-08:
    text: 'Preserve reference 1’s identity, proportions and outfit; no widening. Continue reference 2’s final crouch. Four full-body frames, horizontal row, front-left view. Rest-to-idle 5–8: hips rising, knees extending, torso straightening, original standing idle. Match original idle pose exactly. Consistent camera, scale and ground level. Transparent background.'
    word_count: 45
  walking-identity-generation-prompt:
    text: Preserve IMAGE 1’s character identity, face size, head-to-body ratio, torso width, limb lengths and circumferences, hair, outfit and rendering. Repose this same body using only IMAGE 2’s joint angles, limb overlap, foot placement, toe directions and ground contact. Keep IMAGE 1’s physique throughout the pose change. Front-left full-body walking frame, eye-level view, single frame. Transparent background.
    word_count: 56
