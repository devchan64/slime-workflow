schema_version: 1
prompts:
  base: generators/animation/config/prompts/base-prompt.txt
  auxiliary: generators/animation/config/prompts/auxiliary-prompt.txt
  auxiliary_rear: generators/animation/config/prompts/auxiliary-rear-prompt.txt
motions:
  walking-v1:
    action_prompt: generators/animation/config/prompts/walking-action.txt
    direction_auxiliary_prompts:
      down_left: ""
      down_right: ""
      up_left: ""
      up_right: ""
    target_fps: 6
    label: 걷기 v1 · HY-Motion 원근투영
    root: assets/motion-sheet/hy-motion-walking-v1
    manifest: manifest.yaml
    openpose: openpose/{direction}/openpose-{frame:04d}.png
    anny: anny/{direction}/anny-{frame:04d}.png
characters:
