schema_version: 2
prompt: >-
  Replace the outer clothing with an opaque blue strapless crop top fully covering the chest,
  ending above the original shirt hem, and opaque smooth close-fitting upper-thigh-length shorts
  with a waistband below the original trouser waistband. Keep the original exposed waist visible.
  Preserve the complete person, head, shoes, proportions, pose and exact image position.
  Plain white background.
outfit_prompt: >-
  Extract only the visible shirt and trouser surfaces from the original image.
  Preserve their exact position, scale, worn pose, silhouette, folds and colors.
  Replace the person, skin, head, hair and shoes with plain white background.
  Keep necklines, cuffs and waist openings white, including areas previously covered by the person.
  No added back panels, inner lining or hidden fabric.
