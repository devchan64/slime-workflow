schema_version: 2
prompt: >-
  Replace both shoes completely with natural bare feet: visible toes, heels and skin from ankles to toes.
  Preserve ankle positions and foot directions, using natural foot proportions instead of shoe outlines.
  Flat neutral chest and straight torso.
  Replace shirt with a short opaque blue rectangular chest band ending below the ribcage; bare shoulders and abdomen.
  Replace trousers with tight opaque blue upper-thigh shorts.
  Preserve head, limb lengths, pose, orientation and image position.
  Smooth flat chest fabric without cups or bust shading.
  Output RGBA with a transparent background.
outfit_prompt: >-
  Extract only clothing surfaces visible in the reference as a flat overlay.
  The entire area occupied by the neck is transparent, down to the original front neckline.
  Keep the visible shirt, trousers and shoes; preserve only the original visible collar edge.
  Leave all person-covered areas transparent rather than completing the garment behind them.
  Preserve their exact position, scale, worn pose, silhouette, folds and colors.
  Replace the person, skin, head, hair and exposed feet with transparency.
  No invented rear collar, back panel or lining inside openings.
  Output RGBA with a transparent background.
