schema_version: 2
prompt: >-
  Create a gender-neutral body base with a flat chest and straight torso and hips.
  Replace the outer clothing with an opaque blue strapless crop top fully covering the chest,
  ending immediately below the chest, leaving the abdomen uncovered, and opaque smooth close-fitting upper-thigh-length shorts
  with a waistband below the original trouser waistband. Keep the original exposed waist visible.
  Replace shoes with bare feet, keeping ankle positions and foot directions.
  Preserve the head, limb lengths, pose and exact image position.
  No breast contours, cleavage or exaggerated muscles.
  Plain white background.
outfit_prompt: >-
  Extract only clothing surfaces visible in the reference as a flat overlay.
  The entire area occupied by the neck stays plain white, down to the original front neckline.
  Keep the visible shirt, trousers and shoes; preserve only the original visible collar edge.
  Leave all person-covered areas white rather than completing the garment behind them.
  Preserve their exact position, scale, worn pose, silhouette, folds and colors.
  Replace the person, skin, head, hair and exposed feet with plain white background.
  No invented rear collar, back panel or lining inside openings.
