schema_version: 1
presets:
  standing:
    label: 대기
    prompt: A person stands upright with both feet planted, arms relaxed at their sides, slowly inhaling and exhaling deeply while looking forward.
    duration_seconds: 4
  walking:
    label: 걷기
    # 트레드밀 제자리 보행과 몸통·어깨·골반 회전을 지시한다. 생성 결과 검수 필요.
    prompt: A person walks in place on a treadmill, with gentle torso rotation, natural shoulder and hip counter-rotation, relaxed alternating arm swings, and gaze directed ahead.
    duration_seconds: 4
