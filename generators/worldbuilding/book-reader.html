<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@@TITLE@@</title><style>
:root{color-scheme:light;--paper:#faf7ef;--ink:#272f30;--accent:#2c6558}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.85 system-ui,sans-serif}aside{position:fixed;inset:0 auto 0 0;width:300px;overflow:auto;padding:28px;background:#eeeade;border-right:1px solid #d6d1c4}main{max-width:1100px;margin-left:300px;padding:50px 6vw}a{color:var(--accent)}h1{font:700 40px/1.35 Georgia,serif}h2{font-size:28px}h3{font-size:22px}li{margin:8px 0}aside ul{padding-left:18px}input,button{font:inherit;padding:9px;border:1px solid #b8c2b8;border-radius:5px;background:white}input{width:100%}article{margin-bottom:80px}article>header{border-bottom:2px solid #365c50;margin:40px 0 28px}.paragraph{margin:18px 0;scroll-margin-top:20px}.source,.eyebrow,small{font:12px/1.6 system-ui;color:#596d61;overflow-wrap:anywhere}.source{border-left:3px solid #c5d1bf;padding-left:10px}.prose{overflow-wrap:anywhere}.prose h1{font-size:28px}.prose h2{font-size:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edece5;padding:14px;font:13px/1.65 monospace}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid #c5cbbf;padding:8px}blockquote{border-left:3px solid #819681;padding-left:18px;margin-left:0}details{font-size:13px}summary{cursor:pointer}nav{display:flex;flex-wrap:wrap;gap:15px;margin:16px 0}[hidden]{display:none!important}@media(max-width:800px){aside{position:static;width:auto;max-height:45vh}main{margin:0;padding:25px}h1{font-size:30px}}@media print{aside,nav,input,button,details,.source{display:none}main{margin:0;max-width:none;padding:0}article{break-before:page}body{background:white;font-size:11pt}a{color:inherit;text-decoration:none}}
</style></head><body><aside><a href="/worldbuilding/library">← 도서 관리</a><h2>목차</h2><label for="bookSearch">본문 통합 검색</label><input id="bookSearch" type="search" placeholder="도시, 인물, 규칙 검색"><p id="searchStatus" role="status"></p><ol>@@TOC@@</ol><h2>용어 색인</h2><p><small>출현 빈도순 주요 용어 300개. 번호를 누르면 해당 문단으로 이동합니다.</small></p>@@INDEX@@</aside><main><header><p class="eyebrow">원문 보존 도서 · @@COUNT@@개 장</p><h1>@@TITLE@@</h1><p>@@TIME@@ 판본</p><p>원본 문단을 재배치한 편집본입니다. 승인·제안·과거 이력은 각 문단의 원문을 따릅니다.</p><nav><a href="book.html" download>웹 도서 저장</a><a href="book.md" download>Markdown 내려받기</a><button id="printBook" type="button">인쇄</button></nav><details><summary>참조 안내</summary><pre>@@WARNINGS@@</pre></details></header>@@BODY@@</main><script>
const bookParagraphEntries=[...document.querySelectorAll('.paragraph')];const bookChapterEntries=[...document.querySelectorAll('article')];const bookSearchInput=document.querySelector('#bookSearch');
function filterBookParagraphs(){const currentSearchText=bookSearchInput.value.trim().toLocaleLowerCase();let currentMatchCount=0;for(const currentParagraphElement of bookParagraphEntries){const currentMatchesFlag=!currentSearchText||currentParagraphElement.textContent.toLocaleLowerCase().includes(currentSearchText);currentParagraphElement.hidden=!currentMatchesFlag;if(currentMatchesFlag)currentMatchCount++;}for(const currentChapterElement of bookChapterEntries)currentChapterElement.hidden=![...currentChapterElement.querySelectorAll('.paragraph')].some(currentParagraphElement=>!currentParagraphElement.hidden);document.querySelector('#searchStatus').textContent=currentMatchCount+' / '+bookParagraphEntries.length+'개 문단';}
bookSearchInput.addEventListener('input',filterBookParagraphs);document.querySelector('#printBook').onclick=()=>{bookSearchInput.value='';filterBookParagraphs();window.print();};document.addEventListener('click',currentClickEvent=>{const currentAnchorElement=currentClickEvent.target.closest('a[href^="#"]');if(currentAnchorElement){bookSearchInput.value='';filterBookParagraphs();}});filterBookParagraphs();
</script></body></html>
