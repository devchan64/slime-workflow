schema_version: 1
style_prompt: "Hand-painted fantasy game texture, clean readable shapes, consistent soft lighting, rich natural colors, crisp material details."
types:
  rooftop:
    label: 지붕 타일
    base_prompt: "Seamless roof covering texture for sloped block surfaces. Orthographic view perpendicular to the material plane. Small overlapping roofing pieces in evenly spaced horizontal courses, running left to right; overlap faces image bottom. Consistent scale, matching opposite edges, subtle relief, neutral diffuse lighting. Material fills the square edge to edge; no building silhouette or perspective."
  wall:
    label: 벽 타일
    base_prompt: "A single plain building wall tile, straight-on orthographic elevation, flat facade filling the square, horizontally repeating edges."
  ground:
    label: 맵 타일
    base_prompt: "A single seamless ground material tile, top-down orthographic view, uniform scale, texture filling the square with matching edges."
