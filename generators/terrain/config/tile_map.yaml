schema_version: 1
style_prompt: "Hand-painted fantasy game texture, clean readable shapes, consistent soft lighting, rich natural colors, crisp material details."
types:
  rooftop:
    label: 지붕 타일
    base_prompt: "Top-down seamless roofing surface filling the image, one flat continuous plane, thin structural edge frame along all outer edges for adjacent connections, no interior beams, roof tiers, building silhouette, or background."
  wall:
    label: 벽 타일
    base_prompt: "Orthographic flat building wall, square facade, half-visible columns at both edges, a top beam, edge-aligned for adjacent placement."
  ground:
    label: 바닥 타일
    base_prompt: "Orthographic overhead ground texture for repeated placement, camera pointing straight down. Fill the square with one continuous surface at uniform scale and even lighting. Match opposite edges without visible seams. No border, frame, perspective, horizon, vegetation, or landscape composition."
