    prompt: 'Global Metadata

      Instrumental acoustic background music for Iseulon village in a fantasy RPG.

      Peaceful and welcoming, steady 88 BPM, 4/4 time, warm major harmony,

      gentle dynamics and clear acoustic instruments.


      Arrangement

      Introduction: flowing harp arpeggios and light pizzicato strings establish

      the accompaniment. Wooden flute presents a warm, lyrical main theme.

      Development: warm double bass and quiet brushed percussion enter beneath

      the continuing harp and strings. Oboe answers the flute with a gentle

      countermelody, gradually enriching the musical texture.

      Variation: flute and oboe exchange melodic phrases while legato violas

      broaden the harmony. Maintain a calm, steady groove and connect the

      phrases smoothly, with subtle changes in the string accompaniment.

      Reprise: bring back the opening theme, shared by flute and oboe over

      the fuller acoustic ensemble. Keep the melody clear and the accompaniment

      restrained, allowing the returning theme to resolve.

      Ending: let percussion and bass gradually settle as the flute completes

      a resolved final cadence. Harp and strings support the closing harmony,

      then release into a short natural instrumental decay.

      Acoustic instruments carry all melodies throughout the piece.'
