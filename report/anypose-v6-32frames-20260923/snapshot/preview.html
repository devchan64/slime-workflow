<!doctype html><meta charset="utf-8"><title>AnyPose · 마네킹 v6 · 32프레임</title><style>body{font:16px system-ui;background:#20252b;color:white;margin:24px}main{display:grid;grid-template-columns:repeat(4,1fr)}img{width:100%}a{color:lightblue}</style><h1>AnyPose · 마네킹 v6 · 32프레임</h1><p>캐릭터 baseline-v2 + 마네킹 v6 리그 참조 / AnyPose + Lightning 4steps / 512×512 / 150ms 재생</p><button id="play">일시정지</button><select id="mode"><option value="result">결과</option><option value="rig-reference">리그 참조</option><option value="character-reference">캐릭터 참조</option></select><span id="frame"></span><main></main><script>const directions=['down_left','down_right','up_left','up_right'];let frame=1,playing=true;for(const direction of directions)document.querySelector('main').insertAdjacentHTML('beforeend','<section><h2>'+direction+'</h2><img data-direction="'+direction+'"><a href="'+direction+'-sheet.png">8프레임 시트</a></section>');function update(){for(const img of document.querySelectorAll('img'))img.src=img.dataset.direction+'/frame-'+String(frame).padStart(2,'0')+'/'+document.querySelector('#mode').value+'.png';document.querySelector('#frame').textContent=frame+'/8'}document.querySelector('#play').onclick=()=>{playing=!playing};document.querySelector('#mode').onchange=update;setInterval(()=>{if(playing){frame=frame%8+1;update()}},150);update()</script>
