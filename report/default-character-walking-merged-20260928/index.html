<!doctype html><html lang="ko"><meta charset="utf-8"><title>걷기 병합 검수</title><style>body{background:#182230;color:#edf3fc;font:16px sans-serif;margin:24px}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}figure{margin:0}img{width:100%;background:white}button,input{margin:8px;padding:8px}figcaption{padding:8px}</style><h1>기본 캐릭터 걷기 병합 검수</h1><p>4방향 · 6프레임 · 4 FPS · 후방 우측 교체</p><button id="play">재생</button><button id="prev">이전</button><button id="next">다음</button><input id="seek" type="range" min="0" max="5" value="0" aria-label="프레임"><span id="status"></span><section><figure><figcaption>전방 좌측</figcaption><img id="down_left" src="frames/down_left/frame-0008.png" alt="전방 좌측"></figure><figure><figcaption>전방 우측</figcaption><img id="down_right" src="frames/down_right/frame-0008.png" alt="전방 우측"></figure><figure><figcaption>후방 좌측</figcaption><img id="up_left" src="frames/up_left/frame-0008.png" alt="후방 좌측"></figure><figure><figcaption>후방 우측</figcaption><img id="up_right" src="frames/up_right/frame-0008.png" alt="후방 우측"></figure></section><p><a href="review-sheet.jpg">전체 시트</a> · <a href="README.md">리포트</a></p><script>const frames=[8,12,16,20,24,28],dirs=['down_left','down_right','up_left','up_right'];let index=0,timer=null;function draw(){for(const d of dirs)document.getElementById(d).src=`frames/${d}/frame-${String(frames[index]).padStart(4,'0')}.png`;document.getElementById('status').textContent=`${index+1}/6 · 원본 ${frames[index]}번`;document.getElementById('seek').value=index}function stop(){clearInterval(timer);timer=null;document.getElementById('play').textContent='재생'}document.getElementById('play').onclick=()=>{if(timer){stop();return}timer=setInterval(()=>{index=(index+1)%6;draw()},250);document.getElementById('play').textContent='정지'};document.getElementById('prev').onclick=()=>{stop();index=(index+5)%6;draw()};document.getElementById('next').onclick=()=>{stop();index=(index+1)%6;draw()};document.getElementById('seek').oninput=e=>{stop();index=+e.target.value;draw()};draw();</script></html>
