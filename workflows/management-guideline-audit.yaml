static_html_followup: "2026-10-15 서버만 적용하던 HTML 경로 검증도 공용 등록 로더로 이동하여 GUI가 비 HTML 파일을 승인하는 차이 제거. PNG 경로 입력의 GUI·서버 동시 거절을 기존 등록 검증에 추가. 기존 URL 및 정상 HTML 매핑은 유지. 페이지 렌더링 변경은 없음."
static_registry_followup: "2026-10-15 직접 문서 라우팅은 비객체 페이지를 무시하고 중복 ID 검증을 하지 않아 GUI 경로 로더와 다른 판정을 내리는 점 확인. common/static_review_registry.py로 등록 경로 읽기를 공용화하여 GUI와 serve.py가 동일 검증 사용. 비정상 루트·목록·항목·중복 ID의 양쪽 거절 및 정상 경로 매핑 회귀 포함 13건 통과(.tmp/test/static-registry-contract/2026-10-15_15-51-02/summary.json). 서버 시작 시 원본 미존재를 허용하던 기존 계약과 HTML 라우트 검증은 유지. 운영 원본 부재에 따른 현재 페이지 매핑 대조는 여전히 미완료."
