image_defaults_followup: "2026-10-15 이미지 config 원본 9개와 style_source의 prompts/art-style.yaml 총 10개 존재·Git 추적·ignore 미해당 확인. 실행 시 외부 비공개 문서를 읽지 않고 저장된 실행용 문구 사용. Qwen 옵션 YAML의 common_style 중복 키가 second로 조용히 덮어써지는 현상 임시 설정으로 재현 후 중복 키 거절 로더 적용. 정상 문구 조합 포함 명령 회귀 6건 통과: .tmp/test/qwen-options-duplicate/2026-10-15_15-06-04/summary.json. 운영 설정은 수정하지 않음."
default_tracking_followup: "2026-10-15 소비 코드의 상수에서 음악 defaults, Phantom/VACE defaults, HY defaults·motion-presets·encoder-system, pose-motion-prompts, walking-v2 manifest 총 8개 원본 경로 확인. manifest directions·frames로 load_motion_reference의 실제 anny 경로를 전개한 4방향×35=140개 이미지 포함, 148개 모두 파일 존재·git ls-files 추적·git check-ignore 미해당 확인. 모델 캐시와 실행별 입력은 제외. 포즈 프롬프트의 기존 미커밋 변경 보존. 전체 다른 생성기 원본 추적 검증 완료를 뜻하지 않음."
negative_prompt_followup: "2026-10-15 generators/vace 및 phantom의 contracts·worker·runtime을 대조하여 실제 부정 입력이 저장된 모델 설정 negative_prompt에서 전달됨을 확인. 공용 이력 단어 수는 해당 중첩 설정을 최상위 필드보다 우선하며 미기록 값을 기본값으로 채우지 않음. 충돌하는 최상위 값·빈 부정 입력·미기록 조건 포함 5건 통과: .tmp/test/history-negative-prompt-counts/2026-10-15_14-47-25/summary.json. 해당 형식의 브라우저 표시 검증은 남음."
history_prompt_followup: "2026-10-15 공용 결과 입력 화면이 final_prompt 대신 prompt를 실제 입력으로 표시하고 단어 수를 누락한 문제 수정. 저장 최종 문구 우선 표시, 저장 원문·최종 단어 수를 원문에서 계산하며 최종 문구 미기록 시 현재 기본값으로 재구성하지 않음을 명시. 과거 suffix 보존·잘못된 저장 숫자에 의존하지 않음·빈 문구·줄바꿈 계산 회귀 포함 25건 통과(.tmp/test/history-prompt-counts/2026-10-15_14-44-19/summary.json). 실제 공용 메뉴+음악 Blocks 격리 브라우저의 결과 조회에서 flute old saved suffix 및 저장 원문 1단어·저장 최종 입력 4단어 표시 확인. 현재 생성 입력은 빈 상태 유지, 콘솔 오류 없음. 생성·입력 복원·삭제 요청 없음. 다른 기록 형식의 브라우저 검증은 남음."
writer_selection_followup: "2026-10-15 이력 선택의 제안·확인 초기화를 input에서 change로 변경. 수동 선택뿐 아니라 작업 접수·새로고침의 프로그램 선택 변경에도 이전 제안과 확인을 초기화한다. 이벤트가 change에 연결되는지 회귀 검증을 보강. 서버 ID 일치 검증은 유지. 공용 메뉴와 실제 Writer Blocks 격리 브라우저에서 모의 제안 조회·동의 체크 후 적용 버튼 활성 확인. 모의 state 목록에서 해당 ID 제외 후 새로고침으로 프로그램 선택 해제 시 ID·차이·근거가 비워지고 동의 해제·적용 버튼 및 조회 버튼 비활성 확인. 콘솔 오류 없음. 실제 적용 명령 차단, 운영 문서·작업 변경 없음. 회귀 10건 통과: .tmp/test/writer-selection-change/2026-10-15_14-40-04/summary.json."
prompt_count_followup: "2026-10-15 Phantom·VACE 타임라인은 양성·부정 원문과 최종 단어 수를 각각 표시함을 소스에서 확인. 공용 음악 화면은 자동 추가 문구의 개별 단어 수가 누락되어 원문·추가·최종 표시로 수정. MiniMax·ACE-Step 각각 반복 OFF/ON 4가지 조건에서 공백·줄바꿈 입력을 build_music_request 최종 원문 및 단어 수와 대조하여 일치 확인(2+4=6, 2+15=17). 생성 요청 없음. 추가 브라우저 검증: 실제 MiniMax Blocks와 공용 메뉴를 합성한 격리 문서에서 입력 flute calm → 2+4=6, 반복 ON → 2+15=17 및 최종 원문 일치 확인. 초기화 → 0+15=15, 생성 버튼 비활성 복귀 확인. 콘솔 오류 없음. 모의 게이트웨이에서 생성 명령을 차단했으며 운영 작업 변경 없음. ACE-Step 후속 브라우저 확인은 ace_status_prompt_followup 참조."
