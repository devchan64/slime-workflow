circular_invalid_input_followup: "2026-10-15 순환 서비스에 None·배열 요청 또는 None·숫자 프롬프트 전달 시 get/strip AttributeError 발생을 재현. 공통 최종 검증 전 요청 객체·프롬프트 문자열 타입 검사를 추가하여 명시적 한국어 ValueError로 거절. 기존 빈 원문+옵션 계약은 유지. 잘못된 객체 4종·프롬프트 5종을 포함한 서비스 테스트 12건 통과: .tmp/test/circular-invalid-input/2026-10-15_15-34-29/summary.json. 공용 /management/command 봉투와 호환 /image-generation-21-circular/jobs 경로에 실제 서비스 핸들러를 연결한 메모리 HTTP 어댑터 검사에서 잘못된 프롬프트 4종 모두 400·명시적 오류 응답 및 실행 준비 호출 0회 확인. 게이트웨이 회귀 10건 통과: .tmp/test/circular-gateway-errors/2026-10-15_15-37-03/summary.json. 실제 소켓 전송 검증과는 구분하며 운영 생성·파일 기록은 실행하지 않음."
circular_history_followup: "2026-10-15 순환 서비스는 user_prompt에 원문, prompt에 옵션 포함 최종 입력을 저장하지만 공용 이력은 최종 10단어를 원문으로 표시하고 최종 문구 없음으로 안내하는 형식 불일치 확인. circular_vae 기록과 user_prompt를 가진 저장 요청을 분리 해석하도록 수정. 실제 서비스 검증 결과 원문 1·최종 10단어 및 과거 저장 문구·빈 원문 보존 확인. 테스트 요청 필수 필드 누락을 수정한 뒤 7건 통과: .tmp/test/circular-history-counts/2026-10-15_15-30-00/summary.json. 실제 순환 Qwen Blocks+공용 메뉴를 합성한 격리 브라우저의 결과 조회에서 저장 원문 1단어·최종 입력 3단어 및 grass historical pattern 표시 확인. 현재 생성 입력 잔디와 꽃을 그린다. 유지, 콘솔 오류 없음. 모의 기록만 조회하고 생성·복원·삭제는 실행하지 않음. 검증 탭과 서버 종료."
circular_readiness_followup: "2026-10-15 순환 GUI가 옵션 결합 전 일반 Qwen 검증을 호출하여 서비스와 빈 입력·길이 제한 판단이 다른 문제 확인. 옵션을 포함해 QwenCircularGenerationManager 검증 후 원래 요청을 게이트웨이에 전달하도록 수정. 옵션 포함 1~99단어 readiness 연결. 실제 확인 콜백의 모의 dispatch에서 빈 원문+옵션 허용 및 95단어+9단어 추가 거절·무전송 검증. 콜백 탐색 테스트 오류 2회 수정 후 19건 통과: .tmp/test/circular-input-readiness/2026-10-15_15-22-01/summary.json. 실제 순환 Blocks+공용 메뉴의 격리 브라우저에서 빈 원문·옵션 OFF 비활성, 95+9=104단어 비활성, 1+9=10단어 활성, Gradio 인라인 확인·취소 후 활성 복귀 확인. 콘솔 오류 없음. 생성 명령은 차단한 상태이며 실제 접수 없음. 비활성 상태에 남던 정적 생성 가능 안내를 중립적인 프롬프트·옵션 확인 안내로 수정. 격리 서버 재시작·브라우저 재로드 후 프롬프트와 옵션을 확인하세요 문구 표시 확인. 임시 탭과 검증 서버 종료."
qwen_option_word_labels: "2026-10-15 원문을 표시하는 일반·순환 Qwen 옵션 4개에 개별 단어 수 추가. 실제 Gradio 구성에서 공용 화풍 27·투명 배경 11·탑뷰 패턴 5·음영 4단어가 각 원문 앞에 표시됨을 확인. 기존 선택 옵션 합계·최종 입력 계산은 유지. 순환 Qwen 실제 Blocks+공용 메뉴 격리 브라우저에서 패턴 5·음영 4단어 표시와 옵션 해제 시 합계 3+9=12 → 3+4=7 → 3+0=3 갱신 확인. 콘솔 오류·생성 요청 없음. 후속 Qwen 격리 브라우저에서 공용 화풍 27단어·투명 배경 11단어 원문 라벨 표시도 확인."
qwen_empty_prompt_followup: "2026-10-15 일반 Qwen 격리 합성 초기 화면에서 빈 프롬프트·두 옵션 OFF인데 이미지 생성 시작 활성 및 생성 가능 안내 표시 확인. qwen_2511_app.py의 bind_gpu_generation_confirmation readiness는 pose_transfer에만 연결되고 일반 Qwen은 None임을 대조. 수정: 일반 Qwen에 최종 문구 1~99단어 readiness를 연결하고 빈 초기 입력 비활성·옵션 포함 길이 제한·공용 안내를 추가. 옵션만으로 유효한 문구가 구성되는 기존 서버 계약은 보존. 격리 실제 Qwen Blocks+공용 메뉴 브라우저에서 빈 초기 입력 비활성, figure 입력 활성, 100단어 입력 비활성, 초기화 비활성 유지, 스타일 옵션 ON 시 최종 27단어 활성 확인. 콘솔 오류 없음, 생성 요청 없음. 관련 회귀 12건 통과: .tmp/test/qwen-prompt-readiness/2026-10-15_15-14-51/summary.json. 운영 생성 명령은 실행하지 않음."
qwen_history_prompt_followup: "2026-10-15 validate_qwen_plain_request 저장 계약을 대조: prompt는 최종 문구, qwen21.user_prompt·additional_prompt가 원문·추가 문구. 공용 이력에서 이를 분리 계산하도록 수정. 과거 문구 보존·빈 추가 문구 포함 6건 통과(.tmp/test/qwen-history-prompt-counts/2026-10-15_15-11-26/summary.json). 현재 옵션 설정을 다시 읽지 않음. 실제 Qwen Blocks+공용 메뉴 격리 브라우저에서 저장 figure historical style 및 원문 1·추가 2·최종 3단어 표시 확인. 현재 편집 프롬프트는 빈 상태 유지, 콘솔 오류 없음. 생성·복원·삭제 요청 없음."
pose_manifest_followup: "2026-10-15 설명·표정·seamless·HY 설정은 중복 키 거절 로더 사용을 소스 확인. 걷기 참조 manifest만 safe_load여서 기존 UniqueAssetYamlLoader로 변경. 중복 frames를 이미지 접근 전에 거절하는 신규 격리 검사와 기존 포즈 참조 검사 총 7건 통과: .tmp/test/pose-manifest-validation/2026-10-15_15-07-07/summary.json. 신규 검사를 전수 회귀 실행기에 포함. 사용자 수정 중인 보조 프롬프트·기존 테스트 파일은 편집하지 않음. 후속으로 소비 필드 frames=35·중복 없는 등록 4방향·140개 참조 해시 형식의 사전 검증 추가. 잘못된 객체·bool 프레임·방향·누락 해시를 명확한 ValueError로 거절하고 기존 참조와 함께 8건 통과(.tmp/test/pose-manifest-fields/2026-10-15_15-08-47/summary.json). 카메라·출처 등 비소비 메타데이터 전체 스키마 검증 완료를 뜻하지 않음."
image_defaults_followup: "2026-10-15 이미지 config 원본 9개와 style_source의 prompts/art-style.yaml 총 10개 존재·Git 추적·ignore 미해당 확인. 실행 시 외부 비공개 문서를 읽지 않고 저장된 실행용 문구 사용. Qwen 옵션 YAML의 common_style 중복 키가 second로 조용히 덮어써지는 현상 임시 설정으로 재현 후 중복 키 거절 로더 적용. 정상 문구 조합 포함 명령 회귀 6건 통과: .tmp/test/qwen-options-duplicate/2026-10-15_15-06-04/summary.json. 운영 설정은 수정하지 않음."
default_tracking_followup: "2026-10-15 소비 코드의 상수에서 음악 defaults, Phantom/VACE defaults, HY defaults·motion-presets·encoder-system, pose-motion-prompts, walking-v2 manifest 총 8개 원본 경로 확인. manifest directions·frames로 load_motion_reference의 실제 anny 경로를 전개한 4방향×35=140개 이미지 포함, 148개 모두 파일 존재·git ls-files 추적·git check-ignore 미해당 확인. 모델 캐시와 실행별 입력은 제외. 포즈 프롬프트의 기존 미커밋 변경 보존. 전체 다른 생성기 원본 추적 검증 완료를 뜻하지 않음."
negative_prompt_followup: "2026-10-15 generators/vace 및 phantom의 contracts·worker·runtime을 대조하여 실제 부정 입력이 저장된 모델 설정 negative_prompt에서 전달됨을 확인. 공용 이력 단어 수는 해당 중첩 설정을 최상위 필드보다 우선하며 미기록 값을 기본값으로 채우지 않음. 충돌하는 최상위 값·빈 부정 입력·미기록 조건 포함 5건 통과: .tmp/test/history-negative-prompt-counts/2026-10-15_14-47-25/summary.json. 해당 형식의 브라우저 표시 검증은 남음."
history_prompt_followup: "2026-10-15 공용 결과 입력 화면이 final_prompt 대신 prompt를 실제 입력으로 표시하고 단어 수를 누락한 문제 수정. 저장 최종 문구 우선 표시, 저장 원문·최종 단어 수를 원문에서 계산하며 최종 문구 미기록 시 현재 기본값으로 재구성하지 않음을 명시. 과거 suffix 보존·잘못된 저장 숫자에 의존하지 않음·빈 문구·줄바꿈 계산 회귀 포함 25건 통과(.tmp/test/history-prompt-counts/2026-10-15_14-44-19/summary.json). 실제 공용 메뉴+음악 Blocks 격리 브라우저의 결과 조회에서 flute old saved suffix 및 저장 원문 1단어·저장 최종 입력 4단어 표시 확인. 현재 생성 입력은 빈 상태 유지, 콘솔 오류 없음. 생성·입력 복원·삭제 요청 없음. 다른 기록 형식의 브라우저 검증은 남음."
writer_selection_followup: "2026-10-15 이력 선택의 제안·확인 초기화를 input에서 change로 변경. 수동 선택뿐 아니라 작업 접수·새로고침의 프로그램 선택 변경에도 이전 제안과 확인을 초기화한다. 이벤트가 change에 연결되는지 회귀 검증을 보강. 서버 ID 일치 검증은 유지. 공용 메뉴와 실제 Writer Blocks 격리 브라우저에서 모의 제안 조회·동의 체크 후 적용 버튼 활성 확인. 모의 state 목록에서 해당 ID 제외 후 새로고침으로 프로그램 선택 해제 시 ID·차이·근거가 비워지고 동의 해제·적용 버튼 및 조회 버튼 비활성 확인. 콘솔 오류 없음. 실제 적용 명령 차단, 운영 문서·작업 변경 없음. 회귀 10건 통과: .tmp/test/writer-selection-change/2026-10-15_14-40-04/summary.json."
prompt_count_followup: "2026-10-15 Phantom·VACE 타임라인은 양성·부정 원문과 최종 단어 수를 각각 표시함을 소스에서 확인. 공용 음악 화면은 자동 추가 문구의 개별 단어 수가 누락되어 원문·추가·최종 표시로 수정. MiniMax·ACE-Step 각각 반복 OFF/ON 4가지 조건에서 공백·줄바꿈 입력을 build_music_request 최종 원문 및 단어 수와 대조하여 일치 확인(2+4=6, 2+15=17). 생성 요청 없음. 추가 브라우저 검증: 실제 MiniMax Blocks와 공용 메뉴를 합성한 격리 문서에서 입력 flute calm → 2+4=6, 반복 ON → 2+15=17 및 최종 원문 일치 확인. 초기화 → 0+15=15, 생성 버튼 비활성 복귀 확인. 콘솔 오류 없음. 모의 게이트웨이에서 생성 명령을 차단했으며 운영 작업 변경 없음. ACE-Step 후속 브라우저 확인은 ace_status_prompt_followup 참조."
