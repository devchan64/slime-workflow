- id: hy-motion-memory-status
  status: verified_contract_browser_pending
  finding: HY-Motion 서비스 상태 응답에 공용 대기열 VRAM 기록이 없고 GUI는 상태·ETA만 표시.
  change: 시작·종료 작업 상태에 공용 실행 시도 측정값 연결, GUI 공용 VRAM·단계 표시 적용. 기존 ETA 별도 영역과 품질 경고 유지. queued에서는 이전 측정값 미조회.
  evidence: .tmp/test/management-hy-telemetry/2026-10-15_11-01-56/summary.json
  validation: HY-Motion·재접속 복원·상태 표시 30개 통과. 실제 브라우저 표시 및 GPU 실측 전체 계약은 별도 검증 필요.
- id: map-container-resize-observation
  status: verified_unit_live_browser
  change: 부모 영역 ResizeObserver와 animation frame 병합 적용. 숨김 영역은 표시 이벤트까지 렌더링 유보, pagehide에서 관찰·예약 정리, 실패 상태 안내.
  validation: 크기 이벤트 병합·숨김/재표시·실패 안내·이탈 정리 포함 수명 검사 4개 통과. 실제 사이드바 접기 후 내부 2354x1766, 펼치기 후 1718x1289로 추가 조작 없이 갱신 및 오류 콘솔 없음 확인.
  finding: 사이드바 접기/펼치기는 window resize 없이 컨테이너 폭을 바꿈. 내부 해상도 갱신은 다음 회전 조작에서 확인됨.
  evidence: 실제 합성 화면에서 사이드바 펼치기 직후 clientWidth 959 대비 내부 width 2354 관측. 현재 코드는 window.onresize만 등록.
  note: 실제 합성 쓰러진 수관 화면에서 검증. 다른 페이지의 개별 반응형 검증을 대체하지 않음.
- id: map-resize-framebuffer-failure
  status: verified_unit_partial_browser
  diagnosis: 오류 화면 DOM에서 부모 859x644.25 대비 캔버스 287x0 및 내부 높이 0 확인. Phaser가 바꾼 캔버스 표시 크기를 다음 resize 입력으로 재사용함.
  change: 초기화와 resize 모두 부모 표시 영역 기준으로 계산하고 캔버스 CSS 크기를 100%로 유지. 0·비정상 크기는 WebGL 호출 전 명시적으로 거절.
  validation: 축소·재확대 기반 크기 계산, 0높이 캔버스 회복, 중복 resize 생략, 0영역 거절 포함 공용 맵 검사 9개 통과. Gradio 구성 검사에서 unclosed event loop 경고 관측. 실제 합성 브라우저에서 렌더링·폭 변경 후 회전·새로고침 성공 및 오류 콘솔 없음 확인. 모바일 크기 검증은 남음.
  finding: 쓰러진 수관 실제 합성 문서에서 Phaser resize 중 Framebuffer status Incomplete Attachment 오류. 상태는 준비 완료로 남고 회전 미반영.
  evidence: 2026-10-15 브라우저 탭 30 콘솔 phaser.mjs createFramebuffer/resize 오류 및 회전 후 상태 0도 유지.
  note: viewport 390x844 요청 후 DOM은 1265x720으로 관측되어 모바일 검증은 성립하지 않음. override는 reset 완료. 오류와 크기 변경의 인과 및 복구 검증 필요.
