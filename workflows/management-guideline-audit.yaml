history_view_boundary_followup: "2026-10-15 결과 조회 collect_saved_input_view는 작업 폴더 링크를 resolve한 뒤 읽어 다른 작업 참조를 표시함을 격리 테스트로 재현(8통과·1실패). 입력 복원과 동일하게 작업 폴더 자체의 심볼릭 링크를 거절하고 참조·다운로드 링크 없이 사유 표시하도록 수정. 일치하는 해시의 다른 작업 PNG와 폴더 링크를 사용, 대상 원본 바이트 보존 검증. .tmp/test/history-view-boundary/2026-10-15_16-15-51/summary.json 9건 통과. 격리 실제 Blocks·공용 메뉴의 결과 조회에서 빈 참조 갤러리·심볼릭 링크 제외 사유·원본 링크 없음 확인. 저장 프롬프트는 정상 표시, 콘솔 오류 없음. 임시 작업 파일만 사용하고 서버·탭 종료."
