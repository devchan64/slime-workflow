landmark_error_followup: "2026-10-15 기준점 GUI 명령 경계에서 HTTP 클라이언트 ValueError/OSError를 Gradio Error로 전달하여 서비스 원인이 기본 오류 표시에 가려지지 않도록 수정. 실패 시 원본 초안 미변경과 무저장 회귀 6건 통과(.tmp/test/landmark-error-feedback/2026-10-15_15-47-38/summary.json). 실제 Blocks+공용 메뉴 격리 브라우저에서 모의 preview 거절 시 기준점 지정 근거가 필요합니다. 표시 및 빈 후보 저장 비활성 유지 확인. 실제 서비스·저장·GPU 호출 없이 검증하고 탭·서버 종료."
