floor_prompt_readiness_followup: "2026-10-15 바닥 타일 서비스는 빈 사용자 입력·최종 100단어 이상을 거절하지만 GUI 생성 버튼은 항상 활성임을 확인. 공용 확인 readiness에 최종 문구 검증 상태를 연결하고 초기 비활성 및 해결 안내 제공. 입력·여백 옵션·3초 카탈로그 갱신에 같은 상태 계산을 적용하여 확인 중 잠금 유지. 기본 문구 포함 99/100단어 경계와 여백 ON/OFF 포함 20건 통과(.tmp/test/floor-prompt-readiness/2026-10-15_17-18-40/summary.json). 실제 바닥 Blocks·공용 메뉴 격리 브라우저에서 확인 중 입력 변경 잠금, 초기화 후 취소 비활성, 사용자 91+기본 9=최종 100단어 비활성 확인. 콘솔 오류 없음. 상태 갱신의 생성 가능 문구가 빈 입력에도 표시되는 추가 문제를 발견하여 작업 없음·입력 확인 안내로 수정. 해당 문구 변경 후 브라우저 재확인은 남음. 운영 생성 무접수·검증 서버와 탭 종료."
hy_confirmation_readiness_followup: "2026-10-15 HY-Motion 입력·모델 상태 새로고침이 확인 중 생성 버튼을 직접 활성화하고 취소도 모델 준비 조건을 무시하는 연결 확인. 모델·요청 검증 결과는 Gradio State에 보관하고 공용 확인의 pending+readiness만 버튼을 제어하도록 통합. 준비 새로고침·입력 변경·최초 로딩에서 같은 상태 사용. 기존 모델 준비 안내와 서비스 검증 유지. 회귀 9건 통과(.tmp/test/hy-confirmation-readiness/2026-10-15_17-14-30/summary.json). 실제 HY-Motion Blocks·공용 메뉴 격리 브라우저에서 모델 준비 시 생성 활성, 확인 중 준비 새로고침 후 잠금 유지, 모의 미준비 전환 후 새로고침·취소에서 비활성 및 준비 안내 유지 확인. 콘솔 오류 없음. 생성·모델 준비 명령 차단, 임시 서버·탭 종료."
music_confirmation_readiness_followup: "2026-10-15 두 음악 생성기의 프롬프트 변경 이벤트가 확인 중 버튼 비활성을 덮어쓰고 공용 취소 콜백은 빈 입력에서도 활성화하는 연결 누락 발견. 별도 입력 이벤트는 안내만 갱신하고 버튼은 공용 pending+프롬프트 readiness로 통합. 두 서비스 실제 Blocks 콜백에서 빈 입력·확인 중 변경·빈 입력 취소·유효 입력 복귀 검증. 관련 회귀 11건 통과(.tmp/test/music-confirmation-readiness/2026-10-15_17-11-28/summary.json). MiniMax 실제 Blocks·공용 메뉴 격리 브라우저에서 flute 입력 후 확인 영역 열림, 확인 중 strings로 변경해도 생성 버튼 비활성 유지, 프롬프트 초기화 후 취소 시 빈 입력·버튼 비활성 유지 확인. 콘솔 오류 없음. 생성 명령 차단, 임시 서버·탭 종료. ACE-Step 개별 브라우저 전환 검증과 구분."
vace_required_input_followup: "2026-10-15 V2V 생성 설정 확인에 공용 readiness 연결. 초기 비활성, 파일·배치표 동일 길이 및 비어 있지 않은 장면 입력일 때 활성. 파일 로딩·삭제·프롬프트 변경 및 확인 취소 후 같은 조건 재평가. 공용 버튼 사유·해결 안내 제공. 필수 입력 및 확인 회귀 13건 통과(.tmp/test/vace-required-input/2026-10-15_16-48-18/summary.json). 실제 V2V Blocks·공용 메뉴 격리 브라우저에서 빈 초기 입력의 버튼 비활성과 포즈 PNG·배치표·장면 입력 안내 확인. 후속 격리 브라우저에서 자체 생성 32×32 PNG 첨부·배치표 로딩 후 walk 입력으로 활성, 설정 확인 시 버튼 비활성·Gradio 확인 영역 표시, 추가하지 않기 취소 후 재활성, 장면 초기화 후 비활성 복귀 확인. 콘솔 오류 없음. 등록 버튼은 실행하지 않음. 운영 접수 없음, 검증 서버·탭 종료."
vace_worker_estimate_browser_followup: "2026-10-15 실제 VACE V2V Blocks·공용 메뉴 격리 화면에서도 실행기 추론 미정/작업자 7초/전체 12초 분리 표시 확인. 모의 실패 전환 후 두 ETA 종료·원인·7123 MiB 피크 유지, 콘솔 오류 없음. 실행 명령 차단 및 임시 서버·탭 종료. 추가 발견: 포즈 파일과 프롬프트가 없는 초기 화면에서 영상 생성 설정 확인 버튼 활성. 공용 확인 연결에 readiness 미제공 확인, 입력 검증·확인 정책을 보존한 수정은 다음 검사 대상으로 남음."
video_worker_estimate_followup: "2026-10-15 실제 VACE V2V 2026-10-15_15-26-00-203fa0c7 기록에서 실행기 inference_estimate는 미정이나 현재 작업자는 추론 ETA를 계산함을 확인. 공용 영상 표시가 metrics만 읽어 누락하던 문제를 수정하여 서비스가 현재 실행 시도로 검증한 worker_metrics를 추론 참고값에 사용. 전체 ETA·VRAM 유지. 현재 작업자 7초·전체 23초 분리, 이전 시도 거절, 종료 시 갱신 종료 등 9건 통과(.tmp/test/video-worker-estimate/2026-10-15_16-42-16/summary.json). 실제 저장 기록 읽기 전용 대조에서 전체 미정·추론 784초 및 범위·표본 5개 표시 확인. Phantom 실제 Blocks·공용 메뉴 격리 브라우저에서 실행기 추론 미정·작업자 추론 7초·전체 12초가 구분되어 표시됨을 확인. 모의 실패로 전환한 5초 자동 갱신에서 두 ETA 종료·OOM 원인·7123 MiB 관측 피크 유지 확인. 콘솔 오류 없음. 검증 서버·탭 종료, 운영 작업 무변경. 실제 GPU 실패 검증 및 모든 영상 페이지별 검증을 대신하지 않음."
map_all_controls_followup: "2026-10-15 맵 선택·불러오기·건물 선택과 기본 표시 옵션, 캐릭터 검수의 바닥·그림자·외곽선·PNG 캡처에도 로더 성공 전 비활성·실패 시 유지 연결. 카메라만 수정한 이전 범위를 확장. 구성 회귀는 두 모드의 입력 초기 상태 및 15/23개 로더 출력 연결 확인, 7건 통과(.tmp/test/map-all-control-readiness/2026-10-15_16-26-09/summary.json). 캐릭터 실제 Blocks·공용 메뉴에 모의 모듈을 연결한 브라우저에서 실패 시 맵·건물·표시·바닥·PNG 캡처 비활성 및 원인 안내 확인. 성공 문서 전환 후 표시·바닥·캡처 활성 확인, 콘솔 오류 없음. 캡처 서비스는 차단하고 버튼을 실행하지 않음. 실제 렌더링 품질 검증과 구분."
map_camera_readiness_followup: "2026-10-15 초기 맵 로딩 중 5개 시점 버튼 활성 상태를 운영 화면과 소스에서 확인. 공용 브라우저 버튼에 초기 활성 인자를 추가하고 맵 로더 성공 후 활성·실패 시 비활성 유지 및 해결 안내 연결. 기존 브라우저 카메라 명령·서버 무왕복 유지. .tmp/test/map-camera-readiness/2026-10-15_16-22-57/summary.json 구성 회귀 6건 통과. 실제 맵 Blocks·공용 메뉴에 검증용 JS 모듈을 연결한 브라우저에서 실패 시 5개 버튼 비활성·원인·새로고침 안내 확인. 성공 문서로 전환 시 모두 활성, 회전 클릭의 모의 명령 완료 표시 확인. 콘솔 오류 없음, 임시 서버·탭 종료. 모의 모듈 검증이며 변경 후 운영 렌더러 재검증과 구분. 맵 선택·표시 옵션 전체 준비 상태를 수정한 것으로 주장하지 않음."
