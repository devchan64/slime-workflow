<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>타일맵 검수</title><style>
body{margin:0;background:#16212a;color:#e6eef5;font:14px system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:24px}.tile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}.tile-card,.panel{background:#202f3a;border:1px solid #3e5563;border-radius:12px;padding:16px}.tile-card h2{margin-top:0;font-size:16px}.tile-source{max-width:100%;display:block;image-rendering:auto;border-radius:8px;background:#52616c}.repeat-preview{height:300px;margin-top:12px;border-radius:8px;border:1px solid #4b6370;background-color:#5f7280;background-repeat:repeat;background-size:128px 128px}.map-preview{display:block;height:min(600px,65dvh);min-height:min(240px,50dvh);overflow:auto;background:#101923;border-radius:8px;padding:8px}.map-preview canvas{display:block;margin:auto;max-width:none}.warning{color:#ffd693}.missing{color:#ffb5b5}code{color:#a8d8ff}@media(max-width:600px){main{padding:12px}.repeat-preview{height:220px}}
.map-preview:focus-visible{outline:2px solid #b5d8ff;outline-offset:2px}#mapImageError{color:#ffb5b5;overflow-wrap:anywhere}.panel button[aria-disabled=true]{opacity:.6;cursor:wait}
</style><main><h1 id="title"></h1><p id="summary"></p><section class="tile-grid" id="tileGrid"></section><section class="panel" id="heightPanel" hidden><h2>높이 변화 미리보기</h2><img id="heightPreview" class="tile-source" alt="바닥과 벽 타일 높이 변화 미리보기"></section><section class="panel" id="mapPanel" hidden><h2 id="mapTitle"></h2><p>노란 테두리가 지정 타일입니다. 역할을 바꾸면 해당 타일에 후보를 적용해 비교합니다.</p><label>적용 역할 <select id="mapVariant" aria-describedby="mapImageError"></select></label><label>게임 카메라 배율 <input id="mapReviewZoom" type="range" min="0.5" max="2" step="0.1" value="2"><output id="mapReviewZoomValue">2.0×</output></label><p id="mapImageError" role="status"></p><p id="mapScrollHelp">지도 영역에 초점을 두고 방향키로 스크롤할 수 있습니다.</p><div class="map-preview" role="region" tabindex="0" aria-label="지도 미리보기 스크롤" aria-describedby="mapScrollHelp"><canvas id="mapCanvas" aria-label="선택한 타일을 적용한 지도 미리보기"></canvas></div></section><section class="panel"><h2>검수 경고</h2><ul id="warnings"></ul></section></main><script>
const tileReviewData=__TILE_REVIEW_DATA__;
const tileImageLookup=new Map();
const tileTimedOut=new Set();
const repeatModes={'repeat-x':['repeat-x','가로 반복'],'repeat-y':['repeat-y','세로 반복'],'repeat-both':['repeat','가로·세로 반복'],'none':['no-repeat','반복 없음']};
document.querySelector('#title').textContent=tileReviewData.assetId+' · 타일맵 검수';
document.querySelector('#summary').textContent=`${tileReviewData.tileSize.join(' × ')}px · ${tileReviewData.tileability} · 높이 ${tileReviewData.heightSteps}단계`;
for(const variantRecord of tileReviewData.variants){const card=document.createElement('section');card.className='tile-card panel';const heading=document.createElement('h2');heading.textContent=variantRecord.role;const image=document.createElement('img');image.className='tile-source';image.alt=variantRecord.role+' 최종 타일';const repeat=document.createElement('div');repeat.className='repeat-preview';repeat.hidden=true;const [repeatStyle,repeatLabel]=repeatModes[tileReviewData.tileability];repeat.style.backgroundRepeat=repeatStyle;repeat.setAttribute('role','img');repeat.setAttribute('aria-label',variantRecord.role+' · '+repeatLabel+' 미리보기');const repeatCaption=document.createElement('p');repeatCaption.textContent=repeatLabel+' 미리보기';repeat.style.backgroundSize=tileReviewData.tileSize[0]+'px '+tileReviewData.tileSize[1]+'px';const notice=document.createElement('p'),retry=document.createElement('button');notice.setAttribute('role','alert');retry.type='button';retry.textContent='타일 다시 불러오기';retry.setAttribute('aria-label',variantRecord.role+' 타일 다시 불러오기');retry.hidden=true;let pending=false,timer;const startTimer=()=>{clearTimeout(timer);timer=setTimeout(()=>{pending=false;tileTimedOut.add(variantRecord.role);retry.setAttribute('aria-disabled','false');repeat.hidden=true;retry.hidden=false;notice.textContent=variantRecord.role+' 타일 로드 시간이 초과됐습니다. 다시 불러오기를 시도하세요.';if(tileReviewData.mapPreview)drawMapPreview();},15000);};retry.onclick=()=>{if(pending)return;pending=true;tileTimedOut.delete(variantRecord.role);retry.setAttribute('aria-disabled','true');notice.textContent=variantRecord.role+' 타일을 다시 불러오는 중입니다.';startTimer();const url=new URL(variantRecord.file,location.href);url.searchParams.set('retry',String(Date.now()));image.src=url.href;if(tileReviewData.mapPreview)drawMapPreview();};image.onerror=()=>{clearTimeout(timer);pending=false;tileTimedOut.delete(variantRecord.role);retry.setAttribute('aria-disabled','false');repeat.hidden=true;retry.hidden=false;notice.textContent=variantRecord.role+' 타일을 불러오지 못했습니다. 다시 불러오기를 시도하세요.';};image.onload=()=>{clearTimeout(timer);pending=false;tileTimedOut.delete(variantRecord.role);retry.setAttribute('aria-disabled','false');const focused=document.activeElement===retry;repeat.style.backgroundImage='url('+JSON.stringify(image.src)+')';repeat.hidden=false;retry.hidden=true;notice.textContent='';if(focused){image.tabIndex=-1;image.focus();}};startTimer();image.src=variantRecord.file;card.append(heading,image,notice,retry,repeatCaption,repeat);document.querySelector('#tileGrid').append(card);tileImageLookup.set(variantRecord.role,image);}
if(tileReviewData.preview){const panel=document.querySelector('#heightPanel'),image=document.querySelector('#heightPreview'),notice=document.createElement('p'),retry=document.createElement('button');panel.hidden=false;notice.setAttribute('role','alert');retry.type='button';retry.textContent='높이 미리보기 다시 불러오기';retry.hidden=true;panel.append(notice,retry);let pending=false,timer;const startTimer=()=>{clearTimeout(timer);timer=setTimeout(()=>{pending=false;retry.setAttribute('aria-disabled','false');notice.textContent='높이 변화 미리보기 로드 시간이 초과됐습니다.';retry.hidden=false;},15000);};image.onerror=()=>{clearTimeout(timer);pending=false;retry.setAttribute('aria-disabled','false');notice.textContent='높이 변화 미리보기를 불러오지 못했습니다.';retry.hidden=false;};image.onload=()=>{clearTimeout(timer);pending=false;retry.setAttribute('aria-disabled','false');const focused=document.activeElement===retry;notice.textContent='';retry.hidden=true;if(focused){image.tabIndex=-1;image.focus();}};retry.onclick=()=>{if(pending)return;pending=true;retry.setAttribute('aria-disabled','true');notice.textContent='높이 변화 미리보기를 다시 불러오는 중입니다.';startTimer();const url=new URL(tileReviewData.preview,location.href);url.searchParams.set('retry',String(Date.now()));image.src=url.href;};startTimer();image.src=tileReviewData.preview;}
for(const warningText of tileReviewData.qualityWarnings){const warningItem=document.createElement('li');warningItem.className='warning';warningItem.textContent=warningText;document.querySelector('#warnings').append(warningItem);}
if(!tileReviewData.qualityWarnings.length){const item=document.createElement('li');item.textContent='기록된 검수 경고가 없습니다.';document.querySelector('#warnings').append(item);}
function drawMapPreview(){const mapPreviewData=tileReviewData.mapPreview;if(!mapPreviewData)return;const cameraZoomValue=Number(document.querySelector('#mapReviewZoom').value),tileWidth=64*cameraZoomValue,tileHeight=32*cameraZoomValue,margin=32;document.querySelector('#mapReviewZoomValue').textContent=cameraZoomValue.toFixed(1)+'×';document.querySelector('#mapReviewZoom').setAttribute('aria-valuetext',cameraZoomValue.toFixed(1)+'배');const canvas=document.querySelector('#mapCanvas');canvas.width=(mapPreviewData.columns+mapPreviewData.rows)*tileWidth/2+margin*2;canvas.height=(mapPreviewData.columns+mapPreviewData.rows)*tileHeight/2+margin*2;const drawContext=canvas.getContext('2d');const selectedRole=document.querySelector('#mapVariant').value,selectedVariantImage=tileImageLookup.get(selectedRole);const status=tileTimedOut.has(selectedRole) ? selectedRole+" 타일 로드 시간이 초과됐습니다. 해당 카드에서 다시 불러오세요." : !selectedVariantImage ? "선택할 타일 후보가 없습니다." : !selectedVariantImage.complete ? "선택한 타일 이미지를 불러오는 중입니다." : !selectedVariantImage.naturalWidth ? selectedRole+" 타일 이미지를 불러오지 못했습니다. 해당 카드에서 다시 불러오세요." : "";const statusElement=document.querySelector('#mapImageError');if(statusElement.textContent!==status)statusElement.textContent=status;const selectedCellKeys=new Set(mapPreviewData.targetCells.map(currentCellValue=>currentCellValue.column+','+currentCellValue.row));for(let rowIndex=0;rowIndex<mapPreviewData.rows;rowIndex++)for(let columnIndex=0;columnIndex<mapPreviewData.columns;columnIndex++){const centerX=margin+(columnIndex-rowIndex+mapPreviewData.rows)*tileWidth/2,centerY=margin+(columnIndex+rowIndex)*tileHeight/2;const cellKey=columnIndex+','+rowIndex;drawContext.save();drawContext.beginPath();drawContext.moveTo(centerX,centerY-tileHeight/2);drawContext.lineTo(centerX+tileWidth/2,centerY);drawContext.lineTo(centerX,centerY+tileHeight/2);drawContext.lineTo(centerX-tileWidth/2,centerY);drawContext.closePath();drawContext.clip();const terrainCode=mapPreviewData.terrainRows[rowIndex][columnIndex];drawContext.fillStyle=mapPreviewData.terrainCodes[terrainCode].color;drawContext.fill();if(selectedCellKeys.has(cellKey)&&!tileTimedOut.has(selectedRole)&&selectedVariantImage?.complete&&selectedVariantImage.naturalWidth>0)drawContext.drawImage(selectedVariantImage,centerX-tileWidth/2,centerY-tileHeight/2,tileWidth,tileHeight);drawContext.restore();drawContext.strokeStyle=selectedCellKeys.has(cellKey)?'#ffd55a':'#233742';drawContext.lineWidth=selectedCellKeys.has(cellKey)?2:1;drawContext.beginPath();drawContext.moveTo(centerX,centerY-tileHeight/2);drawContext.lineTo(centerX+tileWidth/2,centerY);drawContext.lineTo(centerX,centerY+tileHeight/2);drawContext.lineTo(centerX-tileWidth/2,centerY);drawContext.closePath();drawContext.stroke();}}
if(tileReviewData.mapPreview){document.querySelector('#mapPanel').hidden=false;document.querySelector('#mapTitle').textContent=tileReviewData.mapPreview.displayNameKo+' · 지정 타일 적용';for(const variantRecord of tileReviewData.variants){const option=document.createElement('option');option.value=variantRecord.role;option.textContent=variantRecord.role;document.querySelector('#mapVariant').append(option);}document.querySelector('#mapVariant').onchange=drawMapPreview;document.querySelector('#mapReviewZoom').oninput=drawMapPreview;for(const loadedImage of tileImageLookup.values()){loadedImage.addEventListener('load',drawMapPreview);loadedImage.addEventListener('error',drawMapPreview);}drawMapPreview();}
</script></html>
