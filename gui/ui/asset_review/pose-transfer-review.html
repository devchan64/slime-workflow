<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3참조 포즈 전이 비교</title><style>
body{margin:0;background:#14202a;color:#e9f1f6;font:14px system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:24px}.toolbar,.panel{background:#202f3a;border:1px solid #3e5563;border-radius:12px;padding:14px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:2}.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;margin-top:16px}.panel h2{margin:0 0 10px;font-size:16px}.stage{background:#111a22;min-height:320px;display:grid;place-items:center}.stage img{display:block;max-width:100%;max-height:52vh;image-rendering:auto}.strip{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:16px}.strip button{background:#263946;color:#e9f1f6;border:1px solid #526875;border-radius:6px;padding:4px}.strip button[aria-pressed=true]{border-color:#ffdc78;box-shadow:0 0 0 2px #ffdc7844}.strip img{width:100%;display:block}.muted{color:#aac0cb}@media(max-width:850px){.compare{grid-template-columns:1fr}.stage{min-height:240px}}
@media(max-width:850px){.toolbar{position:static}.strip{grid-template-columns:repeat(4,minmax(0,1fr))}main{padding:16px}}
:is(button,select,input):focus-visible{outline:2px solid #b5d8ff;outline-offset:2px}.strip button{min-width:0;min-height:40px;overflow-wrap:anywhere}.strip button span{display:block;font-size:.8em}.stage img{grid-area:1 / 1}.stage img[hidden]{display:none}.panel button[aria-disabled=true]{opacity:.6;cursor:wait}
</style><main><h1>3참조 포즈 전이 비교</h1><p class="muted" id="reportLabel"></p><div class="toolbar"><label>방향 <select id="directionChoice"></select></label><button id="previous">← 이전</button><button id="next">다음 →</button><span id="frameLabel" aria-live="polite"></span><label><input id="overlayToggle" type="checkbox" aria-describedby="overlayStatus">결과와 참조 겹치기</label><span id="overlayStatus" role="status"></span><label>투명도 <input id="overlayOpacity" type="range" min="0" max="100" value="45"></label></div><section class="compare"><article class="panel"><h2>Qwen 결과 캐릭터</h2><div class="stage"><img id="resultImage" alt="Qwen 결과 캐릭터"></div></article><article class="panel"><h2>리그 참조</h2><div class="stage"><img id="rigImage" alt="리그 참조"></div></article><article class="panel"><h2>OpenPose 참조</h2><div class="stage"><img id="openposeImage" alt="OpenPose 참조"></div></article></section><div class="strip" id="frameStrip" role="group" aria-label="프레임 선택"></div><p id="frameDetails"></p></main><script>
const overlayReference=document.createElement("img");overlayReference.alt="";overlayReference.hidden=true;document.querySelector("#resultImage").parentElement.prepend(overlayReference);
const overlayNotice=document.createElement('p'),overlayRetry=document.createElement('button');overlayNotice.setAttribute('role','alert');overlayRetry.type='button';overlayRetry.textContent='겹치기 다시 불러오기';overlayRetry.hidden=true;document.querySelector('#resultImage').closest('.panel').append(overlayNotice,overlayRetry);
const imageTimers=new WeakMap(),imageHandlers=new WeakMap();
function clearImageTimer(image){const timer=imageTimers.get(image);if(timer!==undefined){clearTimeout(timer);imageTimers.delete(image);}}
function armImageTimer(image){clearImageTimer(image);const handlers=imageHandlers.get(image);const timer=setTimeout(()=>{if(imageTimers.get(image)!==timer)return;imageTimers.delete(image);handlers.error();},15000);imageTimers.set(image,timer);image.onload=()=>{if(imageTimers.get(image)===timer)handlers.load();};image.onerror=()=>{if(imageTimers.get(image)===timer)handlers.error();};}
const overlayState={source:null,loaded:false,failed:false,pending:false};
overlayReference.onload=()=>{clearImageTimer(overlayReference);overlayState.loaded=true;overlayState.failed=false;overlayState.pending=false;const focused=document.activeElement===overlayRetry;syncOverlay();if(focused){const result=document.querySelector('#resultImage');result.tabIndex=-1;result.focus();}};
overlayReference.onerror=()=>{clearImageTimer(overlayReference);overlayState.loaded=false;overlayState.failed=true;overlayState.pending=false;syncOverlay();};
imageHandlers.set(overlayReference,{load:overlayReference.onload,error:overlayReference.onerror});
overlayRetry.onclick=()=>{if(overlayState.pending)return;overlayState.loaded=false;overlayState.failed=false;overlayState.pending=true;syncOverlay();const url=new URL(overlayState.source,location.href);url.searchParams.set('overlayRetry',String(Date.now()));armImageTimer(overlayReference);overlayReference.src=url.href;};
const imageRecovery=new Map();
for(const imageId of ['resultImage','rigImage','openposeImage']){
 const image=document.querySelector('#'+imageId),notice=document.createElement('p'),retry=document.createElement('button');
 notice.setAttribute('role','alert');retry.type='button';retry.textContent='이미지 다시 불러오기';retry.setAttribute('aria-label',image.alt+' 이미지 다시 불러오기');retry.hidden=true;image.after(notice,retry);
 image.onerror=()=>{clearImageTimer(image);const state=imageRecovery.get(image);state.loaded=false;state.pending=false;retry.setAttribute('aria-disabled','false');notice.textContent=image.alt+' 이미지를 불러오지 못했습니다.';retry.hidden=false;syncOverlay();};
 image.onload=()=>{clearImageTimer(image);const state=imageRecovery.get(image);state.loaded=true;state.pending=false;retry.setAttribute('aria-disabled','false');const focused=document.activeElement===retry;notice.textContent='';retry.hidden=true;if(focused){image.tabIndex=-1;image.focus();}if(imageId==='resultImage'){const thumb=document.querySelectorAll('#frameStrip button')[selectedFrame-1]?.children[0];if(thumb?.hidden)thumb.src=image.src;}syncOverlay();};
 imageHandlers.set(image,{load:image.onload,error:image.onerror});
 retry.onclick=()=>{const state=imageRecovery.get(image);if(state.pending)return;state.loaded=false;state.pending=true;retry.setAttribute('aria-disabled','true');notice.textContent=image.alt+' 이미지를 다시 불러오는 중입니다.';syncOverlay();const url=new URL(image.src,location.href);url.searchParams.set('retry',String(Date.now()));armImageTimer(image);image.src=url.href;};
 imageRecovery.set(image,{notice,retry,source:null,loaded:false,pending:false});
}
function setReviewImage(image,source){const state=imageRecovery.get(image);if(state.source===source)return;clearImageTimer(image);state.source=source;state.loaded=false;state.pending=false;state.notice.textContent='';state.retry.hidden=true;state.retry.setAttribute('aria-disabled','false');if(source===null)image.removeAttribute('src');else {armImageTimer(image);image.src=source;}}
function syncOverlay(){const reference=document.querySelector('#rigImage'),result=document.querySelector('#resultImage');const requested=document.querySelector('#overlayToggle').checked && imageRecovery.get(reference).loaded;if(requested && overlayState.source!==reference.src){overlayState.source=reference.src;overlayState.loaded=false;overlayState.failed=false;overlayState.pending=false;armImageTimer(overlayReference);overlayReference.src=reference.src;}const show=requested && overlayState.loaded;overlayReference.hidden=!show;overlayNotice.textContent=requested && overlayState.failed ? '겹치기 이미지를 불러오지 못했습니다.' : '';overlayRetry.hidden=!(requested && (overlayState.failed || overlayState.pending));overlayRetry.setAttribute("aria-disabled",String(overlayState.pending));const status=document.querySelector("#overlayStatus");const text=!document.querySelector("#overlayToggle").checked || show ? "" : !imageRecovery.get(reference).loaded ? "참조 이미지를 확인한 뒤 겹치기를 표시합니다." : overlayState.failed ? "겹치기 이미지를 다시 불러오세요." : "겹치기 이미지를 불러오는 중입니다.";if(status.textContent!==text)status.textContent=text;result.style.opacity=show ? Number(document.querySelector('#overlayOpacity').value)/100 : 1;}
const poseTransferData=__POSE_TRANSFER_DATA__;const directionLabels={down_left:'↙ 좌하',down_right:'↘ 우하',up_left:'↖ 좌상',up_right:'↗ 우상'};let selectedDirection='down_left',selectedFrame=1;const directionChoice=document.querySelector('#directionChoice');for(const directionName of Object.keys(directionLabels)){const option=document.createElement('option');option.value=directionName;option.textContent=directionLabels[directionName];directionChoice.append(option)}document.querySelector('#reportLabel').textContent=poseTransferData.report+' · 결과·리그·OpenPose 기준 비교';function currentDirection(){return poseTransferData.directions.find(record=>record.direction===selectedDirection)}function currentFrame(){return currentDirection().frames.find(record=>record.frame===selectedFrame)}function render(){const frame=currentFrame();for(const [elementId,roleName] of [['resultImage','result'],['rigImage','rig'],['openposeImage','openpose']]){const element=document.querySelector('#'+elementId);const file=frame.files[roleName];element.closest(".panel").hidden=!file;setReviewImage(element,file ? file.path : null);}syncOverlay();document.querySelector('#frameLabel').textContent=`${selectedFrame} / 8 프레임`;document.querySelector('#frameDetails').textContent=`${directionLabels[selectedDirection]} · ${frame.size.join(' × ')} · 모델 ${frame.modelRevision || "정보 없음"}`;document.querySelectorAll('#frameStrip button').forEach((button,index)=>button.setAttribute('aria-pressed',String(index+1===selectedFrame)))}function rebuildStrip(){const strip=document.querySelector('#frameStrip');strip.innerHTML='';for(let frameNumber=1;frameNumber<=8;frameNumber++){const button=document.createElement('button');const image=document.createElement("img");image.src=currentDirection().frames[frameNumber-1].files.result.path;image.alt="";button.setAttribute("aria-label",`${frameNumber}번 프레임`);const fallback=document.createElement("span");fallback.textContent="미리보기 없음";fallback.hidden=true;image.onerror=()=>{image.hidden=true;fallback.hidden=false;button.setAttribute("aria-label",`${frameNumber}번 프레임 · 미리보기 없음`);};image.onload=()=>{image.hidden=false;fallback.hidden=true;button.setAttribute("aria-label",`${frameNumber}번 프레임`);};button.append(image,document.createTextNode(String(frameNumber)),fallback);button.onclick=()=>{selectedFrame=frameNumber;render()};strip.append(button)}}directionChoice.onchange=()=>{selectedDirection=directionChoice.value;selectedFrame=1;rebuildStrip();render()};document.querySelector('#previous').onclick=()=>{selectedFrame=(selectedFrame+6)%8+1;render()};document.querySelector('#next').onclick=()=>{selectedFrame=selectedFrame%8+1;render()};for(const selector of ['#overlayToggle','#overlayOpacity'])document.querySelector(selector).oninput=render;rebuildStrip();render();</script></html>
