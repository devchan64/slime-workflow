prompt_ko: 가는 따뜻한 갈색 윤곽선과 부드러운 셀 음영을 사용하는 정돈된 2D 판타지 게임 일러스트레이션. 작은 디테일은 선명하게 묶인 형태로 단순화하면서 은은하게 그린 질감을
  유지한다. 그림자 경계는 부드럽게 이어가고 하이라이트를 절제하며 재질에 맞는 질감을 사용한다. 실루엣은 선명하고 읽기 쉽게 유지한다.
prompt: Refined 2D fantasy game illustration with fine warm brown outlines and soft cel shading. Simplify
  small details into clear grouped shapes while preserving subtle painted texture. Use gently softened
  shadow transitions, restrained highlights and material-appropriate texture. Keep silhouettes clear and
  readable.
