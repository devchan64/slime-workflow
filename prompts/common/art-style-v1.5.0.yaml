change_note: 선택한 부드러운 셀 음영을 바탕으로 작은 디테일을 줄이되 은은한 회화 질감은 유지하도록 정리했다. 조합 실험은 수행했으나 새 원문 자체의 별도 생성 검증은 전이다.
