prompt_ko: >-
  깔끔한 색면과 부드럽게 그린 형태를 사용하는 SLIME 미니어처 판타지 게임 일러스트레이션.
  따뜻한 갈색 윤곽선, 묶음 형태, 부드럽게 어우러지는 그림자와 절제된 하이라이트를 사용한다.
  부드러운 확산광을 적용하고 적절한 재질은 무광으로 표현한다.
  작은 크기에서도 실루엣이 선명하고 읽기 쉽게 유지한다.
prompt: >-
  SLIME miniature fantasy game illustration with clean color planes and softly painted forms. Use warm brown contours, grouped shapes, gently blended shadows and restrained highlights. Apply soft diffuse lighting and matte materials where appropriate. Keep silhouettes clear and readable at small sizes.
word_count: 42
