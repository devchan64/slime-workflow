prompt_ko: >-
  넓고 깔끔한 색면, 단순화된 둥근 형태, 부드럽게 어우러지는 세 단계 명암을 사용하는
  SLIME 미니어처 판타지 게임 일러스트레이션.
  묶음으로 정리된 회화적 형태, 좌상단의 부드러운 확산광,
  차분한 청록 회색 그림자와 절제된 하이라이트를 사용한다.
  적절한 재질에는 무광 표현을 유지하고 작은 크기에서도 실루엣이 명확하게 읽히도록 한다.
prompt: SLIME miniature fantasy game illustration with broad clean color planes, simplified rounded forms
  and three softly blended value groups. Use grouped painted shapes, soft upper-left diffuse lighting,
  muted teal-gray shadows and restrained highlights. Keep materials matte where appropriate and silhouettes
  readable at small sizes.
