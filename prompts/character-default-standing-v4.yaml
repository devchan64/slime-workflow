review_note: 방향마다 별도 호출한다. 4방향을 한 출력에 합치지 않는다. 2026-09-20_21-53-32 결과를 standing-v4로 채택했다. 양발 접지 중간 앵커를 사용하며 standing-v3는 폐기했다.
