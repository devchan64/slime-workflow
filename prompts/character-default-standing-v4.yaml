prompt_template: 첨부 2×2 베이스라인 캐릭터의 외형·화풍과 5등신 신체 비율을 유지한다. 원본의 머리 크기와 다리 길이를 바꾸지 않는다. {direction_instruction} 이
  방향만 사용하는 투명 배경 4열×1행 스탠딩 시트 한 장을 만든다. 왼쪽부터 중립 → 들숨 → 최대 들숨 → 날숨의 미세한 호흡 4프레임이며 마지막에서 처음으로 자연스럽게 반복한다. 네 프레임의 몸·얼굴
  방향, 카메라, 크기, 가로 기준점과 양발 접지선을 고정한다. 같은 크기의 완전한 전신을 셀 안에 여백을 두고 배치한다. 문자·격자선은 넣지 않는다.
