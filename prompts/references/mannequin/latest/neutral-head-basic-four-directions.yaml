prompt: Refine this exact gray neutral head mannequin four-view sheet WITHOUT changing
  facial feature proportions. Lock eye size and spacing, eyebrow thickness/length/location,
  nose height and projection, mouth width and thickness, and all feature positions
  exactly as reference. Clean up facial surface transitions and shading around eyelids,
  nose, cheeks, mouth and jaw for a coherent polished sculpt; remove uneven shading
  and minor contour artifacts. Preserve the existing head silhouette and neutral expression,
  not a redesign or beautification. Same bald gray matte head, neck, ears, white background,
  2x2 front/quarter/profile/back views, scale and lighting. No hair, makeup, labels
  or extra views. Keep all identity-defining proportions and the thin brows.
