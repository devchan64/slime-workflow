version: 2
recipe_id: monster-standing
generator: image_gen
mode: built-in
status: consolidated-historical-prompts
layout:
  rows: 4
  columns: 4
  row_directions:
  - down_left
  - down_right
  - up_left
  - up_right
merge_note: beast 중복은 현재 beast-idle-v2에 대응하는 확장판 개과형 프롬프트로 통합했다. 이전 멧돼지형 프롬프트는 폐기한다. 나머지 원문은 보존한다.
reference_policy: 종별 실제 참조 이미지와 해시를 실행 기록에 지정한다. 원래 호출의 입력 경로·해시는 복구되지 않아 최종 시트를 원래 입력으로 추정하지 않는다.
monsters:
  slime:
    prompt: 'Use case: stylized-concept. Create a production game IDLE STANDING animation sprite sheet using the attached image as strict identity, materials, palette and painterly lighting reference. The same faceless translucent teal-green gelatinous blob with internal bubbles. Absolutely no eyes, mouth, face, limbs. Idle motion: small volume-conserving squish and rise, base planted.

      Output one square transparent PNG, precisely 4 equal columns by 4 equal rows, exactly 16 isolated full-body sprites. No text, gridlines, labels, scenery, floor or cast shadows. Genuine transparent alpha background.

      Rows encode FIXED quarter-view facing: row 1 down_left (front left three-quarter), row 2 down_right (front right three-quarter), row 3 up_left (REAR left three-quarter, back visible), row 4 up_right (REAR right three-quarter, back visible). Each row has the SAME facing in all four columns. Do not rotate inside a row.

      Columns encode four consecutive phases of one subtle seamless standing loop: neutral rising, maximum inhale/rise, neutral falling, maximum exhale/squish. Fourth-to-first phase smoothly closes. Keep identical anatomy and details in all frames. No attack, skill, walk, foot switching, effects, duplicated limbs.

      Orthographic elevated quarter-view camera. Upper-left light in every cell; do not mirror lighting. Exact regular 4x4 grid layout with no gutters between cells, each sprite confined to central 80% of its equal square cell, same scale across every cell, ground anchor at 50% cell width and 88% cell height in every frame. Full silhouette fully within each cell including tusks, leaves, roots. Foot anchor stays still, no horizontal drift. Reference identity is more important than embellishments.'
    reference: null
    output: slime-frontend/src/assets/monsters/standing-v1/slime-idle-v1.png
    output_sha256: 49f3406198138dde492cadfc46fae245e84652ae25642ff1c1b3a21cfbddfdea
  beast:
    prompt: 'Use case: stylized-concept. Generate a transparent PNG idle animation sprite sheet. Attached image is the strict species identity, anatomy, palette and painterly style reference. Long-muzzled forest canine with low mane, four long legs and thin tail. Gentle breathing, four paws planted. NOT a boar, no tusks, no hooves.

      EXACT layout: 4 equal rows x 4 equal columns, 16 full-body sprites. Each cell is an equal square. Fit EVERY sprite entirely within central 70% of its cell, leave generous empty transparent margins, never touch cell boundary. No grid lines, labels or text.

      Row 1 fixed front-left quarter view facing down_left. Row 2 fixed front-right quarter view facing down_right. Row 3 fixed REAR-left quarter view facing up_left, show back. Row 4 fixed REAR-right quarter view facing up_right, show back. Four columns per row are consecutive phases neutral rising, peak inhale, neutral falling, peak exhale, smoothly returning to frame one. Moth uses spread, raised, spread, lowered wings instead. No turning within a row.

      Keep exact character identity and identical scale, limb count and foot contact points across frames. Soft upper-left screen lighting for ALL directions. Ground/body anchor fixed at horizontal center, 82% cell height. Orthographic elevated quarter camera. True alpha transparent background, no shadow, no ground, no scenery. No walking, stepping, attacks, skill effects. Idle subtle motion only.'
