version: 1
style_id: slime_painterly_diorama_v1
language: ko
status: 제작 기준 정의. 기존 에셋의 일괄 재생성 또는 구현 완료를 뜻하지 않음
assembly_order:
  - common
  - category
  - output
  - subject
  - negative
required_inputs:
  - category
  - output
  - subject
reference_policy: >-
  같은 버전의 기준 이미지를 스타일 참고로 함께 전달한다. 스타일 참고와 수정 대상을
  명확히 구분하며, 참고 이미지의 구도·글자·워터마크를 복제하지 않는다.
  생성 결과를 다음 생성의 기준으로 무조건 교체하지 않는다.
common: |-
  SLIME 공통 화풍 slime_painterly_diorama_v1을 적용한다.
  부드러운 손그림 질감과 입체적인 형태를 결합한 미니어처 판타지 게임 아트.
  차분하고 친근한 자연 판타지이며, 작은 화면에서도 실루엣과 재질이 명확해야 한다.
  큰 형태 → 중간 면 → 제한된 작은 디테일 순으로 표현한다.
  형태는 둥글고 부드럽게 단순화하되 대상의 고유한 해부 구조와 비율을 유지한다.
  붓결은 미세하고 정돈하며, 과도한 털·잎맥·표면 잡음보다 명암 덩어리를 우선한다.
  개체와 입체 오브젝트의 기본 시점은 위에서 비스듬히 내려다보는 3/4 게임 시점이다.
  광원은 화면 좌상단의 부드러운 확산광, 그림자는 차분한 청록 회색이다.
  반사광은 작고 절제하며 표면마다 거칠기와 투명도를 구분한다.
  청록을 시각적 연결색으로 사용하고, 자연물은 채도를 낮춘 녹색·갈색·황토색을 유지한다.
  슬라임만 촉촉한 반투명 젤 재질이며, 피부·천·나무·돌까지 젤이나 플라스틱처럼 만들지 않는다.
  윤곽은 배경과 구분될 정도로 선명하되 두꺼운 검은 만화 외곽선을 넣지 않는다.
  선택 강조·경고·전투 범위·숫자·UI 글자는 별도 레이어로 처리한다.
categories:
  monster: |-
    용도: 필드와 전투에서 함께 사용하는 단일 몬스터 스프라이트.
    한 개체만 전신으로 표현하고 종별 형태와 크기 비율을 유지한다.
    기본 방향은 화면 좌하단을 향한다. 방향 변형은 동일 개체의 비율·색·재질을 유지한다.
    선공 여부 때문에 몸체 전체를 빨간색으로 바꾸지 않는다. 상태는 런타임 표식으로 구분한다.
    슬라임인 경우 눈·입·코·귀·얼굴·감각기관·팔·다리를 절대 넣지 않는다.
    슬라임은 비대칭의 둥근 청록 젤 덩어리이며, 내부 기포가 눈 두 개나 얼굴처럼 배열되지 않는다.
    슬라임의 기본 높이는 사람의 0.5배다. 다른 몹은 지정된 크기 메타데이터를 따른다.
  character: |-
    용도: 플레이어 캐릭터의 전신 스프라이트 또는 캐릭터 창 초상화.
    사람 형태의 5등신을 고정한다. 머리 높이 1, 몸통 2, 다리 2의 비율이다.
    얼굴은 작고 간결하게, 손발과 의상의 주요 형태는 작은 크기에서도 구분되게 표현한다.
    의상은 천·가죽 등 명시한 소재를 따르며 과도한 장식·광택·무기를 임의로 추가하지 않는다.
    외형으로 고정 직업이나 능력치를 암시하지 않는다. 의상 변경에도 얼굴과 체형을 유지한다.
    게임 스프라이트의 기본 방향은 화면 좌하단이며, 초상화는 동일 인물의 정면 3/4 시점을 허용한다.
  terrain: |-
    용도: 같은 세계의 지면 텍스처·지형 오브젝트·단차 지형.
    잔디·흙·돌·나무·물의 재질을 명확히 구분하며 캐릭터보다 낮은 시각적 대비를 유지한다.
    통행 가능한 지면에는 눈에 띄는 바위·수풀 같은 장애물을 그리지 않는다.
    바위·수풀·나무는 지면과 분리한 오브젝트로 제작한다.
    입체 지형은 상단 면과 측면의 명암을 일관되게 유지하며 지정한 타일 경계와 높이를 따른다.
    단차나 장식 때문에 이동 경로·발 위치·선택 표시가 가려지는 구도를 피한다.
    맵마다 생태 색은 달라도 붓결·재질 해석·광원·형태 단순화 수준은 유지한다.
  ui: |-
    용도: SLIME의 패널·아이콘·버튼 또는 UI 디자인 시안.
    월드와 같은 청록 계열과 부드러운 형태 언어를 사용한다.
    UI는 정면의 평면 구성이며 월드용 등각 시점이나 입체 원근을 적용하지 않는다.
    어두운 청록 패널, 은은한 테두리, 절제된 모서리 곡률과 약한 깊이감을 사용한다.
    과도한 붓결·장식은 줄이고 텍스트와 버튼의 명도 대비를 우선한다.
    아이콘의 소재 표현만 월드의 손그림 질감을 사용하며 작은 크기에서 읽히도록 단순화한다.
    기본 배경 #081F23, 패널 #112D31, 주요 버튼 #55D6BE,
    밝은 강조 #9BECDC, 주요 버튼 글자 #082C29의 관계를 유지한다.
    텍스트는 밝은 회백색, 보조 텍스트는 저채도 블루그레이다.
    경고·위험·공격 범위의 의미색은 구분하고 색상 외에 아이콘이나 선 형태도 함께 사용한다.
    전투 정보는 현재 단계와 선택 대상에 필요한 것만 보여주는 위자드·오버레이 방식이다.
    모든 몹·지형·능력치 정보를 동시에 펼친 대시보드를 만들지 않는다.
outputs:
  sprite: |-
    출력: 개체 한 마리의 전신, 정사각형 캔버스, 실제 알파가 있는 투명 배경.
    몸체는 중앙에 배치하고 발 또는 바닥 접점은 아래쪽 중앙에 맞춘다.
    몸체의 긴 변이 캔버스의 약 85%를 차지하게 하며 머리·발·부속물이 잘리지 않게 한다.
    바닥판·환경 배경·투사 그림자·선택 테두리·체력바·이름표는 이미지에 굽지 않는다.
    그림자와 선택 표식은 런타임에서 합성한다. 체크무늬 배경을 그리지 않는다.
  portrait: |-
    출력: 같은 캐릭터의 흉상 또는 전신 초상화. 요청한 프레이밍만 사용한다.
    인물 식별 요소·5등신 체형·의상 재질을 게임 스프라이트와 일치시킨다.
    실제 투명 배경이며 프레임·능력치·버튼·텍스트를 넣지 않는다.
  ground_texture: |-
    출력: 지면 전용 정사각형 텍스처. 이 출력에서는 공통 3/4 시점 대신 정확한 탑뷰를 사용한다.
    화면 전체를 채우고 가장자리가 자연스럽게 반복되도록 만든다.
    원근·지평선·타일 테두리·돌출 오브젝트·방향성 강한 그림자를 넣지 않는다.
    대각선 타일 투영은 렌더러가 수행하므로 이미지 자체를 마름모로 만들지 않는다.
  terrain_object: |-
    출력: 단일 지형 오브젝트. 개체 스프라이트와 동일한 3/4 게임 시점과 광원.
    실제 투명 배경에 배치하고 바닥 접점을 아래쪽 중앙에 맞춘다.
    지면 텍스처나 임의의 바닥판·투사 그림자를 포함하지 않는다.
  ui_asset: |-
    출력: 정면의 단일 UI 아이콘 또는 장식 자산. 실제 투명 배경.
    글자·숫자·상태 값·선택 효과를 굽지 않는다. 요소의 윤곽과 여백을 정돈한다.
    반복 패널·버튼·글자는 실제 구현에서 CSS 또는 벡터를 사용한다.
  ui_concept: |-
    출력: 지정된 화면 하나의 UI 디자인 시안. 실제 기능 구현이나 배포용 UI 자산으로 간주하지 않는다.
    요청한 화면 크기와 현재 단계에 맞춰 정보 위계를 구성한다.
    반드시 필요한 제목·버튼 문구만 요청에 제공된 한국어 그대로 사용한다.
    임의 숫자·가짜 상태·가짜 메뉴·워터마크·로고 문구를 추가하지 않는다.
allowed_outputs:
  monster: [sprite]
  character: [sprite, portrait]
  terrain: [ground_texture, terrain_object]
  ui: [ui_asset, ui_concept]
subject_template: |-
  제작 대상: {subject}
  필수 형태·비율·재질: {invariants}
  방향·포즈·프레이밍: {pose}
  용도와 출력 규격: {usage}
  기준 이미지의 역할: {reference_role}
negative: |-
  제외: 실사 사진, 포토리얼 피부·털, 픽셀아트, 셀 셰이딩 애니메이션,
  각진 로우폴리 면, 굵은 검은 외곽선, 과도한 SD·2등신 비율, 네온 SF,
  금박 바로크 UI, 양피지 배경 UI, 강한 렌즈 효과, 과도한 블룸,
  검은 그림자 덩어리, 뭉개진 윤곽, 작은 크기에서 노이즈가 되는 세부 묘사,
  서로 다른 광원과 시점, 임의의 장비·추가 개체·장식, 워터마크.
  텍스트는 ui_concept에 명시적으로 제공한 문구만 허용하고 다른 출력에는 넣지 않는다.
